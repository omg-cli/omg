[package]
name = "omg"
version = "0.1.223"
edition = "2024"
rust-version = "1.95.0"
description = "The Fastest Unified Package Manager for Arch Linux + All Language Runtimes"
authors = ["OMG Team"]
license = "MIT"
repository = "https://github.com/omg-cli/omg/"
readme = "README.md"
keywords = ["package-manager", "arch-linux", "version-manager", "runtime"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.cargo-machete]

[lib]
name = "omg_lib"
path = "src/lib.rs"

[[bin]]
name = "omg"
path = "src/bin/omg.rs"

[[bin]]
name = "omgd"
path = "src/bin/omgd.rs"

# Criterion benchmarks. Each target defines its own entry point via
# `criterion_main!`, so every one MUST declare `harness = false`; with the
# default libtest harness rustc skips its injected main and criterion never
# executes (cargo bench would silently run 0 benchmarks).
[[bench]]
name = "bloom_filter_bench"
harness = false

[[bench]]
name = "count_bench"
harness = false

[[bench]]
name = "daemon_benchmark"
harness = false

[[bench]]
name = "debian_bench"
harness = false

[[bench]]
name = "debian_core_bench"
harness = false

[[bench]]
name = "decompression_bench"
harness = false

[[bench]]
name = "install_bench"
harness = false

[[bench]]
name = "io_bench"
harness = false

[[bench]]
name = "package_operations"
harness = false

[[bench]]
name = "pacman_comparison"
harness = false
required-features = ["arch"]

[[bench]]
name = "parallel_bench"
harness = false

[[bench]]
name = "real_world_benchmark"
harness = false

# ----------------------------------------------------------------------------
# Version pinning policy
# - crates.io deps use caret requirements; the committed Cargo.lock is the
#   reproducibility authority. Bump ranges deliberately and review lockfile
#   diffs (unexpected duplicates, new proc macros, new build scripts).
# - The archlinux/alpm git family is pinned by exact version (`=`) AND full
#   commit rev for supply-chain integrity. Updates require a deliberate rev
#   bump applied to ALL five alpm-* entries together (same repo commit).
# - sequoia-openpgp tracks the stable 2.x line (currently 2.4.1). The PQC
#   pre-release experiment ended: post-quantum algorithms ship only in
#   `-pqc` pre-releases until the standards ratify, so stable is the
#   correct target for signature verification use. The experimental-crypto
#   build flags stay because sequoia's RustCrypto backend requires the
#   opt-in to compile at all, not because PQC algorithms are enabled.
# ----------------------------------------------------------------------------
[dependencies]

# CLI Framework
clap = { version = "4.5.60", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.3"                                                      # Man page generation

# Error handling
anyhow = "1.0.103"
thiserror = "2.0.17"

# Async runtime
tokio = { version = "1.49", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "process",
  "fs",
  "io-util",
  "io-std",
  "sync",
  "signal",
  "time",
] }
futures = "0.3.32"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = { version = "1.0.3", features = ["preserve_order"] }
# Comment- and key-preserving config rewrites in settings.rs save().
toml_edit = "0.25"
bitcode = { version = "0.6", features = ["serde"] }

# HTTP client (zstd for faster compressed downloads, read_timeout for reliability)
reqwest = { version = "0.13.1", features = [
  "json",
  "stream",
  "gzip",
  "brotli",
  "zstd",
] }
httpdate = "1.0.3"

# Filesystem
tokio-util = { version = "0.7.18", features = ["io", "codec", "rt"] }

# Archives + compression (zlib-rs = pure Rust SIMD-accelerated zlib, ~2x faster than miniz_oxide)
tar = "0.4.46"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
lz4_flex = { version = "0.14.0", default-features = false, features = [
  "frame",
] }
zip = { version = "8.1.0", default-features = false, features = [
  "deflate",
  "time",
] }
lzma-rs = "0.3" # Pure Rust XZ/LZMA (replaces xz2)
regex = "1.12.2"
ruzstd = "0.9.0" # Pure Rust zstd decoder (replaces zstd)

# Git operations - using command-line git (always available on Arch)

# Memory management
zerocopy = { version = "0.8", features = ["derive"] }
dashmap = "6.1.0"
moka = { version = "0.12", features = ["sync"] }
memchr = "2.7" # SIMD-accelerated string search
memmap2 = "0.9.11"
mimalloc = { version = "0.1", default-features = false, features = [
  "v3",
] } # v3: lock-free, lower memory
rustc-hash = "2.1" # FxHash - faster non-cryptographic hashing
fst = "0.4" # Finite State Transducer for O(1) search

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

# Progress bars
indicatif = "0.18.4"

# Colors/TTY
owo-colors = "4.3.0"
console = "0.16.2"
supports-color = "3.0.0"
colorgrad = "0.8"

# Interactive prompts
dialoguer = "0.12.0"
csv = "1.3"
comfy-table = "=7.2.2"
unicode-width = "0.2"

# File watching
notify = "8.2"

# Configuration
home = "0.5.12"

# Cryptography
# Pinned: SLSA/Fulcio verifier was audited against these exact APIs.
sha2 = "=0.10.9"
hex = "0.4.3"
base64 = "0.23"
# SLSA/Sigstore verification: RSA (PKCS#1 v1.5, SPKI keys) and P-256 ECDSA
rsa = { version = "0.9" }
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
p384 = { version = "=0.13.1", features = ["ecdsa", "pkcs8"] }
x509-parser = { version = "=0.18.1", default-features = false, features = ["verify"] }

# System calls (for disk space checks, etc.)
nix = { version = "0.31", features = ["fs", "signal", "user"] }

# Date & Time
jiff = { version = "0.2.21", features = ["serde"] }

# Random number generation (for jitter)

# Database (PURE RUST embedded DB - replaces LMDB)

# Direct libalpm bindings (for transactions - install/remove/upgrade)
alpm = { version = "5.0.2", optional = true }

# Official Arch Linux pure Rust ALPM ecosystem (archlinux/alpm)
# Pinned to a single monorepo snapshot (alpm-srcinfo/0.6.3 tag) which carries
# types 0.11.2, db 0.2.2, repo-db 0.1.2 and srcinfo 0.6.3 for supply-chain security.
# Revs correspond to: types 0.11.2 (2026-03-15, adds PackageOption::PEStrip),
# srcinfo 0.6.3, db 0.2.2 + repo-db 0.1.2 (canonicalized error variants).
# Reviewed 2026-08-31 against upstream tags; refresh quarterly.
alpm-types = { version = "=0.11.2", git = "https://gitlab.archlinux.org/archlinux/alpm/alpm.git", package = "alpm-types", rev = "d8967aa5101aaacb6e92b3d3f8e706987246a2ab", optional = true }
alpm-srcinfo = { version = "=0.6.3", git = "https://gitlab.archlinux.org/archlinux/alpm/alpm.git", package = "alpm-srcinfo", rev = "d8967aa5101aaacb6e92b3d3f8e706987246a2ab", optional = true }
alpm-db = { version = "=0.2.2", git = "https://gitlab.archlinux.org/archlinux/alpm/alpm.git", package = "alpm-db", rev = "d8967aa5101aaacb6e92b3d3f8e706987246a2ab", optional = true }
alpm-repo-db = { version = "=0.1.2", git = "https://gitlab.archlinux.org/archlinux/alpm/alpm.git", package = "alpm-repo-db", rev = "d8967aa5101aaacb6e92b3d3f8e706987246a2ab", optional = true }

# Process execution
which = "8.0"

# Semver handling
semver = "1.0.27"

# Tempfile handling
tempfile = "3.25.0"

# URL encoding (for DNF/COPR API)
urlencoding = "2.1"

# Data parallelism
rayon = "1.11.0"

# Pacman IgnorePkg/IgnoreGroup shell-style pattern matching
# (already present transitively; direct because the Arch cache path uses it)
globset = { version = "0.4.18", optional = true }

# Security (Phase 4.2) - PURE RUST crypto backend (for package verification, not secrets)
sequoia-openpgp = { version = "2", default-features = false, features = [
  "crypto-rust",
  "allow-experimental-crypto",
  "allow-variable-time-crypto",
], optional = true }
nucleo-matcher = "0.3.1"
dirs = "6.0.0"
ahash = "0.8.12"
uuid = { version = "1.21", features = ["v4"] }
# crossterm is the only backend in use; default features would additionally
# pull termwiz (and its transitive yanked `spin` chain flagged by cargo-audit).
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
rust-apt = { version = "0.10.0", optional = true }
rustix = { version = "1.1", features = ["fs", "process"] }

# Debian/Ubuntu package support
ar = { version = "0.9", optional = true } # Pure Rust .ar archive parsing
rkyv = { version = "0.8.17", features = [
  "bytecheck",
  "little_endian",
  "aligned",
] } # Zero-copy deserialization
whoami = "2.0.2"
governor = "0.10.4"
jsonwebtoken = { version = "11.0.0", default-features = false, features = [
  "rust_crypto",
] } # >=10.3.0 required: CVE-2026-25537 fix
sentry = { version = "0.49.0", default-features = false, features = [
  "anyhow",
  "tracing",
  "logs",
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls",
] }
sentry-tracing = "0.49.0"

# Cross-platform package manager support
rusqlite = { version = "0.40", features = [
  "bundled",
], optional = true } # SQLite for RPM db
cvss = "2.2.0"

[dev-dependencies]
tokio = { version = "1.49", features = ["test-util"] }
rcgen = "=0.13.2"
criterion = { version = "0.8", features = ["html_reports"] }
assert_cmd = "2.1"
proptest = "1.4"                                             # Property-based testing
serial_test = "4.0.1"                                          # Serialize tests that modify global state
scopeguard = "1.2"
temp-env = "0.3"
zstd = "0.13"                                                # For decompression benchmarks

# Maximum optimization for production releases
[profile.release]
lto = "fat"         # Full LTO for maximum cross-crate inlining
codegen-units = 1   # Maximum optimization, slower builds
panic = "unwind"    # CRITICAL: Required for catch_unwind to work in release builds
strip = true
opt-level = 3       # Maximum optimization
incremental = false # LTO incompatible with incremental

# Fast release builds (4-5x faster than release, ~5% slower runtime)
[profile.bench]
inherits = "release"
debug = true         # Keep debug info for profiling

# PGO Phase 1: Instrumentation (collect profile data)
# Minimal optimization - just needs to run workload, not be fast
[profile.pgo-instrument]
inherits = "release"
lto = false          # No LTO during instrumentation (avoids MIR inliner crashes)
codegen-units = 16   # Maximum parallelism, minimum optimization pressure
opt-level = 2        # Reduce optimization (less MIR complexity)
debug = false
incremental = false
strip = false        # Keep symbols for better profiling

# PGO Phase 2: Optimized build (use profile data)
# Thin LTO is safe when using profile data (not generating it)
[profile.release-pgo]
inherits = "release"
lto = "thin"         # Thin LTO is safe with profile-use (not profile-generate)
codegen-units = 8    # Balanced optimization
opt-level = 3        # Maximum runtime performance

# Faster dev builds for iteration
[profile.dev.package."*"]
opt-level = 2 # Optimize dependencies in dev mode

[profile.dev]
opt-level = 0
debug = true
incremental = true
split-debuginfo = "unpacked" # Faster linking on Linux

# ----------------------------------------------------------------------------
# Feature policy
#
# Platform features (arch / debian / debian-pure / fedora / macos) are additive
# and designed to compose. `pgp` gates signature verification
# (sequoia-openpgp); `license` gates ONLY the `omg account` CLI subcommand
# (link/status/unlink). Team/Enterprise/Fleet commands and the core
# dashboard-identity JWT machinery (core/license.rs) compile in every
# combination. They are not feature-gated.
#
# RELEASE FEATURE POLICY: every platform artifact explicitly enables its
# backend plus `pgp,license`. PGP uses the pure-Rust Sequoia backend above, so
# no platform requires a reduced-security artifact. The primary CI platform
# matrix uses the exact same feature sets as release.yml.
# ----------------------------------------------------------------------------
[features]
default = ["arch", "license", "pgp"]
arch = [
  "alpm",
  "alpm-types",
  "alpm-srcinfo",
  "alpm-db",
  "alpm-repo-db",
  "globset",
]
# Optional PGP verification of package signatures (sequoia-openpgp).
# Built against the MSRV pinned in rust-toolchain.toml / package.rust-version.
pgp = ["sequoia-openpgp"]

# Debian/Ubuntu support - unified feature
# Requires libapt-pkg-dev: `apt install libapt-pkg-dev`
debian = ["ar", "rust-apt"]

# Pure Rust Debian support (no FFI, no system dependencies) - for testing/indexing
debian-pure = ["ar"]

# Fedora/RHEL support (DNF/RPM) - Pure Rust, no system dependencies
fedora = ["rusqlite"]

# macOS/Homebrew support - Pure Rust
macos = []

license = [
] # Gates the `omg account` CLI subcommand only; Team/Enterprise/Fleet are ungated (see feature policy above)
docker_tests = [] # Enable tests that require running as root (e.g. in Docker)

# ============================================================================
# Lint Configuration (Rust 1.93 / Edition 2024)
# ============================================================================
[lints.rust]
# Kept at "warn" instead of "forbid": src/ contains a small amount of reviewed
# unsafe (memmap2 Mmap::map in package_managers/debian_db/db.rs and similar
# zero-copy read paths). Each site carries a SAFETY contract; raising to
# "forbid" requires isolating that unsafe behind a dedicated low-level module
# (RUST-CODING-STANDARDS §7) and is tracked for a source-scope wave.
unsafe_code = "warn"

[lints.clippy]
# Enable pedantic lints as warnings (production-ready baseline)
pedantic = { level = "warn", priority = -1 }
# Enable nursery lints that are stable and useful
nursery = { level = "warn", priority = -1 }
# Deny critical correctness issues - these indicate real bugs
correctness = { level = "deny", priority = -1 }

# Production safety lints
dbg_macro = "deny"     # Never ship debug macros to production
todo = "warn"          # Track incomplete code
unimplemented = "warn" # Track unimplemented code paths
# Note: unwrap/expect warnings disabled - too noisy for CLI with 48+ legitimate uses
# Note: print_stdout/stderr disabled - CLI tool intentionally uses println!

# Rust 1.93 / Edition 2024 optimization lints
missing_const_for_fn = "warn" # Find const fn opportunities
redundant_clone = "warn"       # Detect unnecessary clones
large_enum_variant = "warn"    # Warn on >200 byte enum variants

# Project-specific allowances (with justification)
module_name_repetitions = "allow"     # e.g., PackageManager in package_managers module
too_many_arguments = "allow"          # CLI functions legitimately need many args
too_many_lines = "allow"              # CLI and package-manager functions are inherently long
items_after_statements = "allow"      # Local helpers after early returns are clearer
cast_possible_truncation = "allow"    # Size conversions are reviewed at call sites
cast_sign_loss = "allow"              # Size conversions are reviewed at call sites
cast_precision_loss = "allow"         # Display/progress math uses f64 from integers
type_complexity = "allow"             # Resolver and async types are inherently nested
option_if_let_else = "allow"          # Pattern is often clearer with if-let
use_self = "allow"                    # Explicit types are clearer sometimes
redundant_pub_crate = "allow"         # Crate visibility is intentional
multiple_crate_versions = "allow"     # Transitive deps we don't control
missing_errors_doc = "allow"          # Error docs not always needed for internal fns
missing_panics_doc = "allow"          # Panic docs not always needed for internal fns
must_use_candidate = "allow"          # Too noisy - we handle this case-by-case
similar_names = "allow"               # e.g., pkg vs pkgs is intentional and clear
doc_markdown = "allow"                # Too strict on technical terms like CLI flags
struct_excessive_bools = "allow"      # Config structs legitimately have bool fields
fn_params_excessive_bools = "allow"   # CLI functions need bool flags for options
significant_drop_tightening = "allow" # False positives with lock guards in closures
