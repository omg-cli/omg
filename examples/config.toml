# OMG Configuration Example
# Default location: ~/.config/omg/config.toml
#
# This file demonstrates all available configuration options with explanations.
# Uncomment and modify values as needed for your setup.

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Enable telemetry (default: false; opt-in)
# Runtime opt-out: OMG_DISABLE_TELEMETRY=1 or OMG_TELEMETRY=0
# OMG_NO_TELEMETRY=1 applies only to installer consent.
#telemetry_enabled = false

# Data and socket paths are resolved from the environment, not this file.

# ============================================================================
# AUR BUILD SETTINGS (Arch Linux only)
# ============================================================================

[aur]

# Optional restrictive admission profile. Default: "standard".
# Hardened requires offline bubblewrap, source review and secure_makepkg.
# It rejects install hooks, privilege-bearing files and system integration,
# and requires a second matching build for every accepted AUR output.
# Enable with: omg config set aur.security_profile hardened
#security_profile = "standard"

# Build method for AUR packages (default: "bubblewrap")
# Options:
# - "bubblewrap": Sandboxed builds using bubblewrap (most secure)
# - "chroot": Builds in a clean chroot (secure, slower)
# - "native": Direct builds (fast, less secure)
#build_method = "bubblewrap"

# Maximum concurrent AUR builds (default: 1; max: 8)
# Adjust based on available RAM (each build can use 1-2GB)
#build_concurrency = 4

# Require interactive PKGBUILD review before building (default: true)
# Disable only for CI that accepts unreviewed AUR code (`aur.review_pkgbuild = false`), or:
#review_pkgbuild = true

# Use stricter makepkg flags (default: true)
# Enables: --cleanbuild, --verifysource
#secure_makepkg = true

# Allow native builds without sandboxing (default: false)
# Set to false to enforce bubblewrap/chroot only
#allow_unsafe_builds = false

# Use AUR metadata archive for bulk update checks (default: true)
# Speeds up checking for updates across many packages
#use_metadata_archive = true

# Metadata archive cache TTL in seconds (default: 300 = 5 minutes)
#metadata_cache_ttl_secs = 300

# Custom MAKEFLAGS (overrides auto -jN)
# Example: "-j4" to limit parallel make jobs
#makeflags = "-j8"

# Legacy custom PKGDEST. Accepted for compatibility but ignored.
# Outputs always use private per-invocation storage.
#pkgdest = "/var/cache/omg/packages"

# Legacy custom SRCDEST. Accepted for compatibility but ignored.
# Sources always use private per-invocation storage.
#srcdest = "/var/cache/omg/sources"

# Legacy build cache toggle (default: false). Persistent reuse is disabled.
#cache_builds = false

# Enable ccache integration (default: false)
# Speeds up C/C++ compilation by caching object files
#enable_ccache = false

# Legacy ccache directory, ignored. Compiler caches are invocation-local.
#ccache_dir = "/home/user/.cache/ccache"

# Enable sccache integration (default: false)
# Alternative to ccache, supports Rust compilation caching
#enable_sccache = false

# Legacy sccache directory, ignored. Compiler caches are invocation-local.
#sccache_dir = "/home/user/.cache/sccache"

# ============================================================================
# EXAMPLE CONFIGURATIONS
# ============================================================================

# --- Concurrent Sandboxed Builds ---
# Retains the default sandbox and review settings:
#
# [aur]
# build_concurrency = 8
# enable_ccache = true

# --- Security-Hardened Setup ---
# Example sandboxed settings with reduced concurrency:
#
# [aur]
# security_profile = "hardened"
# build_method = "bubblewrap"
# build_concurrency = 4
# review_pkgbuild = true
# secure_makepkg = true
# allow_unsafe_builds = false
# cache_builds = false

# Unattended builds are a separate trust decision. Hardened source review and
# exceptional archive approval require an attended terminal. See docs/aur.md.
