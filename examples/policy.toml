# ============================================================================
# NOTES
# ============================================================================

# Security Grading Explained:
#
# 1. LOCKED:
#    - Retained enum value, not produced by ordinary grading
#    - No SLSA or PGP receipt is an input to grade assignment
#    - Requiring it rejects ordinary official and community packages
#
# 2. VERIFIED:
#    - Official source with no matched vulnerability
#    - Source-only prechecks cannot establish cryptographic evidence
#
# 3. COMMUNITY:
#    - Community sources, including AUR and local archives
#    - No matched vulnerability when grading uses the scanner
#    - Does not itself certify signatures or checksums
#
# 4. RISK (Vulnerabilities):
#    - Allows packages with known CVEs
#    - NOT recommended for any production use
#    - Use only for testing/debugging

# How OMG Enforces Policies:
#
# 1. Before installation, OMG assigns a security grade to each package
# 2. If grade < minimum_grade, installation is blocked
# 3. If package is in banned_packages, installation is blocked
# 4. If license not in allowed_licenses (and list is non-empty), blocked
# 5. If AUR package and allow_aur=false, installation is blocked
# 6. require_pgp rejects community sources and forces ALPM mandatory signatures
# Explicit-policy scan failures propagate rather than receiving a source-grade fallback.
#
# Inspect policies:
# - Use `omg audit policy` to show the local policy
# - There is no install --force policy bypass or policy check <package> command
