# OMG Security Policy Example
# Default location: ~/.config/omg/policy.toml
#
# This file defines security policies for package installations.
# ALPM enforces explicit policies on the prepared dependency transaction.
# Native APT, DNF and Homebrew refuse explicit OMG package policies.

# ============================================================================
# SECURITY GRADING
# ============================================================================

# Minimum security grade required for installations (default: "Community")
# Options (from most to least restrictive):
# - "Locked": enum value not assigned by ordinary install grading; rejects it
# - "Verified": official source with no matched vulnerability, not a signature receipt
# - "Community": community/local source with no matched vulnerability (default)
# - "Risk": Allow packages with known vulnerabilities (NOT recommended)
#
# Example: Require the official-source grade, separate from signature enforcement
#minimum_grade = "Verified"

# Example: Block installations with known vulnerabilities
minimum_grade = "Community"

# ============================================================================
# AUR PACKAGES
# ============================================================================

# Allow installing AUR packages (default: true)
# Set to false to reject community sources, including AUR and local archives
#allow_aur = true

# Require ALPM package signatures (default: false)
# Sets mandatory signature flags on repositories and default/local/remote transactions.
# Source-grade prechecks also reject community/local inputs; grades are not receipts.
#require_pgp = false

# ============================================================================
# LICENSE RESTRICTIONS
# ============================================================================

# Allowed licenses (default: empty = all licenses allowed)
# Uncomment to restrict installations to specific licenses
#
# Example: Only allow open-source licenses
#allowed_licenses = [
#    "MIT",
#    "Apache-2.0",
#    "GPL-2.0",
#    "GPL-3.0",
#    "BSD-2-Clause",
#    "BSD-3-Clause",
#    "LGPL-2.1",
#    "LGPL-3.0",
#    "MPL-2.0",
#    "ISC",
#]

# Example: Corporate-approved licenses only
#allowed_licenses = ["MIT", "Apache-2.0", "BSD-3-Clause"]

# ============================================================================
# PACKAGE BANS
# ============================================================================

# Banned packages (default: empty)
# Prevents installation of specific packages by name
#
# Example: Block packages known to have security issues
#banned_packages = [
#    "vulnerable-package",
#    "deprecated-tool",
#    "untrusted-binary",
#]

# Example: Block cryptocurrency miners
#banned_packages = ["cpuminer", "ethminer", "xmrig"]

# ============================================================================
# EXAMPLE POLICIES
# ============================================================================

# --- Locked Grade Rejection Example ---
# Not an install-approval preset: Locked is not assigned by ordinary grading.
#
# minimum_grade = "Locked"
# allow_aur = false
# require_pgp = true
# allowed_licenses = ["MIT", "Apache-2.0", "BSD-3-Clause"]
# banned_packages = []

# --- Developer Workstation (Balanced) ---
# Uncomment for reasonable security with flexibility:
#
# minimum_grade = "Verified"
# allow_aur = true
# require_pgp = false
# allowed_licenses = []  # Allow all licenses
# banned_packages = ["cpuminer", "xmrig"]  # Block miners

# --- Open Source Project (Permissive) ---
# Uncomment for maximum flexibility:
#
# minimum_grade = "Community"
# allow_aur = true
# require_pgp = false
# allowed_licenses = []
# banned_packages = []

