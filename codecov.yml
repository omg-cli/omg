# Codecov's project status compares coverage with the base commit. The required
# GitHub coverage job separately enforces both LLVM summary and mapped-line
# coverage against the exact base artifact, including when Codecov is unavailable.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: auto
        # New code may land slightly below the project level without noise;
        # the project ratchet is the gate that matters.
        threshold: 5%

comment:
  layout: "condensed_header, diff, files"
  require_changes: false
