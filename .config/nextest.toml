[store]
dir = "target/nextest"

[profile.default]
test-threads = "num-cpus"
fail-fast = true
status-level = "pass"
final-status-level = "fail"
retries = 1

# These regressions must fail on their first failure: a successful retry can
# conceal a lost update or first-creation lock race. Default overrides apply
# to every profile, including ci and ci-junit, ahead of profile-wide retries.
[[profile.default.overrides]]
filter = 'test(=core::usage::tests::concurrent_locked_updates_do_not_lose_counters) | test(=core::usage::tests::locked_sync_timestamp_merge_does_not_lose_concurrent_counters) | test(=core::usage::tests::simultaneous_first_usage_locks_share_one_inode)'
retries = 0

# Generated counterexamples are regression evidence. A new random run must
# not turn the first failure into a green result or waste a second campaign.
[[profile.default.overrides]]
filter = 'binary(=property_tests)'
retries = 0

# Parser inventory and its exact grammar assertions are deterministic gates.
[[profile.default.overrides]]
filter = 'binary(=cli_surface) | test(=tests::export_omgd_surface) | test(=tests::socket_parser_preserves_literal_paths_and_rejects_conflicting_repeats)'
retries = 0

# Isolated Debian fixture contracts must not hide their first failure.
[[profile.default.overrides]]
filter = 'test(=test_parse_disabled_source) | test(=test_cli_status_shows_debian_info) | test(=test_cli_debian_respects_ci_mode) | test(=cli_receipt_rejects_a_different_product_executable) | test(=apt_integration::test_update_check_with_mock_updates)'
retries = 0

# Production transport and shutdown failures must remain first-attempt failures.
[[profile.default.overrides]]
filter = 'binary(=coverage_18) | binary(=cli_comprehensive) | binary(=git_hooks_contract)'
retries = 0

# Alias cycles and path escapes are deterministic failures, never retryable.
[[profile.default.overrides]]
filter = 'test(core::task_runner::tests::resolve_nvm_alias_) | test(hooks::tests::resolve_nvm_alias_) | test(=nvm_alias_task_executes_the_selected_node_binary) | test(=nvm_directory_without_executable_node_never_starts_the_task)'
retries = 0

[profile.ci]
test-threads = "num-cpus"
fail-fast = false
status-level = "all"
final-status-level = "all"
retries = { backoff = "exponential", count = 2, delay = "1s", jitter = true }
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
report-name = "omg-tests"
# Runtime [omg-skip] early returns must remain distinguishable from execution.
store-success-output = true
store-failure-output = true

[profile.ci-junit]
test-threads = "num-cpus"
fail-fast = false
retries = { backoff = "exponential", count = 2, delay = "1s", jitter = true }
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci-junit.junit]
path = "junit.xml"
report-name = "omg-tests"

[profile.dev]
test-threads = 4
fail-fast = true
status-level = "pass"
retries = 0

[profile.heavy]
test-threads = 2
fail-fast = false
retries = 1
slow-timeout = { period = "120s", terminate-after = 2 }
