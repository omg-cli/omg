name: Docker E2E Tests

on:
  push:
    branches: [main]
    # Every main commit needs exact-commit evidence for the release gate.
  pull_request:
    paths:
      - "src/**"
      - "tests/docker_e2e.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "Dockerfile.arch-e2e"
      - ".dockerignore"
      - ".github/workflows/docker-e2e.yml"
  schedule:
    # Run nightly to catch regressions
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        # Match rust-toolchain.toml (1.95.0) instead of floating "stable".
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docker-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-docker-e2e-

      - name: Run Docker E2E Tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docker-e2e-evidence"
          OMG_RUN_DOCKER_TESTS=1 cargo test --no-default-features --features pgp,license --test docker_e2e --locked -- --ignored --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/docker-e2e-evidence/tests.log"
        env:
          RUST_BACKTRACE: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-e2e-results
          path: ${{ runner.temp }}/docker-e2e-evidence/
          retention-days: 14
          if-no-files-found: warn
