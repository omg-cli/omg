name: Benchmark

on:
  push:
    branches: [main]
    # Every main commit needs exact-commit evidence for the release gate.
  schedule:
    - cron: "17 1 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  workflow-helpers:
    name: Test workflow helpers on Linux host
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Native journal and namespace probes require the host, not the
      # restricted Arch benchmark container. Keep failures release-blocking.
      - name: Test workflow helpers
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          sudo -n python3 -m unittest discover -s scripts -p test_qemu_health.py
          sudo -n python3 -m unittest discover -s scripts -p test_export_qemu_evidence.py

  benchmark:
    name: Run Benchmarks
    needs: workflow-helpers
    runs-on: ubuntu-24.04
    container: archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
    timeout-minutes: 30
    outputs:
      search_time: ${{ steps.bench.outputs.search_time }}
      speedup: ${{ steps.bench.outputs.speedup }}

    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl pkgconf openssl libarchive clang bc python sccache hyperfine jq
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true

      - name: Configure sccache
        run: |
          if command -v sccache &> /dev/null && sccache --start-server 2>/dev/null; then
            echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "::notice::sccache enabled"
          else
            echo "::warning::sccache unavailable, building without cache"
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-benchmark-dependencies
          shared-key: arch-f3691b4dde62ba4c4
          cache-bin: false
          cache-workspace-crates: false

      - name: Build Release
        run: cargo build --release --features arch --locked

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Run Benchmarks (Hyperfine)
        id: bench
        run: |
          set -o pipefail

          chmod +x benchmark-hyperfine.sh

          # Use hyperfine for statistical rigor and JSON export
          ./benchmark-hyperfine.sh --fast 2>&1 | tee benchmark_output.txt

          # Extract metrics from the hyperfine search JSON. Current runs emit
          # "OMG"; older records used "OMG (Daemon)".
          SEARCH_JSON="benchmark_results/search.json"
          if [ ! -f "$SEARCH_JSON" ]; then
            echo "::error::hyperfine did not produce $SEARCH_JSON"
            exit 1
          fi

          SEARCH_TIME=$(jq -r '
            ([.results[] | select(.command == "OMG")][0].mean) //
            ([.results[] | select(.command == "OMG (Daemon)")][0].mean) //
            empty
          ' "$SEARCH_JSON" | awk '{printf "%.1f", $1 * 1000}')
          echo "search_time=${SEARCH_TIME}" >> $GITHUB_OUTPUT

          PACMAN_TIME=$(jq -r '.results[] | select(.command == "pacman") | .mean' "$SEARCH_JSON" | awk '{printf "%.1f", $1 * 1000}')
          if [ -n "$SEARCH_TIME" ] && [ -n "$PACMAN_TIME" ] && [ "$SEARCH_TIME" != "0" ]; then
            SPEEDUP=$(echo "scale=1; $PACMAN_TIME / $SEARCH_TIME" | bc)
            echo "speedup=${SPEEDUP}x" >> $GITHUB_OUTPUT
          fi

      - name: Generate Badge JSON
        env:
          BENCH_SPEEDUP: ${{ steps.bench.outputs.speedup }}
          BENCH_SEARCH_TIME: ${{ steps.bench.outputs.search_time }}
        run: |
          [[ "$BENCH_SEARCH_TIME" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$BENCH_SPEEDUP" =~ ^[0-9]+([.][0-9]+)?x$ ]]

          jq -n \
            --arg message "${BENCH_SEARCH_TIME}ms (${BENCH_SPEEDUP} faster)" \
            '{schemaVersion: 1, label: "search", message: $message, color: "brightgreen"}' \
            > benchmark-badge.json

          cat benchmark-badge.json

      - name: Upload Benchmark Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report
          path: |
            benchmark_results/
            benchmark-badge.json
            benchmark_output.txt
          retention-days: 90

      - name: Performance Regression Gate
        run: |
          chmod +x scripts/check-perf-regression.py
          python3 scripts/check-perf-regression.py


  commit-results:
    name: Prepare Benchmark History for Review
    needs: benchmark
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    concurrency:
      group: benchmark-history-review
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-report
          path: benchmark-artifact

      - name: Prepare benchmark history
        run: |
          test -f benchmark-artifact/benchmark_results/search.json
          python3 scripts/record-benchmark-run.py \
            --source benchmark-artifact/benchmark_results

      - name: Upload reviewable benchmark history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-history-for-review
          path: benchmarks/
          if-no-files-found: error
          retention-days: 30

      - name: Review summary
        run: |
          echo "Benchmark history is attached for a reviewed PR. No direct main write was attempted." >> "$GITHUB_STEP_SUMMARY"
