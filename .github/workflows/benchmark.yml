name: Benchmark

on:
  push:
    branches: [main]
    # Every main commit needs exact-commit evidence for the release gate.
  schedule:
    - cron: "17 1 * * 0"
  workflow_dispatch:
    inputs:
      rust-comparison:
        description: Run only the matched Ubuntu Rust build comparison
        type: boolean
        default: false
      source-sha:
        description: Full application source commit, blank uses the selected workflow commit
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.rust-comparison && 'comparison' || 'standard' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust-comparison:
    name: Matched Ubuntu Rust build comparison
    if: github.event_name == 'workflow_dispatch' && inputs.rust-comparison == true
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      COMPARISON_SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set comparison evidence directory
        run: echo "COMPARISON_ROOT=$RUNNER_TEMP/rust-comparison-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Install comparison dependencies
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config sudo python3 python3-apt python3-venv \
            fish zstd libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev tar gzip xz-utils

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.95.0"

      - name: Check comparison runner
        run: python3 -B -m unittest discover -s scripts -p test_build_comparison.py -v

      - name: Export immutable application source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMPARISON_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$COMPARISON_ROOT"
          git fetch --no-tags --depth=1 origin "$COMPARISON_SOURCE_SHA"
          git archive --format=tar --output="$COMPARISON_ROOT/source.tar" "$COMPARISON_SOURCE_SHA"
          python3 scripts/build-comparison.py prepare --archive "$COMPARISON_ROOT/source.tar" \
            --source "$COMPARISON_ROOT/source" --evidence "$COMPARISON_ROOT/evidence" \
            --source-sha "$COMPARISON_SOURCE_SHA"
          printf '%s\n' "$GITHUB_SHA" > "$COMPARISON_ROOT/evidence/driver-sha.txt"

      - name: Prefetch locked source dependencies outside measurement
        shell: bash
        run: |
          set -euo pipefail
          cd "$COMPARISON_ROOT/source"
          timeout --kill-after=15s 20m cargo +1.95.0 fetch --locked --target x86_64-unknown-linux-gnu \
            > "$COMPARISON_ROOT/evidence/fetch.stdout" 2> "$COMPARISON_ROOT/evidence/fetch.stderr"
          test ! -e target

      - name: Measure real release builds and named native tests
        run: |
          python3 scripts/build-comparison.py run --source "$COMPARISON_ROOT/source" \
            --evidence "$COMPARISON_ROOT/evidence" --source-sha "$COMPARISON_SOURCE_SHA"

      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.COMPARISON_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 14

  workflow-helpers:
    name: Test workflow helpers on Linux host
    if: inputs.rust-comparison != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Native journal and namespace probes require the host, not the
      # restricted Arch benchmark container. Keep failures release-blocking.
      - name: Test workflow helpers
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m unittest discover -s scripts -p 'test_*.py'
          sudo -n python3 -m unittest discover -s scripts -p test_qemu_health.py
          sudo -n python3 -m unittest discover -s scripts -p test_export_qemu_evidence.py

  benchmark:
    name: Run Benchmarks
    if: inputs.rust-comparison != true
    runs-on: ubuntu-24.04
    container: archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
    timeout-minutes: 30
    outputs:
      search_time: ${{ steps.bench.outputs.search_time }}
      speedup: ${{ steps.bench.outputs.speedup }}

    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl pkgconf openssl libarchive clang bc python hyperfine jq
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install benchmark compiler cache
        if: vars.OMG_R2_CACHE_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: sccache@0.18.0

      - name: Configure benchmark R2 cache
        id: r2-cache
        if: vars.OMG_R2_CACHE_ENABLED == 'true' && github.ref == 'refs/heads/main'
        env:
          OMG_R2_CACHE_ENABLED: ${{ vars.OMG_R2_CACHE_ENABLED }}
          OMG_R2_CACHE_ACCOUNT_ID: ${{ vars.OMG_R2_CACHE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.OMG_R2_CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OMG_R2_CACHE_SECRET_ACCESS_KEY }}
        run: python3 scripts/ci-r2-cache.py

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Preserve registry reuse without competing with native producers.
          prefix-key: v3-benchmark-registry
          shared-key: arch-f3691b4dde62ba4c4
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false

      - name: Build Release
        run: cargo build --release --features arch --locked

      - name: Run Benchmarks (Hyperfine)
        id: bench
        run: |
          set -o pipefail

          chmod +x benchmark-hyperfine.sh

          # Use hyperfine for statistical rigor and JSON export
          OMG_BENCH_BINARY="$GITHUB_WORKSPACE/target/release/omg" \
            ./benchmark-hyperfine.sh --fast 2>&1 | tee benchmark_output.txt

          # Extract metrics from the hyperfine search JSON. Current runs emit
          # "OMG"; older records used "OMG (Daemon)".
          SEARCH_JSON="benchmark_results/search.json"
          if [ ! -f "$SEARCH_JSON" ]; then
            echo "::error::hyperfine did not produce $SEARCH_JSON"
            exit 1
          fi

          SEARCH_TIME=$(jq -r '
            ([.results[] | select(.command == "OMG")][0].mean) //
            ([.results[] | select(.command == "OMG (Daemon)")][0].mean) //
            empty
          ' "$SEARCH_JSON" | awk '{printf "%.1f", $1 * 1000}')
          echo "search_time=${SEARCH_TIME}" >> $GITHUB_OUTPUT

          PACMAN_TIME=$(jq -r '.results[] | select(.command == "pacman") | .mean' "$SEARCH_JSON" | awk '{printf "%.1f", $1 * 1000}')
          if [ -n "$SEARCH_TIME" ] && [ -n "$PACMAN_TIME" ] && [ "$SEARCH_TIME" != "0" ]; then
            SPEEDUP=$(echo "scale=1; $PACMAN_TIME / $SEARCH_TIME" | bc)
            echo "speedup=${SPEEDUP}x" >> $GITHUB_OUTPUT
          fi

      - name: Generate Badge JSON
        env:
          BENCH_SPEEDUP: ${{ steps.bench.outputs.speedup }}
          BENCH_SEARCH_TIME: ${{ steps.bench.outputs.search_time }}
        run: |
          [[ "$BENCH_SEARCH_TIME" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$BENCH_SPEEDUP" =~ ^[0-9]+([.][0-9]+)?x$ ]]

          jq -n \
            --arg message "${BENCH_SEARCH_TIME}ms (${BENCH_SPEEDUP} faster)" \
            '{schemaVersion: 1, label: "search", message: $message, color: "brightgreen"}' \
            > benchmark-badge.json

          cat benchmark-badge.json

      - name: Upload Benchmark Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report
          path: |
            benchmark_results/
            benchmark-badge.json
            benchmark_output.txt
          retention-days: 90

      - name: Performance Regression Gate
        run: |
          chmod +x scripts/check-perf-regression.py
          python3 scripts/check-perf-regression.py

      - name: Report benchmark compiler cache
        if: always() && steps.r2-cache.outputs.enabled == 'true'
        run: |
          trap 'sccache --stop-server' EXIT
          mkdir -p "$RUNNER_TEMP/omg-r2-cache"
          sccache --show-stats
          sccache --show-stats --stats-format=json > "$RUNNER_TEMP/omg-r2-cache/omg-r2-cache-stats.json"
          printf 'source=%s\nprefix=%s\n' "$GITHUB_SHA" "$SCCACHE_S3_KEY_PREFIX" > "$RUNNER_TEMP/omg-r2-cache/omg-r2-cache-context.txt"

      - name: Preserve benchmark compiler cache diagnostics
        if: always() && steps.r2-cache.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-cache-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/omg-r2-cache/
          retention-days: 3
          if-no-files-found: error


  commit-results:
    name: Prepare Benchmark History for Review
    needs: [benchmark, workflow-helpers]
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    concurrency:
      group: benchmark-history-review
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-report
          path: benchmark-artifact

      - name: Prepare benchmark history
        run: |
          test -f benchmark-artifact/benchmark_results/search.json
          python3 scripts/record-benchmark-run.py \
            --source benchmark-artifact/benchmark_results

      - name: Upload reviewable benchmark history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-history-for-review
          path: benchmarks/
          if-no-files-found: error
          retention-days: 30

      - name: Review summary
        run: |
          echo "Benchmark history is attached for a reviewed PR. No direct main write was attempted." >> "$GITHUB_STEP_SUMMARY"
