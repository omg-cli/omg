name: Reviewed Fedora SQLite supply
on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      reuse-cache:
        type: boolean
        default: true
    outputs:
      publishable:
        value: ${{ jobs.build.outputs.publishable }}
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      artifact-digest:
        value: ${{ jobs.build.outputs.artifact-digest }}
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    name: "SQLite full RPM check (${{ inputs.arch }})"
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    outputs:
      publishable: ${{ steps.supply.outputs.publishable }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-name: ${{ format('fedora-sqlite-{0}-{1}', inputs.arch, github.run_attempt) }}
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
      options: --cpus ${{ inputs.arch == 'x86_64' && 4 || 2 }} --memory 4g --memory-swap 4g --pids-limit 512
    steps:
      - name: Prepare authenticated Fedora 44 checkout tools
        run: |
          set -euo pipefail
          . /etc/os-release
          [[ "$ID" == fedora && "$VERSION_ID" == 44 ]]
          diagnostics="$RUNNER_TEMP/fedora-sqlite/diagnostics/checkout"
          mkdir -p "$diagnostics"
          printf 'Checkout dependency installation attempted; command budget 600 seconds.\n' > "$diagnostics/attempt.txt"
          timeout --kill-after=10s 600s dnf --releasever=44 --disablerepo='*' \
            --enablerepo=fedora --enablerepo=updates --setopt=gpgcheck=1 \
            --setopt=timeout=20 --setopt=minrate=100k --setopt=logdir="$diagnostics" \
            --setopt=log_size=1M --setopt=log_rotate=1 \
            -y install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Trust the checked-out worktree
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build complete checked source and binary RPMs
        id: supply
        env:
          SOURCE_REVISION: ${{ github.sha }}
          NATIVE_ARCH: ${{ inputs.arch }}
          REUSE_SQLITE: ${{ inputs.reuse-cache }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "$NATIVE_ARCH" ]]
          mode=build
          [[ "$REUSE_SQLITE" != true ]] || mode=supply
          bundle="$RUNNER_TEMP/fedora-sqlite/fedora-sqlite-$NATIVE_ARCH-$GITHUB_RUN_ATTEMPT"
          python3 scripts/fedora-sqlite.py "$mode" "$bundle" --revision "$SOURCE_REVISION"
          diagnostics="$RUNNER_TEMP/fedora-sqlite/diagnostics/$(basename "$bundle")"
          if [[ -f "$diagnostics/build-finished.json" && -f "$diagnostics/inventory.json" && ! -f "$bundle/admission.json" ]]; then
            echo 'publishable=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve complete admitted package supply
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-sqlite-${{ inputs.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fedora-sqlite/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve failed build diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-sqlite-failure-${{ inputs.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fedora-sqlite/
          retention-days: 30
          if-no-files-found: warn
