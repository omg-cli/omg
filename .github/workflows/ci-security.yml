# Static security audit for GitHub Actions workflows using zizmor.
#
# Checks for script injection, unpinned actions, excessive token permissions,
# dangerous workflow triggers, and credential persistence leaks.

name: Workflow Security Audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit GitHub Actions workflows (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: python3 -m pip install --no-cache-dir --break-system-packages zizmor

      - name: Run zizmor workflow security audit
        run: zizmor --min-severity high --no-online-audits .github/workflows .github/actions
