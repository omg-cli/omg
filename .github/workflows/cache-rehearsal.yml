name: Local compiler cache rehearsal

on:
  push:
    branches: [ci/cache-budget]
    paths: [.github/workflows/cache-rehearsal.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_LTO: "off"
  CARGO_PROFILE_TEST_LTO: "off"

jobs:
  portable:
    name: "Portable Rust"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces
      OMG_CONTRACT_SOURCE_SHA: ${{ github.sha }}
      OMG_CONTRACT_PLATFORM: portable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          # Reserve compiled-cache storage for native producers and coverage.
          prefix-key: "v3-portable-registry"
          shared-key: "portable"
          cache-targets: false
          cache-bin: false
          cache-on-failure: true
          # PRs restore main's cache; merge-ref writes only benefit that PR's reruns.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - &install-compiler-cache
        name: Install portable compiler cache
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: sccache@0.18.0

      - &start-local-cache
        name: Verify isolated local cache write and replay
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import runpy
          import subprocess
          import tempfile

          if any(name.startswith(('AWS_', 'OMG_R2_CACHE_', 'SCCACHE_')) for name in os.environ):
              raise SystemExit('Unexpected AWS or compiler cache configuration')
          if os.environ.get('RUSTC_WRAPPER') or os.environ.get('RUSTC_WORKSPACE_WRAPPER'):
              raise SystemExit('Unexpected existing compiler wrapper')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source != os.environ['GITHUB_SHA']:
              raise SystemExit('Checkout source identity mismatch')
          root = Path(tempfile.mkdtemp(prefix='cache-rehearsal-', dir=os.environ['RUNNER_TEMP']))
          evidence = Path(os.environ['RUNNER_TEMP']) / 'cache-rehearsal-evidence'
          evidence.mkdir(mode=0o700)
          config_file = root / 'config.toml'
          config_file.write_text('', encoding='utf-8')
          config = {
              'SCCACHE_CONF': str(config_file),
              'SCCACHE_DIR': str(root / 'objects'),
              'SCCACHE_CACHE_SIZE': '4G',
              'SCCACHE_DIRECT': 'false',
              'SCCACHE_IDLE_TIMEOUT': '0',
              'SCCACHE_SERVER_UDS': str(root / 'server.sock'),
              'SCCACHE_ERROR_LOG': str(evidence / 'compiler.log'),
              'SCCACHE_LOG': r'off,sccache::compiler::compiler=debug/get_cached_or_compile:.*([.][sS]"|assembler)|process error',
              'RUSTC_WRAPPER': 'sccache',
          }
          # Export the owned socket before starting the server so cleanup can
          # find it even if startup or the replay probe fails.
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as stream:
              for name, value in config.items():
                  stream.write(f'{name}={value}\n')
          context = dict(source_sha=source, job=os.environ['GITHUB_JOB'],
                         run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                         backend='local-filesystem', cache_size='4G', direct=False,
                         aws_credentials_present=False, probe_verified=False)
          receipt = evidence / 'context.json'
          receipt.write_text(json.dumps(context, indent=2) + '\n', encoding='utf-8')
          env = dict(os.environ, **config)
          subprocess.run(['sccache', '--start-server'], env=env, check=True, timeout=45)
          runpy.run_path('scripts/ci-r2-cache.py')['verify_cache'](env)
          context['probe_verified'] = True
          receipt.write_text(json.dumps(context, indent=2) + '\n', encoding='utf-8')
          print('Local compiler cache write and byte-identical replay verified')
          PY

      - name: Clippy
        run: |
          cargo clippy --all-targets --no-default-features --features pgp,license \
            --locked -- -D warnings

      - name: Debian feature isolation clippy
        run: |
          cargo clippy --all-targets --no-default-features \
            --features debian-pure --locked -- -D warnings

      - name: Check fuzz targets
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

      - name: Check Bash and Zsh package completion
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update --error-on=any -qq && break || sleep 10
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          sudo apt-get install -y --no-install-recommends zsh fish python3-venv
          set +e
          timeout -k 10s 30s zsh tests/shell_completion.zsh > /tmp/shell-completion.log 2>&1
          rc=$?
          set -e
          cat /tmp/shell-completion.log
          echo '--- child zsh startup log ---'
          cat /tmp/omg-zsh-child.log 2>/dev/null || true
          exit "$rc"

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest

      - name: Run portable tests
        run: python3 scripts/run-native-contracts.py --features pgp,license

      - name: Test isolated distro override harness
        run: cargo test --test distro_override --no-default-features --features pgp,license --locked

      - name: Test root library documentation contracts
        run: cargo test --doc --no-default-features --features pgp,license --locked

      - name: Prepare genuine Node activation fixture
        run: timeout -k 5s 180s python3 scripts/prepare-node-test-fixture.py --destination "$RUNNER_TEMP/node-test-fixture"

      - name: Verify pure Debian parser and daemon contracts
        env:
          OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces/debian-pure
          OMG_CONTRACT_PLATFORM: debian-pure
        run: python3 scripts/run-native-contracts.py --features debian-pure

      - name: Preserve compiled parser surfaces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-surfaces-portable
          path: target/contract-surfaces/
          retention-days: 14
          if-no-files-found: error

      - name: Verify portable environment CLI round-trip
        run: cargo nextest run --test env_portability_cli --no-default-features --features pgp,license --locked --profile ci

      - &stop-local-cache
        name: Record statistics and stop the local compiler cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SCCACHE_SERVER_UDS:-}" ]]; then
            test -S "$SCCACHE_SERVER_UDS"
            trap 'timeout 15s sccache --stop-server' EXIT
            timeout 15s sccache --show-stats --stats-format=json > "$RUNNER_TEMP/cache-rehearsal-evidence/stats.json"
          fi

      - &preserve-cache-evidence
        name: Preserve local compiler cache diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-rehearsal-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-rehearsal-evidence/
          retention-days: 3
          if-no-files-found: warn

  portable-release:
    name: "Portable release"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          # Reserve compiled-cache storage for native producers and coverage.
          prefix-key: "v3-portable-registry"
          shared-key: "portable"
          cache-targets: false
          cache-bin: false
          cache-on-failure: true
          # PRs restore main's cache; merge-ref writes only benefit that PR's reruns.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - *install-compiler-cache
      - *start-local-cache

      - name: Test release distro override guard
        run: cargo test --release --test distro_override --no-default-features --features pgp,license --locked

      - *stop-local-cache
      - *preserve-cache-evidence
