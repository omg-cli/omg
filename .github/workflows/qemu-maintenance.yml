name: QEMU Pin Review

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: qemu-pin-review
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check review deadline
        id: pins
        run: python3 scripts/check-qemu-review.py --github-output "$GITHUB_OUTPUT"
      - name: File one maintenance request
        if: steps.pins.outputs.review_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          title='chore(security): renew reviewed QEMU image provenance'
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json title,number \
            --jq '.[] | select(.title == "chore(security): renew reviewed QEMU image provenance") | .number')
          if [[ -z "$existing" ]]; then
            cat > "$RUNNER_TEMP/qemu-pin-review.md" <<'BODY'
          The reviewed QEMU image pins expire within seven days or have already expired. The image verifier rejects expired reviews before parsing an image.

          Follow docs/qemu-image-renewal.md. Review current publisher signatures, pinned key fingerprints, image availability and controller security advisories. Submit the manifest, verification material and any driver pin changes together in a PR, then attach successful QEMU evidence. Do not extend the date without completing the review or silently replace a signing key. Close this request with the merged PR and its verification run.
          BODY
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/qemu-pin-review.md"
          fi
