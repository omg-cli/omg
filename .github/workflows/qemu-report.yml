name: QEMU Failure Reporting

on:
  workflow_run:
    workflows: [QEMU Matrix]
    types: [completed]

permissions: {}

concurrency:
  group: qemu-trusted-reporting
  cancel-in-progress: false

jobs:
  report:
    # workflow_run has secrets and a write token. Never let pull-request
    # artifacts drive this privileged reporter, even though they are parsed.
    if: github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Check out trusted default-branch reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's SHA is the default branch, never the triggering PR.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure trusted telemetry
        env:
          OMG_SMOKE_SENTRY_DSN: ${{ secrets.OMG_SMOKE_SENTRY_DSN }}
        run: python3 scripts/ci-smoke-report.py configure

      - name: Validate run identity and report bounded evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMG_SMOKE_ENVIRONMENT: qemu-matrix
          OMG_SMOKE_RELEASE: unknown
        run: python3 scripts/report-qemu-workflow.py

      - name: Preserve complete validated failure catalog
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-issue-report
          path: ${{ runner.temp }}/qemu-issue-report/failures.json
          if-no-files-found: ignore
          retention-days: 30
