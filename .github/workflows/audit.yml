name: Security Audit

on:
  push:
    branches: [main]
    # Every main commit needs exact-commit evidence for the release gate.
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: "Vulnerability Scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "audit"
          cache-on-failure: true

      - name: Install cargo-audit
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny

      - name: Run cargo-audit (Vulnerability Scan)
        run: cargo audit

      - name: Run cargo-deny (Supply Chain Security)
        run: |
          # Default GitHub Actions shell is `bash -e {0}`, which has no pipefail;
          # without this, a nonzero `cargo deny` exit is masked by `tee` and the
          # job passes green. With pipefail, the pipeline fails and -e aborts.
          set -o pipefail

          echo "## 🔒 Supply Chain Security Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check advisories
          echo "### Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          cargo deny check advisories 2>&1 | tee -a $GITHUB_STEP_SUMMARY

          # Check licenses
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### License Compliance" >> $GITHUB_STEP_SUMMARY
          cargo deny check licenses 2>&1 | tee -a $GITHUB_STEP_SUMMARY

          # Check bans (duplicate dependencies)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency Bans & Duplicates" >> $GITHUB_STEP_SUMMARY
          cargo deny check bans 2>&1 | tee -a $GITHUB_STEP_SUMMARY

          # Check sources
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Source Verification" >> $GITHUB_STEP_SUMMARY
          cargo deny check sources 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Generate dependency tree
        if: always()
        run: cargo tree --locked --depth 3 > dependency-tree.txt

      - name: Upload dependency tree
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-tree
          path: dependency-tree.txt
          retention-days: 30
