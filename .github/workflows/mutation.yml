name: Mutation Testing

on:
  schedule:
    # Separate the expensive weekly run from audit and benchmark schedules.
    - cron: "43 3 * * 0"
  pull_request:
    branches: [main]
    paths:
      - tests/coverage_15.rs
      - tests/coverage_4.rs
      - tests/common/**
      - .github/workflows/mutation.yml
  workflow_dispatch:
    inputs:
      baseline-only:
        description: Validate the complete unmutated portable suite only
        type: boolean
        default: false

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  mutation:
    name: cargo-mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Match rust-toolchain.toml (1.95.0) instead of floating "stable",
        # so weekly mutation runs stay comparable across weeks.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "mutation"
          # Mutants uses scratch build directories, not the root target.
          cache-targets: ${{ github.event_name == 'pull_request' || inputs.baseline-only == true }}
          cache-bin: false

      - name: Validate portable mutation baseline
        if: github.event_name == 'pull_request' || inputs.baseline-only == true
        run: cargo test --package omg --no-default-features --features pgp,license --locked

      - name: Install cargo-mutants
        if: github.event_name != 'pull_request' && inputs.baseline-only != true
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-mutants@27.1.0

      - name: Run mutation testing
        if: github.event_name != 'pull_request' && inputs.baseline-only != true
        run: |
          set +e
          cargo mutants \
            --package omg \
            --file src/core/archive.rs \
            --file src/core/runtime_resolver.rs \
            --file src/core/security/validation.rs \
            --file src/core/security/policy.rs \
            --file src/core/security/secrets.rs \
            --timeout 60 \
            --jobs 2 \
            --exclude-re 'tests?|bench|mock' \
            --output mutants-report \
            --no-default-features \
            --features pgp,license
          mutants_exit=$?
          set -e

          case "$mutants_exit" in
            0|2|3) ;;
            *)
              echo "cargo-mutants failed with exit code $mutants_exit" >&2
              exit "$mutants_exit"
              ;;
          esac

      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && github.event_name != 'pull_request' && inputs.baseline-only != true
        with:
          name: mutation-report
          path: mutants-report/
          retention-days: 30

      - name: Check mutation score
        if: github.event_name != 'pull_request' && inputs.baseline-only != true
        run: |
          result_dir="mutants-report/mutants.out"
          for report in caught.txt missed.txt timeout.txt; do
            if [ ! -f "$result_dir/$report" ]; then
              echo "Missing mutation report: $result_dir/$report" >&2
              exit 1
            fi
          done

          caught=$(wc -l < "$result_dir/caught.txt")
          missed=$(wc -l < "$result_dir/missed.txt")
          timed_out=$(wc -l < "$result_dir/timeout.txt")
          total=$((caught + missed + timed_out))
          if [ "$total" -eq 0 ]; then
            echo "Mutation run tested zero viable mutants" >&2
            exit 1
          fi

          score=$((caught * 100 / total))
          echo "Mutation score: $score% ($caught/$total mutants caught; $missed missed; $timed_out timed out)"
          if [ "$score" -lt 75 ]; then
            echo "Mutation score $score% is below the required 75% threshold" >&2
            exit 1
          fi
          echo "::notice::Mutation score $score% meets the 75% threshold"
