# World-Class CI Pipeline for OMG
# Optimized for speed, reliability, and comprehensive coverage
#
# Key Features:
# - PR path filtering: Avoid redundant platform builds for documentation
# - Quick gate: Classify changes before independent checks and builds
# - Matrix strategy: native Linux distro and ABI checks in parallel
# - cargo-nextest: 10-35% faster test execution
# - Artifact caching: Shared caches across jobs
# - Timeout protection: Prevents runaway jobs
# - Test reporting: exact nextest selection, JUnit attempts and parser receipts

name: CI

on:
  push:
    branches: [main]
    # Every main commit needs exact-commit evidence for the release gate.
  # Always report the required check on PRs. The job-level change filter
  # below skips platform builds for documentation/configuration-only changes.
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: "Skip cache restoration"
        type: boolean
        default: false
      deno-proof-head:
        description: Exact root-reviewed private branch commit
        type: string
        default: ''
      deno-proof-contract:
        description: Root-reviewed canonical proof manifest SHA256
        type: string
        default: ''
      deno-proof-release:
        description: Root-reviewed runtime admission
        type: string
        default: hold


concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # PRs cancel superseded runs; main never cancels so queued main runs
  # (e.g. #175 behind #172) still complete instead of being dropped.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_LTO: "off"
  CARGO_PROFILE_TEST_LTO: "off"

jobs:
  #############################################################################
  # STAGE 1: Quick Gate
  # Only change classification precedes platform builds. The complete
  # workflow checks run alongside builds and remain required by CI Success.
  #############################################################################
  quick-gate:
    name: "Quick Gate"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should-build: ${{ github.event_name == 'push' || steps.changes.outputs.required == 'true' }}
      checks-required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: python3 scripts/ci-change-scope.py

      - name: Validate change classification
        run: python3 -m unittest discover -s scripts -p test_ci_change_scope.py

  workflow-checks:
    name: "Workflow checks"
    needs: quick-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test debt baseline guards
        run: python3 -m unittest discover -s scripts -p 'test_debt*.py'

      - name: Debt ratchet (gating)
        run: python3 scripts/debt-ratchet.py --ci

      - name: Install Rust
        if: needs.quick-gate.outputs.checks-required == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Install Python workflow test dependencies
        if: needs.quick-gate.outputs.checks-required == 'true'
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y --no-install-recommends python3-venv

      - name: Run quick workflow checks
        if: needs.quick-gate.outputs.checks-required == 'true'
        run: make ci-workflow-quick

      - name: Verify installer destination safety
        run: bash tests/installer_security.sh

      - name: Install cargo-machete
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-machete

      - name: Unused dependencies (gating)
        # Standalone binary: the machete scan needs no Rust toolchain, so it
        # still runs on changes that skip compilation.
        run: cargo-machete

  standalone-suites:
    name: "Standalone suites (${{ matrix.os }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      # These independent workspaces include production modules directly;
      # root cargo test does not select them or require native package backends.
      - name: Test mise compatibility
        run: cargo test --manifest-path tests/mise-compat/Cargo.toml --locked

      - name: Test portable environment planner
        run: cargo test --manifest-path tests/env-portable/Cargo.toml --locked

  portable:
    name: "Portable Rust"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces
      OMG_CONTRACT_SOURCE_SHA: ${{ github.sha }}
      OMG_CONTRACT_PLATFORM: portable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          # Reserve compiled-cache storage for native producers and coverage.
          prefix-key: "v3-portable-registry"
          shared-key: "portable"
          cache-targets: false
          cache-bin: false
          cache-on-failure: true
          # PRs restore main's cache; merge-ref writes only benefit that PR's reruns.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install portable compiler cache
        if: >-
          vars.OMG_R2_CACHE_ENABLED == 'true' && inputs.skip-cache != true &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: sccache@0.18.0

      - name: Configure portable R2 cache
        id: r2-cache
        if: >-
          vars.OMG_R2_CACHE_ENABLED == 'true' && inputs.skip-cache != true &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          OMG_R2_CACHE_ENABLED: ${{ vars.OMG_R2_CACHE_ENABLED }}
          OMG_R2_CACHE_ACCOUNT_ID: ${{ vars.OMG_R2_CACHE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.OMG_R2_CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OMG_R2_CACHE_SECRET_ACCESS_KEY }}
        run: python3 scripts/ci-r2-cache.py

      - name: Clippy
        run: |
          cargo clippy --all-targets --no-default-features --features pgp,license \
            --locked -- -D warnings

      - name: Debian feature isolation clippy
        run: |
          cargo clippy --all-targets --no-default-features \
            --features debian-pure --locked -- -D warnings

      - name: Check fuzz targets
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

      - name: Check Bash and Zsh package completion
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update --error-on=any -qq && break || sleep 10
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          sudo apt-get install -y --no-install-recommends zsh fish python3-venv
          set +e
          timeout -k 10s 30s zsh tests/shell_completion.zsh > /tmp/shell-completion.log 2>&1
          rc=$?
          set -e
          cat /tmp/shell-completion.log
          echo '--- child zsh startup log ---'
          cat /tmp/omg-zsh-child.log 2>/dev/null || true
          exit "$rc"

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest

      - name: Run portable tests
        run: python3 scripts/run-native-contracts.py --features pgp,license

      - name: Test isolated distro override harness
        run: cargo test --test distro_override --no-default-features --features pgp,license --locked

      - name: Test release distro override guard
        run: cargo test --release --test distro_override --no-default-features --features pgp,license --locked

      - name: Test root library documentation contracts
        run: cargo test --doc --no-default-features --features pgp,license --locked

      - name: Prepare genuine Node activation fixture
        run: timeout -k 5s 180s python3 scripts/prepare-node-test-fixture.py --destination "$RUNNER_TEMP/node-test-fixture"

      - name: Verify pure Debian parser and daemon contracts
        env:
          OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces/debian-pure
          OMG_CONTRACT_PLATFORM: debian-pure
        run: python3 scripts/run-native-contracts.py --features debian-pure

      - name: Preserve compiled parser surfaces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-surfaces-portable
          path: target/contract-surfaces/
          retention-days: 14
          if-no-files-found: error

      - name: Verify portable environment CLI round-trip
        run: cargo nextest run --test env_portability_cli --no-default-features --features pgp,license --locked --profile ci

      - name: Report portable compiler cache
        if: always() && steps.r2-cache.outputs.enabled == 'true'
        run: |
          trap 'sccache --stop-server' EXIT
          sccache --show-stats

  #############################################################################
  # STAGE 2: Platform Matrix (Linux containers)
  # Parallel builds across Arch, Debian, Ubuntu 26.04, Fedora
  #############################################################################
  linux-matrix:
    name: "Linux (${{ matrix.platform }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_DIAGNOSTICS_DIR: /tmp/rustup-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
      DIAGNOSTIC_IMAGE: ${{ matrix.image }}
      DIAGNOSTIC_PLATFORM: ${{ matrix.platform }}
      OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces
      OMG_CONTRACT_SOURCE_SHA: ${{ github.sha }}
      # The contract platform is a separate id from the lane label, because
      # the contracts model in tests/contracts/ has no entry for every matrix
      # row. Ubuntu 26.04 builds the same APT 7 surface as Debian trixie and
      # consumes the same release archive, so it reports the `debian-trixie`
      # contract platform; `matrix.platform` stays `ubuntu-2604` for the job
      # name, cache key, artifact names and the lane `if:` conditions.
      OMG_CONTRACT_PLATFORM: ${{ matrix.contract_platform || matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arch
            image: archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
            features: arch,pgp,license
            setup: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel git pkgconf openssl libarchive clang cmake curl jq python fish
            rust_install: |
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            rust_components: |
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

          - platform: debian
            image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
            features: debian,pgp,license
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config sudo python3 python3-apt python3-venv fish \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
            rust_install: |
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            rust_components: |
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

          - platform: debian-trixie
            image: debian:trixie@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
            features: debian,pgp,license
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config sudo python3 python3-apt python3-venv fish \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
            rust_install: |
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            rust_components: |
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

          # The Trixie archive is shipped for Ubuntu 26.04, but its native
          # APT 7 integration must also pass on Ubuntu itself. This lane does
          # not produce another release archive.
          - platform: ubuntu-2604
            contract_platform: ubuntu
            image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
            features: debian,pgp,license
            setup: |
              . /etc/os-release
              test "$ID" = ubuntu && test "$VERSION_ID" = 26.04
              test "$(uname -m)" = x86_64
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config sudo python3 python3-apt python3-venv fish jq \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              ldconfig -p | grep -F 'libapt-pkg.so.7'
            rust_install: |
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            rust_components: |
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

          - platform: fedora
            image: fedora:latest@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
            features: fedora,pgp,license
            setup: |
              timeout -k 10s 12m dnf \
                --setopt='*.skip_if_unavailable=False' \
                install -y --setopt=install_weak_deps=False \
                git clang cmake openssl-devel pkgconfig findutils curl procps-ng python3 zsh fish \
                rpm dnf sqlite yum-utils fedora-release
              rpm --initdb
            rust_install: |
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            rust_components: |
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Setup environment
        run: ${{ matrix.setup }}

      - name: Stage Rustup diagnostics
        run: |
          set -eu
          mkdir -p "$RUSTUP_DIAGNOSTICS_DIR"
          cat > "$RUSTUP_DIAGNOSTICS_DIR/helper.py" <<'RUSTUP_DIAGNOSTICS_PY'
          """Observe Rustup metadata without invoking proxies or modifying toolchains."""
          import argparse
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import tomllib

          STAGES = ('before_minimal', 'after_minimal', 'after_components', 'before_first_proxy')


          def stable(info):
              return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid,
                      info.st_size, info.st_mtime_ns, info.st_ctime_ns)


          def read_regular(path, limit=1024 * 1024):
              before = path.lstat()
              if not stat.S_ISREG(before.st_mode):
                  raise OSError(f'not a regular metadata file: {path}')
              if before.st_size > limit:
                  raise OSError(f'metadata exceeds limit: {path}')
              with path.open('rb') as stream:
                  data = stream.read(limit + 1)
                  opened = os.fstat(stream.fileno())
              after = path.lstat()
              if stable(before) != stable(opened) or stable(before) != stable(after) or len(data) > limit:
                  raise OSError(f'metadata changed during read: {path}')
              return {'text': data.decode('utf-8'), 'sha256': hashlib.sha256(data).hexdigest()}


          def destination(path):
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  return {'present': False}
              value = dict(present=True, uid=info.st_uid, gid=info.st_gid,
                           mode=oct(stat.S_IMODE(info.st_mode)), size=info.st_size,
                           inode=info.st_ino, device=info.st_dev, mtime_ns=info.st_mtime_ns,
                           ctime_ns=info.st_ctime_ns, symlink=stat.S_ISLNK(info.st_mode),
                           regular=stat.S_ISREG(info.st_mode))
              if value['symlink']:
                  value['link_target'] = os.readlink(path)
              elif value['regular']:
                  digest = hashlib.sha256()
                  with path.open('rb') as stream:
                      opened = os.fstat(stream.fileno())
                      for data in iter(lambda: stream.read(1024 * 1024), b''):
                          digest.update(data)
                  if stable(info) != stable(opened) or stable(info) != stable(path.lstat()):
                      raise OSError(f'destination changed during read: {path}')
                  value['sha256'] = digest.hexdigest()
              return value


          def classify(data):
              registered = set(data['components']['components']['text'].splitlines())
              fmt = {name for name in registered if name.startswith('rustfmt-preview-')}
              result = {}
              for name in ('cargo-fmt', 'rustfmt'):
                  value = data['bins'][name]
                  owners = [key.removeprefix('manifest-') for key, item in data['components'].items()
                            if key.startswith('manifest-') and f'file:bin/{name}' in item['text'].splitlines()]
                  expected = sorted(set(owners) & fmt)
                  if value.get('symlink'):
                      state = 'symlink_destination_requires_investigation'
                  elif value['present'] and not value['regular']:
                      state = 'nonregular_destination_requires_investigation'
                  elif value['present'] and not expected:
                      state = 'destination_without_registered_rustfmt_owner'
                  elif fmt and (not value['present'] or not expected):
                      state = 'registered_rustfmt_metadata_incomplete'
                  elif value['present']:
                      state = 'destination_and_registered_owner_consistent'
                  else:
                      state = 'rustfmt_not_installed_destination_absent'
                  result[name] = dict(state=state, declared_owners=owners, registered_rustfmt_owners=expected)
              return result


          def bookkeeping(metadata, installer_components):
              result = {'state': 'diagnostic_error', 'files': {}}
              for name in ('multirust-config.toml', 'multirust-channel-manifest.toml'):
                  path = metadata/name
                  before = None
                  try:
                      before = path.lstat()
                      item = read_regular(path)
                      if stable(before) != stable(path.lstat()):
                          raise OSError(f'metadata changed during read: {path}')
                      item.update(state='captured', metadata=dict(uid=before.st_uid, gid=before.st_gid,
                                  mode=oct(stat.S_IMODE(before.st_mode)), size=before.st_size,
                                  inode=before.st_ino, device=before.st_dev,
                                  mtime_ns=before.st_mtime_ns, ctime_ns=before.st_ctime_ns))
                      result['files'][name] = item
                  except FileNotFoundError as error:
                      result['files'][name] = ({'state': 'absent'} if before is None else
                                               {'state': 'diagnostic_error',
                                                'error': f'FileNotFoundError: {error}'})
                  except (OSError, ValueError, UnicodeError) as error:
                      result['files'][name] = {'state': 'diagnostic_error',
                                               'error': f'{type(error).__name__}: {error}'}
              states = [item['state'] for item in result['files'].values()]
              if 'diagnostic_error' in states:
                  return result
              if 'absent' in states:
                  result['state'] = 'bookkeeping_file_absent'
                  return result
              try:
                  config = tomllib.loads(result['files']['multirust-config.toml']['text'])
                  manifest = tomllib.loads(result['files']['multirust-channel-manifest.toml']['text'])
              except tomllib.TOMLDecodeError as error:
                  result.update(state='bookkeeping_parse_error', error=str(error))
                  return result
              pairs = []
              supported = config.get('config_version') == '1' and set(config) == {'config_version', 'components'}
              components = config.get('components')
              supported = supported and isinstance(components, list)
              if supported:
                  for item in components:
                      if (not isinstance(item, dict) or not {'pkg', 'target'} <= set(item)
                              or set(item) - {'pkg', 'target', 'is_extension'}
                              or not isinstance(item.get('pkg'), str) or not isinstance(item.get('target'), str)
                              or not re.fullmatch(r'[A-Za-z0-9_.-]+', item['pkg'])
                              or not re.fullmatch(r'[A-Za-z0-9_.]+(?:-[A-Za-z0-9_.]+){2,}', item['target'])
                              or ('is_extension' in item and not isinstance(item['is_extension'], bool))):
                          supported = False
                          break
                      pairs.append((item['pkg'], item['target']))
              supported = (supported and len(pairs) == len(set(pairs))
                           and manifest.get('manifest-version') == '2'
                           and isinstance(manifest.get('date'), str)
                           and bool(re.fullmatch(r'\d{4}-\d{2}-\d{2}', manifest['date']))
                           and isinstance(manifest.get('pkg'), dict)
                           and isinstance(manifest.get('renames', {}), dict)
                           and all(isinstance(name, str) and isinstance(rename, dict)
                                   and set(rename) == {'to'} and isinstance(rename['to'], str)
                                   and rename['to'] in manifest['pkg']
                                   for name, rename in manifest.get('renames', {}).items()))
              if supported:
                  fmt_package = manifest['pkg'].get('rustfmt-preview')
                  fmt_targets = fmt_package.get('target') if isinstance(fmt_package, dict) else None
                  supported = (isinstance(fmt_targets, dict) and bool(fmt_targets)
                               and all(isinstance(value, dict) and isinstance(value.get('available'), bool)
                                       for value in fmt_targets.values()))
              if not supported:
                  result['state'] = 'bookkeeping_unknown_schema'
                  return result
              result['config_component_pairs'] = [dict(pkg=pkg, target=target) for pkg, target in pairs]
              result['manifest_identity'] = dict(version='2', date=manifest['date'])
              if installer_components is None:
                  result.update(state='bookkeeping_observed', membership_state='installer_components_not_observed')
                  return result
              # Membership is an observed relation, not a model of Rustup update planning.
              membership = {name: any(name == pkg+'-'+target for pkg, target in pairs)
                            for name in installer_components if name.startswith('rustfmt-preview-')}
              result['rustfmt_config_membership'] = membership
              result['membership_state'] = 'observed'
              result['state'] = ('installer_rustfmt_not_in_config' if not all(membership.values())
                                 else 'bookkeeping_observed')
              return result


          def snapshot(toolchain):
              toolchain = Path(toolchain)
              result = dict(toolchain=str(toolchain), state='diagnostic_error', errors=[], components={}, bins={},
                            rustup_bookkeeping={'state': 'not_captured_due_snapshot_error', 'files': {}})
              try:
                  try:
                      info = toolchain.lstat()
                  except FileNotFoundError:
                      return dict(toolchain=str(toolchain), state='toolchain_absent',
                                  rustup_bookkeeping={'state': 'toolchain_absent', 'files': {
                                      name: {'state': 'absent'} for name in
                                      ('multirust-config.toml', 'multirust-channel-manifest.toml')}})
                  if not stat.S_ISDIR(info.st_mode):
                      raise OSError('toolchain is not a real directory')
                  for directory in (toolchain/'lib', toolchain/'lib/rustlib', toolchain/'bin'):
                      if not stat.S_ISDIR(directory.lstat().st_mode):
                          raise OSError(f'not a real directory: {directory}')
                  metadata = toolchain/'lib/rustlib'
                  names = None
                  installer_errors = []
                  try:
                      result['components']['components'] = read_regular(metadata/'components')
                      observed_names = result['components']['components']['text'].splitlines()
                      if (any(not re.fullmatch(r'[A-Za-z0-9_.-]+', name) for name in observed_names)
                              or len(observed_names) != len(set(observed_names))):
                          raise ValueError('malformed or duplicate component name')
                      names = observed_names
                  except (OSError, ValueError, UnicodeError) as error:
                      installer_errors.append(f'{type(error).__name__}: {error}')
                  result['rustup_bookkeeping'] = bookkeeping(metadata, names)
                  if result['rustup_bookkeeping']['state'] == 'diagnostic_error':
                      result['errors'].extend(item['error'] for item in result['rustup_bookkeeping']['files'].values()
                                              if item['state'] == 'diagnostic_error')
                  elif result['rustup_bookkeeping']['state'] == 'bookkeeping_parse_error':
                      result['errors'].append(result['rustup_bookkeeping']['error'])
                  for path in sorted(metadata.glob('manifest-*')):
                      try:
                          item = read_regular(path)
                          if any(not line.startswith(('file:', 'dir:')) for line in item['text'].splitlines()):
                              raise ValueError(f'malformed component manifest: {path.name}')
                          result['components'][path.name] = item
                      except (OSError, ValueError, UnicodeError) as error:
                          installer_errors.append(f'{type(error).__name__}: {error}')
                  if names is not None and any('manifest-'+name not in result['components'] for name in names):
                      installer_errors.append('ValueError: registered component manifest is missing')
                  result['errors'].extend(installer_errors)
                  for name in ('cargo-fmt', 'rustfmt', 'rustc'):
                      try:
                          result['bins'][name] = destination(toolchain/'bin'/name)
                      except (OSError, ValueError) as error:
                          result['bins'][name] = {'state': 'diagnostic_error', 'error': f'{type(error).__name__}: {error}'}
                          result['errors'].append(result['bins'][name]['error'])
                  if not installer_errors and all('present' in result['bins'][name] for name in ('cargo-fmt', 'rustfmt')):
                      result['classification'] = classify(result)
                  result['state'] = 'diagnostic_error' if result['errors'] else 'observed'
              except (OSError, ValueError, UnicodeError) as error:
                  result['errors'].append(f'{type(error).__name__}: {error}')
              return result


          def envelope():
              cargo_home = Path(os.environ.get('CARGO_HOME') or str(Path.home()/'.cargo'))
              try:
                  rustup = destination(cargo_home/'bin/rustup')
              except OSError as error:
                  rustup = dict(state='diagnostic_error', error=f'{type(error).__name__}: {error}')
              return dict(schema=1, captured_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                          helper_sha256=hashlib.sha256(Path(__file__).read_bytes()).hexdigest(),
                          declared_bootstrap_versions=dict(rustup='1.28.2', toolchain='1.95.0'),
                          rustup_binary_path=str(cargo_home/'bin/rustup'), rustup_binary=rustup,
                          version_qualification='Declared recipe versions; binary metadata and hashes observed, no version command invoked.',
                          actor=dict(uid=os.getuid(), gid=os.getgid()),
                          declared_context={key: os.environ.get(key) for key in
                              ('GITHUB_SHA', 'GITHUB_REF', 'GITHUB_REPOSITORY', 'GITHUB_WORKFLOW_SHA',
                               'GITHUB_WORKFLOW_REF', 'GITHUB_EVENT_NAME', 'GITHUB_RUN_ID',
                               'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'DIAGNOSTIC_IMAGE', 'DIAGNOSTIC_PLATFORM')},
                          environment={key: os.environ.get(key) for key in ('HOME', 'RUSTUP_HOME', 'CARGO_HOME')})


          def write_once(out, name, data):
              out = Path(out)
              out.mkdir(parents=True, exist_ok=True)
              path = out/name
              with path.open('x', encoding='utf-8') as stream:
                  json.dump(data, stream, indent=2)
                  stream.write('\n')
              return path


          def capture(toolchain, stage, out):
              if stage not in STAGES:
                  raise ValueError('unknown diagnostic stage')
              data = envelope()
              data.update(stage=stage, snapshot=snapshot(toolchain))
              return write_once(out, stage+'.json', data)


          def join(repo, out):
              repo = Path(repo)
              canonical = repo/'scripts/ci-rustup-diagnostics.py'
              staged = Path(__file__).read_bytes()
              data = envelope()
              try:
                  if staged != canonical.read_bytes():
                      raise ValueError('staged/canonical helper bytes differ')
                  data['actual_checkout'] = {
                      key: subprocess.check_output(['git', '-c', f'safe.directory={repo}', 'rev-parse', ref],
                                                   cwd=repo, text=True, timeout=10).strip()
                      for key, ref in (('head', 'HEAD'), ('tree', 'HEAD^{tree}'))}
                  declared = os.environ.get('GITHUB_SHA', '')
                  if not re.fullmatch(r'[0-9a-f]{40}', declared):
                      raise ValueError('declared event GITHUB_SHA is missing or malformed')
                  if data['actual_checkout']['head'] != declared:
                      raise ValueError('actual checkout HEAD differs from declared event GITHUB_SHA')
                  data['state'] = 'verified_checkout_and_helper'
              except (OSError, ValueError, subprocess.SubprocessError) as error:
                  data.update(state='staging_error', error=f'{type(error).__name__}: {error}')
              write_once(out, 'source-join.json', data)
              return data['state'] == 'verified_checkout_and_helper'


          def summary(out):
              data = envelope()
              data['stages'] = {stage: 'recorded' if (Path(out)/(stage+'.json')).is_file() else 'not_reached'
                                for stage in STAGES}
              data['bookkeeping_stages'] = {}
              for stage in STAGES:
                  path = Path(out)/(stage+'.json')
                  try:
                      path.lstat()
                  except FileNotFoundError:
                      data['bookkeeping_stages'][stage] = 'not_reached'
                      continue
                  try:
                      recorded = json.loads(read_regular(path, limit=4 * 1024 * 1024)['text'])
                      if not isinstance(recorded, dict) or not isinstance(recorded.get('snapshot'), dict):
                          raise ValueError('malformed snapshot envelope')
                      item = recorded['snapshot'].get('rustup_bookkeeping')
                      if item is None:
                          data['bookkeeping_stages'][stage] = 'bookkeeping_not_collected'
                      elif isinstance(item, dict) and isinstance(item.get('state'), str):
                          data['bookkeeping_stages'][stage] = item['state']
                      else:
                          raise ValueError('malformed bookkeeping observation')
                  except (OSError, ValueError, UnicodeError) as error:
                      data['bookkeeping_stages'][stage] = 'diagnostic_error'
                      data.setdefault('summary_errors', {})[stage] = f'{type(error).__name__}: {error}'
              write_once(out, 'stage-status.json', data)


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument('operation', choices=('capture', 'join', 'summary'))
              parser.add_argument('--toolchain')
              parser.add_argument('--stage', choices=STAGES)
              parser.add_argument('--repo')
              parser.add_argument('--out', required=True)
              args = parser.parse_args()
              if args.operation == 'capture':
                  if not args.toolchain or not args.stage:
                      parser.error('capture requires --toolchain and --stage')
                  capture(args.toolchain, args.stage, args.out)
              elif args.operation == 'join':
                  if not args.repo:
                      parser.error('join requires --repo')
                  return 0 if join(args.repo, args.out) else 1
              else:
                  summary(args.out)
              return 0


          if __name__ == '__main__':
              raise SystemExit(main())
          RUSTUP_DIAGNOSTICS_PY
          echo "039af9cfaeb167efbeb985e3676192e831922d71a5b25d5cd6d25e9eeec09bf3  $RUSTUP_DIAGNOSTICS_DIR/helper.py" | sha256sum --check

      - name: Install pinned Rust toolchain
        env:
          RUSTUP_INSTALL: ${{ matrix.rust_install }}
          RUSTUP_COMPONENTS: ${{ matrix.rust_components }}
        run: |
          set -eu
          toolchain="${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.95.0-x86_64-unknown-linux-gnu"
          diagnostic_error() {
            printf '%s\n' "diagnostic_error: $1" >&2 || return 0
          }
          observe() {
            if python3 "$RUSTUP_DIAGNOSTICS_DIR/helper.py" capture --toolchain "$toolchain" --stage "$1" --out "$RUSTUP_DIAGNOSTICS_DIR"; then
              :
            else
              diagnostic_error "could not write $1 envelope"
            fi
          }
          observe before_minimal
          set +e
          printf '%s\n' "$RUSTUP_INSTALL" | sh -e
          install_rc=$?
          set -e
          if printf 'installer_exit=%s\n' "$install_rc" > "$RUSTUP_DIAGNOSTICS_DIR/bootstrap-status.txt"; then
            :
          else
            diagnostic_error "could not record installer exit $install_rc"
          fi
          observe after_minimal
          if [ "$install_rc" -ne 0 ]; then exit "$install_rc"; fi
          set +e
          printf '%s\n' "$RUSTUP_COMPONENTS" | sh -e
          component_rc=$?
          set -e
          if printf 'components_exit=%s\n' "$component_rc" >> "$RUSTUP_DIAGNOSTICS_DIR/bootstrap-status.txt"; then
            :
          else
            diagnostic_error "could not record components exit $component_rc"
          fi
          observe after_components
          exit "$component_rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify Python venv and offline pip prerequisites
        if: contains(matrix.features, 'debian')
        run: python3 scripts/test_python_venv_setup.py -v

      - name: Join Rustup diagnostic source before first proxy
        run: |
          set -eu
          python3 "$RUSTUP_DIAGNOSTICS_DIR/helper.py" join --repo "$GITHUB_WORKSPACE" --out "$RUSTUP_DIAGNOSTICS_DIR"
          python3 "$RUSTUP_DIAGNOSTICS_DIR/helper.py" capture \
            --toolchain "${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.95.0-x86_64-unknown-linux-gnu" \
            --stage before_first_proxy --out "$RUSTUP_DIAGNOSTICS_DIR"

      - name: Record Rustup diagnostic stage status
        if: always()
        run: |
          mkdir -p "$RUSTUP_DIAGNOSTICS_DIR"
          if command -v python3 >/dev/null 2>&1 && \
             echo "039af9cfaeb167efbeb985e3676192e831922d71a5b25d5cd6d25e9eeec09bf3  $RUSTUP_DIAGNOSTICS_DIR/helper.py" | sha256sum --check; then
            python3 "$RUSTUP_DIAGNOSTICS_DIR/helper.py" summary --out "$RUSTUP_DIAGNOSTICS_DIR"
          else
            printf '%s\n' 'staging_error: verified helper or Python unavailable; stage files may be missing' > "$RUSTUP_DIAGNOSTICS_DIR/diagnostics-unavailable.txt"
          fi

      - name: Preserve Rustup diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustup-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ env.RUSTUP_DIAGNOSTICS_DIR }}/
          retention-days: 14
          if-no-files-found: error

      # sccache temporarily disabled due to service outage

      - name: Compute native cache identity
        id: cache-key
        shell: bash
        env:
          CACHE_PLATFORM: ${{ matrix.platform }}
          CACHE_IMAGE: ${{ matrix.image }}
          CACHE_FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          # GitHub cache keys reject commas. Hash the complete compatibility
          # tuple instead of dropping features or making a lossy replacement.
          key=$(printf '%s\0' "$CACHE_PLATFORM" "$CACHE_IMAGE" "$CACHE_FEATURES" | sha256sum)
          printf 'key=%s\n' "${key%% *}" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          prefix-key: v2-platform-dependencies
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Never restore across distro ABI or feature contracts. The action
          # additionally keys rustc, Cargo config, lockfiles and compiler flags.
          shared-key: ${{ steps.cache-key.outputs.key }}
          cache-bin: false
          cache-workspace-crates: false

      - name: Build release
        if: matrix.platform != 'ubuntu-2604'
        shell: bash
        env:
          DISTRO: ${{ matrix.platform }}
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_FEATURES: ${{ matrix.features }}
        run: |
          python3 scripts/native-build-artifact.py build --distro "$DISTRO" \
            --image "$BUILD_IMAGE" --features "$BUILD_FEATURES" --destination "$RUNNER_TEMP/native-release"

      - name: Build Ubuntu 26.04 validation binary
        if: matrix.platform == 'ubuntu-2604'
        run: cargo build --release --no-default-features --features debian,pgp,license --locked

      - name: Verify complete native APT daemon catalogue
        if: contains(matrix.features, 'debian')
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home omg-catalog
          runuser -u omg-catalog -- python3 -B -m unittest discover -s scripts -p test_debian_daemon_catalog_lifecycle.py -v
          runuser -u omg-catalog -- python3 scripts/test-debian-daemon-catalog.py \
            --omg-binary "$GITHUB_WORKSPACE/target/release/omg" \
            --omgd-binary "$GITHUB_WORKSPACE/target/release/omgd" \
            --evidence-dir "/tmp/omg-catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.platform }}"

      - name: Preserve native APT catalogue proof
        if: always() && contains(matrix.features, 'debian')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apt-daemon-catalog-${{ matrix.platform }}
          path: |
            /tmp/omg-catalog-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}/receipt.json
            /tmp/omg-catalog-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}/daemon.log
          retention-days: 14
          if-no-files-found: error

      - name: Upload native release pair
        if: matrix.platform != 'ubuntu-2604'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Platform clippy
        run: |
          cargo clippy --all-targets --no-default-features --features ${{ matrix.features }} \
            --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Prepare genuine Node activation fixture
        if: contains(matrix.features, 'debian')
        run: timeout -k 5s 180s python3 scripts/prepare-node-test-fixture.py --destination "$RUNNER_TEMP/node-test-fixture"

      - name: Run unit tests
        run: python3 scripts/run-native-contracts.py --features ${{ matrix.features }}

      - name: Test emitted shell hooks
        if: matrix.platform == 'fedora'
        env:
          OMG_HOOK_TEST_BINARY: ${{ github.workspace }}/target/debug/omg
          OMG_HOOK_TEST_REQUIRE_SHELLS: bash,zsh,fish
        run: |
          test -x "$OMG_HOOK_TEST_BINARY"
          python3 -m unittest discover -s tests -p test_shell_hook_behavior.py
          python3 -m unittest discover -s tests -p test_shell_hook_ci.py

      - name: Run serial library and binary contracts
        if: matrix.platform != 'debian-trixie' && matrix.platform != 'ubuntu-2604'
        # Preserve the former staged-QEMU libtest owner alongside nextest.
        run: cargo test --lib --bins --no-default-features --features ${{ matrix.features }} --locked --no-fail-fast -- --test-threads=1

      - name: Prepare sandbox regression executable
        if: matrix.platform == 'arch'
        shell: bash
        run: |
          set -euo pipefail
          binary=$(cargo test --lib --no-run --no-default-features --features arch,pgp,license \
            --locked --message-format=json | jq -r \
            'select(.reason == "compiler-artifact" and .target.name == "omg_lib" and .profile.test) | .executable // empty')
          test -n "$binary"
          install -Dm755 "$binary" target/sandbox-test/omg-lib-tests

      - name: Upload sandbox regression executable
        if: matrix.platform == 'arch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-sandbox-test
          path: target/sandbox-test/omg-lib-tests
          retention-days: 1
          if-no-files-found: error

      - name: Debian deterministic benchmark regression check
        if: matrix.platform == 'debian'
        env:
          OMG_BENCH_WRITE_JSON: "1"
          OMG_BENCH_JSON_OUT: target/bench/debian-matrix.json
          OMG_BENCH_BASELINE_JSON: benchmarks/baselines/debian-matrix-baseline.json
          OMG_BENCH_REGRESSION_MULTIPLIER: "2.0"
        run: |
          cargo test --test bench_debian --no-default-features --features ${{ matrix.features }} --locked \
            bench_debian_deterministic_matrix -- --nocapture

      - name: Upload Debian benchmark artifact
        if: matrix.platform == 'debian'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-debian-matrix
          path: target/bench/debian-matrix.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish Debian benchmark summary
        if: matrix.platform == 'debian'
        run: |
          echo "## Debian Deterministic Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat target/bench/debian-matrix.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify binary
        run: |
          ./target/release/omg --version
          ./target/release/omg --help | head -20

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omg-${{ matrix.platform }}
          path: target/release/omg
          retention-days: 7
          if-no-files-found: error

      - name: Preserve compiled parser surfaces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-surfaces-${{ matrix.platform }}
          path: target/contract-surfaces/
          retention-days: 14
          if-no-files-found: error

  sandbox-cancellation:
    name: "AUR sandbox security regressions"
    needs: [quick-gate, linux-matrix]
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aur-sandbox-test
          path: fixture

      - name: Prepare sandbox runtime image
        run: |
          docker build --tag omg-sandbox-regression - <<'DOCKERFILE'
          FROM archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
          RUN pacman -Syu --noconfirm --needed bubblewrap fakeroot && pacman -Scc --noconfirm
          DOCKERFILE

      - name: Prepare sandbox seccomp profile
        run: |
          curl -fsS https://raw.githubusercontent.com/moby/profiles/61eaf32614c7c71b60bd8927d3e6a4ffc8ff1f31/seccomp/default.json -o seccomp-default.json
          echo '536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  seccomp-default.json' | sha256sum --check
          jq '(.syscalls[] | select(.includes.caps == ["CAP_SYS_ADMIN"]) | .names) += ["pivot_root"]' \
            seccomp-default.json > seccomp-sandbox.json

      - name: Verify sandbox isolation and descendant cleanup
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x fixture/omg-lib-tests
          mkdir -p "$RUNNER_TEMP/sandbox-evidence"
          # Only this fixture gets namespace permissions, not compilation or
          # other tests. No checkout, credentials, or Docker socket are mounted.
          # Bubblewrap also needs pivot_root, which the default profile denies.
          docker run --rm --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            --security-opt "seccomp=$PWD/seccomp-sandbox.json" \
            --pids-limit 128 --memory 1g --cpus 2 \
            --mount "type=bind,source=$PWD/fixture,target=/fixture,readonly" \
            omg-sandbox-regression /bin/bash -euo pipefail -c '
              command -v bwrap
              command -v fakeroot
              test "$(id -u)" = 0
              getent passwd nobody
              # A successful namespace probe prevents a denied bwrap startup
              # from masquerading as the read-only-root rejection test passing.
              bwrap --ro-bind / / --unshare-pid --proc /proc -- /bin/true
              # Create the user namespace with the existing container-root
              # permissions, then map the payload to nobody and drop its caps.
              # This does not require relaxing host unprivileged-userns policy.
              bwrap --unshare-user --uid "$(id -u nobody)" --gid "$(id -g nobody)" \
                --cap-drop ALL --ro-bind / / --proc /proc -- /usr/bin/id
              /fixture/omg-lib-tests --include-ignored --list > /tmp/tests.list
              failed=0
              for case in cancelling_logged_sandbox_build_terminates_descendants \
                bwrap_readonly_root_blocks_arbitrary_writes \
                sandbox_fakeroot_skips_unmappable_real_chown \
                makepkg_invocations_isolate_every_writable_cache \
                invocation_ownership_setup_uses_only_private_directory_handles \
                fresh_outputs_never_fall_back_to_checkout_or_other_invocations \
                chroot_requires_explicit_host_code_consent_before_launch; do
                test_name="package_managers::aur::client::tests::$case"
                if ! grep -Fx "$test_name: test" /tmp/tests.list; then
                  echo "MISSING $case"; failed=1; continue
                fi
                echo "RUN $case (required tools present; root handoff enabled)"
                if /fixture/omg-lib-tests --exact "$test_name" --include-ignored --nocapture; then
                  echo "PASS $case"
                else
                  echo "FAIL $case"; failed=1
                fi
              done
              # Arch treats PKGBUILD/install hooks as executable input, so the
              # archive parser is a required security gate:
              # https://man.archlinux.org/man/PKGBUILD.5
              for case in member_paths_reject_absolute_parent_and_empty_paths \
                links_cannot_escape_the_archive_root \
                buildinfo_requires_one_complete_identity \
                inspector_classifies_install_hook_and_setuid_file \
                inspector_rejects_special_files_and_duplicate_paths \
                inspector_requires_paired_build_for_system_integration_payloads; do
                test_name="package_managers::aur::artifact_inspector::tests::$case"
                if ! grep -Fx "$test_name: test" /tmp/tests.list; then
                  echo "MISSING $case"; failed=1; continue
                fi
                echo "RUN $case (AUR archive inspection)"
                if /fixture/omg-lib-tests --exact "$test_name" --include-ignored --nocapture; then
                  echo "PASS $case"
                else
                  echo "FAIL $case"; failed=1
                fi
              done
              for case in paired_output_verification_is_order_independent_and_exact \
                reproducible_epoch_is_stable_and_rejects_invalid_digests; do
                test_name="package_managers::aur::client::tests::$case"
                if ! grep -Fx "$test_name: test" /tmp/tests.list; then
                  echo "MISSING $case"; failed=1; continue
                fi
                echo "RUN $case (AUR paired-build verification)"
                if /fixture/omg-lib-tests --exact "$test_name" --include-ignored --nocapture; then
                  echo "PASS $case"
                else
                  echo "FAIL $case"; failed=1
                fi
              done
              case=elevated_state_roundtrip_preserves_caller_files
              test_name="core::usage::tests::$case"
              if ! grep -Fx "$test_name: test" /tmp/tests.list; then
                echo "MISSING $case"; failed=1
              else
                echo "RUN $case (isolated system state and caller files)"
                # This mount and caller tree live only in this disposable
                # container. No host state or credentials are mounted here.
                mount -t tmpfs -o nosuid,nodev,noexec,mode=755 tmpfs /var/lib
                printf isolated > /var/lib/.omg-state-isolation-fixture
                caller=$(mktemp -d /tmp/omg-state-caller.XXXXXX)
                printf caller-history-sentinel > "$caller/history-target"
                ln -s history-target "$caller/history.json"
                printf caller-usage-sentinel > "$caller/usage.json"
                chown -hR nobody: "$caller"
                if OMG_DATA_DIR="$caller" /fixture/omg-lib-tests --exact "$test_name" --include-ignored --nocapture; then
                  echo "PASS $case"
                else
                  echo "FAIL $case"; failed=1
                fi
              fi
              exit "$failed"
            ' 2>&1 | tee "$RUNNER_TEMP/sandbox-evidence/tests.log"

      - name: Upload sandbox security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-sandbox-security-evidence
          path: ${{ runner.temp }}/sandbox-evidence/
          retention-days: 14
          if-no-files-found: warn

  #############################################################################
  # STAGE 2a: Feature-intersection compile checks
  #
  # Linux already checks and tests arch+pgp+license. Keep only the distinct
  # debian+pgp combination without license, which the platform matrix omits.
  # This lane checks optional-dependency isolation; it does not run tests.
  #############################################################################
  feature-intersections:
    name: "Intersections (${{ matrix.platform }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian-pgp
            image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
            features: debian,pgp
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config sudo \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Setup environment
        run: ${{ matrix.setup }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compute native cache identity
        id: cache-key
        shell: bash
        env:
          CACHE_PLATFORM: ${{ matrix.platform }}
          CACHE_IMAGE: ${{ matrix.image }}
          CACHE_FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          # GitHub cache keys reject commas. Hash the complete compatibility
          # tuple instead of dropping features or making a lossy replacement.
          key=$(printf '%s\0' "$CACHE_PLATFORM" "$CACHE_IMAGE" "$CACHE_FEATURES" | sha256sum)
          printf 'key=%s\n' "${key%% *}" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          prefix-key: v2-intersection-dependencies
          shared-key: ${{ steps.cache-key.outputs.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
          cache-workspace-crates: false

      - name: Check all targets
        run: cargo check --all-targets --no-default-features --features ${{ matrix.features }} --locked

  #############################################################################
  # STAGE 2b: Native Platform Build (macOS)
  #############################################################################
  macos:
    name: "macOS (ARM64)"
    needs: quick-gate
    # `!github.event.act` skips this leg during local act runs (no macOS
    # containers exist); the condition is always true on GitHub.
    if: (needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && !github.event.act
    runs-on: macos-14
    timeout-minutes: 30
    env:
      OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces
      OMG_CONTRACT_SOURCE_SHA: ${{ github.sha }}
      OMG_CONTRACT_PLATFORM: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        # Pin to rust-toolchain.toml's channel so the macOS leg uses the exact
        # same toolchain as every other CI leg (the action otherwise installs
        # the latest "stable").
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          # v1 repeatedly missed restoration but could not reserve its key.
          # Keep dependency compatibility hashes; recover in a fresh namespace.
          prefix-key: "v2-macos-dependencies"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
          cache-workspace-crates: false

      # sccache temporarily disabled due to service outage

      - name: Verify installer destination safety
        run: bash tests/installer_security.sh

      - name: Build
        run: cargo build --release --no-default-features --features macos,pgp,license --locked

      - name: Install nextest
        id: install-nextest
        run: |
          python3 scripts/install-nextest-macos.py \
            --destination "$RUNNER_TEMP/omg-nextest-0.9.143" \
            --receipts "$RUNNER_TEMP/nextest-installer-receipts"

      - name: Preserve nextest installer receipts
        if: always() && steps.install-nextest.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-installer-macos
          path: ${{ runner.temp }}/nextest-installer-receipts/
          retention-days: 14
          if-no-files-found: error

      - name: Verify nextest
        run: cargo nextest --version

      - name: Install Fish unit test dependency
        run: brew list fish &>/dev/null || brew install fish

      - name: Run unit tests
        run: python3 scripts/run-native-contracts.py --features macos,pgp,license

      - name: Install Homebrew test packages
        run: |
          brew list wget &>/dev/null || brew install wget

      - name: Run macOS platform integration tests
        run: |
          cargo test --test macos_tests --no-default-features --features macos,pgp,license --locked -- --test-threads=1

      - name: Verify native Homebrew doctor
        run: python3 scripts/verify-macos-doctor.py target/release/omg

      - name: Verify binary
        run: |
          ./target/release/omg --version
          file ./target/release/omg

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omg-macos-arm64
          path: target/release/omg
          retention-days: 7

      - name: Preserve compiled parser surfaces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-surfaces-macos
          path: target/contract-surfaces/
          retention-days: 14
          if-no-files-found: error

  macos-nextest-source:
    name: "macOS nextest source contract"
    needs: quick-gate
    if: (needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && !github.event.act
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.95.0"

      - name: Build the admitted nextest registry source
        run: |
          python3 scripts/install-nextest-macos.py --source-only \
            --destination "$RUNNER_TEMP/nextest-source-contract" \
            --receipts "$RUNNER_TEMP/nextest-source-receipts"

      - name: Execute a genuine Rust contract with the source-built nextest
        run: |
          python3 - "$RUNNER_TEMP" <<'PY'
          import importlib.util, json, os, pathlib, sys, xml.etree.ElementTree as ET
          root = pathlib.Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location('installer', 'scripts/install-nextest-macos.py')
          installer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(installer)
          receipt = json.loads((root / 'nextest-source-receipts/admission.json').read_text())
          assert receipt['source_only_requested'] and receipt['route'] == 'official-locked-registry-source'
          assert receipt['source_contract']['archive_sha256'] == installer.REGISTRY_SHA
          assert receipt['source_contract']['packaged_lock_sha256'] == installer.LOCK_SHA
          assert receipt['source_contract']['packaged_source_commit'] == installer.SOURCE_COMMIT
          assert receipt['installer_sha256'] == installer.digest(pathlib.Path(spec.origin))
          assert receipt['workflow_source_sha'] == os.environ['GITHUB_SHA']
          binary = root / 'nextest-source-contract/bin/cargo-nextest'
          assert installer.digest(binary) == receipt['binary_sha256']
          project = root / 'nextest-rust-contract'
          project.mkdir(mode=0o700)
          (project / 'src').mkdir()
          (project / '.config').mkdir()
          (project / 'Cargo.toml').write_text('[package]\nname="nextest-installer-contract"\nversion="0.0.0"\nedition="2024"\n')
          (project / 'Cargo.lock').write_text('version=4\n[[package]]\nname="nextest-installer-contract"\nversion="0.0.0"\n')
          (project / 'src/lib.rs').write_text('#[test]\nfn genuine_nextest_rust_execution() { assert_eq!(19u32.checked_add(23), Some(42)); }\n')
          (project / '.config/nextest.toml').write_text('[profile.default]\nretries=0\n[profile.default.junit]\npath="junit.xml"\n')
          commands = installer.Commands(root / 'nextest-rust-receipts')
          environment = dict(os.environ, CARGO_TARGET_DIR=str(project / 'target'), CARGO_NET_OFFLINE='true', CARGO_TERM_COLOR='never')
          code, _, _ = commands.run('genuine-rust-contract', [str(binary), 'nextest', 'run', '--manifest-path', str(project / 'Cargo.toml'), '--locked'], 90, project, environment)
          assert code == 0
          report = project / 'target/nextest/default/junit.xml'
          document = ET.parse(report).getroot()
          cases = document.findall('.//testcase')
          assert len(cases) == 1 and cases[0].get('name') == 'genuine_nextest_rust_execution'
          assert not document.findall('.//skipped') and not document.findall('.//failure') and not document.findall('.//error')
          assert installer.digest(binary) == receipt['binary_sha256']
          (root / 'nextest-rust-receipts/junit.xml').write_bytes(report.read_bytes())
          result = dict(source_sha=os.environ['GITHUB_SHA'], installer_sha256=receipt['installer_sha256'], nextest_sha256=receipt['binary_sha256'], actual_rust_contract_positives=1, failed=0, ignored=0, commands=commands.rows)
          (root / 'nextest-rust-receipts/result.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

      - name: Preserve native nextest source proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-source-contract-macos
          path: |
            ${{ runner.temp }}/nextest-source-receipts/
            ${{ runner.temp }}/nextest-rust-receipts/
          retention-days: 14
          if-no-files-found: error

  #############################################################################
  # STAGE 2c: Ubuntu (matches the Ubuntu release artifact)
  #############################################################################
  ubuntu:
    name: "Linux (ubuntu)"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces
      OMG_CONTRACT_SOURCE_SHA: ${{ github.sha }}
      OMG_CONTRACT_PLATFORM: ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libapt-pkg-dev python3-apt python3-venv fish \
            pkg-config \
            libssl-dev \
            clang \
            cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: clippy

      # rust-cache hashes every installed toolchain, including the runner's
      # unused floating stable. Keep its version out of our pinned build key.
      - name: Remove unused runner toolchain
        run: rustup toolchain uninstall stable

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          prefix-key: "v1-ubuntu-debian"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        run: python3 scripts/native-build-artifact.py build --distro ubuntu --image ubuntu-24.04 --features debian,pgp,license --destination "$RUNNER_TEMP/native-release"

      - name: Verify complete native APT daemon catalogue
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --create-home omg-catalog
          inputs="/tmp/omg-catalog-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 755 "$inputs"
          sudo install -m 644 scripts/test-debian-daemon-catalog.py "$inputs/test-debian-daemon-catalog.py"
          sudo install -m 644 scripts/test_debian_daemon_catalog_lifecycle.py "$inputs/test_debian_daemon_catalog_lifecycle.py"
          sudo runuser -u omg-catalog -- python3 -B -m unittest discover -s "$inputs" -p test_debian_daemon_catalog_lifecycle.py -v
          for name in omg omgd; do
            sudo install -m 755 "target/release/$name" "$inputs/$name"
            cmp "target/release/$name" "$inputs/$name"
          done
          sudo runuser -u omg-catalog -- env OMG_CONTRACT_SOURCE_SHA="$GITHUB_SHA" \
            python3 "$inputs/test-debian-daemon-catalog.py" \
            --omg-binary "$inputs/omg" \
            --omgd-binary "$inputs/omgd" \
            --evidence-dir "/tmp/omg-catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-ubuntu"

      - name: Export native APT catalogue proof for the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for name in receipt.json daemon.log; do
            source="/tmp/omg-catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-ubuntu/$name"
            sudo install -D -m 644 "$source" "$RUNNER_TEMP/apt-daemon-catalog/$name"
          done

      - name: Preserve native APT catalogue proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apt-daemon-catalog-ubuntu
          path: |
            ${{ runner.temp }}/apt-daemon-catalog/receipt.json
            ${{ runner.temp }}/apt-daemon-catalog/daemon.log
          retention-days: 14
          if-no-files-found: error

      - name: Upload native release pair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-ubuntu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Platform clippy
        run: |
          cargo clippy --all-targets --no-default-features --features debian,pgp,license \
            --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Prepare genuine Node activation fixture
        run: timeout -k 5s 180s python3 scripts/prepare-node-test-fixture.py --destination "$RUNNER_TEMP/node-test-fixture"

      - name: Run unit tests
        run: python3 scripts/run-native-contracts.py --features debian,pgp,license

      - name: Run serial library and binary contracts
        run: cargo test --lib --bins --no-default-features --features debian,pgp,license --locked --no-fail-fast -- --test-threads=1

      - name: Verify binary
        run: |
          ./target/release/omg --version
          ./target/release/omg --help | head -20

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omg-ubuntu
          path: target/release/omg
          retention-days: 7
          if-no-files-found: error

      - name: Preserve compiled parser surfaces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-surfaces-ubuntu
          path: target/contract-surfaces/
          retention-days: 14
          if-no-files-found: error

  #############################################################################
  # STAGE 4: Final Status Gate
  #############################################################################
  # NOTE: no `integration` job exists in this workflow; it was referenced here
  # but never defined, which made ci-success unresolvable on GitHub and broke
  # the entire pipeline gate. Local act runs also skip the macos leg, so a
  # skipped macos result is accepted as passing. A skipped platform job must
  # not mint a release tag.
  # This job stays read-only: pull_request events execute the merge-ref
  # (PR-controlled) copy of this file, so a PR must never be able to run
  # workflow code holding a write-scoped token. All write-scoped steps live
  # in the push-to-main-only release-tag job below.
  qemu:
    name: QEMU behavioral verification
    needs: [quick-gate, linux-matrix, ubuntu]
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.quick-gate.result == 'success' &&
      (github.event_name == 'merge_group' || needs.quick-gate.outputs.should-build == 'true')
    uses: ./.github/workflows/qemu-matrix.yml
    permissions:
      contents: read
      actions: read
    secrets:
      OMG_SMOKE_SENTRY_DSN: ${{ github.event_name != 'pull_request' && secrets.OMG_SMOKE_SENTRY_DSN || '' }}

  docs-audit:
    name: Docs audit
    # Unconditional: doc-only changes must not be able to introduce broken
    # links, phantom flags, or unknown commands in fenced code blocks.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit repository docs
        run: make audit-docs


  runtime-usage:
    name: "Runtime usage accounting (Ubuntu)"
    needs: [quick-gate, ubuntu]
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create private accounting state
        env:
          RUNTIME_USAGE_STATE: ${{ runner.temp }}/runtime-usage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf 'RUNTIME_USAGE_STATE=%s\n' "$RUNTIME_USAGE_STATE" >> "$GITHUB_ENV"
          python3 scripts/runtime-usage-ci.py init --state "$RUNTIME_USAGE_STATE"
      - name: Admit this attempt's Ubuntu release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout --kill-after=5s 60s python3 scripts/runtime-usage-ci.py admit --state "$RUNTIME_USAGE_STATE" > "$RUNTIME_USAGE_STATE/evidence/admission.stdout" 2> "$RUNTIME_USAGE_STATE/evidence/admission.stderr"
      - name: Verify real runtime accounting in both telemetry modes
        run: timeout --kill-after=5s 800s python3 scripts/runtime-usage-ci.py run --state "$RUNTIME_USAGE_STATE"
      - name: Upload accounting evidence
        id: upload-runtime-evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_USAGE_STATE }}/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove verified private accounting state
        if: always() && steps.upload-runtime-evidence.outcome == 'success'
        run: timeout --kill-after=5s 10s python3 scripts/runtime-usage-ci.py cleanup --state "$RUNTIME_USAGE_STATE"

  ci-success:
    name: "CI Success"
    needs: [quick-gate, workflow-checks, standalone-suites, portable, linux-matrix, sandbox-cancellation, feature-intersections, macos, macos-nextest-source, ubuntu, qemu, docs-audit, runtime-usage]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate results
        env:
          BUILD_REQUIRED: ${{ needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' }}
          QUICK_GATE: ${{ needs.quick-gate.result }}
          WORKFLOW_CHECKS: ${{ needs.workflow-checks.result }}
          STANDALONE_SUITES: ${{ needs.standalone-suites.result }}
          PORTABLE: ${{ needs.portable.result }}
          LINUX_MATRIX: ${{ needs.linux-matrix.result }}
          SANDBOX_CANCELLATION: ${{ needs.sandbox-cancellation.result }}
          FEATURE_INTERSECTIONS: ${{ needs.feature-intersections.result }}
          MACOS: ${{ needs.macos.result }}
          MACOS_NEXTEST_SOURCE: ${{ needs.macos-nextest-source.result }}
          UBUNTU: ${{ needs.ubuntu.result }}
          RUNTIME_USAGE: ${{ needs.runtime-usage.result }}
          QEMU: ${{ needs.qemu.result }}
          QEMU_REQUIRED: ${{ github.event_name == 'merge_group' || ((github.event_name == 'push' || github.event_name == 'pull_request') && needs.quick-gate.outputs.should-build == 'true') }}
          DOCS_AUDIT: ${{ needs.docs-audit.result }}
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Gate | $QUICK_GATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow checks | $WORKFLOW_CHECKS |" >> $GITHUB_STEP_SUMMARY
          echo "| Standalone suites | $STANDALONE_SUITES |" >> $GITHUB_STEP_SUMMARY
          echo "| Portable Rust | $PORTABLE |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Matrix | $LINUX_MATRIX |" >> $GITHUB_STEP_SUMMARY
          echo "| AUR Sandbox Cancellation | $SANDBOX_CANCELLATION |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Intersections | $FEATURE_INTERSECTIONS |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | $MACOS |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS nextest source contract | $MACOS_NEXTEST_SOURCE |" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu | $UBUNTU |" >> $GITHUB_STEP_SUMMARY
          echo "| Runtime usage accounting | $RUNTIME_USAGE |" >> $GITHUB_STEP_SUMMARY
          echo "| QEMU | $QEMU |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs audit | $DOCS_AUDIT |" >> $GITHUB_STEP_SUMMARY

          if [[ "$DOCS_AUDIT" != "success" ]]; then
            echo "::error::Documentation audit did not succeed: $DOCS_AUDIT"
            exit 1
          fi

          if [[ "$QEMU_REQUIRED" == "true" && "$QEMU" != "success" ]]; then
            echo "::error::Required QEMU verification did not succeed: $QEMU"
            exit 1
          fi

          if [[ "$QUICK_GATE" != "success" ]]; then
            echo "::error::Quick gate failed"
            exit 1
          fi

          if [[ "$WORKFLOW_CHECKS" != "success" ]]; then
            echo "::error::Workflow checks did not succeed: $WORKFLOW_CHECKS"
            exit 1
          fi

          declare -A required_results=(
            ["Standalone suites"]="$STANDALONE_SUITES"
            ["Portable Rust"]="$PORTABLE"
            ["Linux Matrix"]="$LINUX_MATRIX"
            ["AUR Sandbox Cancellation"]="$SANDBOX_CANCELLATION"
            ["Feature Intersections"]="$FEATURE_INTERSECTIONS"
            ["macOS"]="$MACOS"
            ["macOS nextest source contract"]="$MACOS_NEXTEST_SOURCE"
            ["Ubuntu"]="$UBUNTU"
            ["Runtime usage accounting"]="$RUNTIME_USAGE"
          )
          for job in "${!required_results[@]}"; do
            if [[ "${required_results[$job]}" == "skipped" && "$BUILD_REQUIRED" == "false" ]]; then
              continue
            fi
            if [[ "${required_results[$job]}" != "success" ]]; then
              echo "::error::$job did not succeed: ${required_results[$job]}"
              exit 1
            fi
          done

          if [[ "$LINUX_MATRIX" == "success" && "$SANDBOX_CANCELLATION" != "success" ]]; then
            echo "::error::Arch builds completed without the required sandbox regression"
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All required checks passed!" >> $GITHUB_STEP_SUMMARY

  # This definition grants write permissions only to the push-to-main job.
  # A collaborator who can modify workflows can also change this condition;
  # repository rules, not this editable condition, govern that authority.
  release-tag:
    name: "Tag Release"
    needs: [quick-gate, portable, linux-matrix, sandbox-cancellation, feature-intersections, macos, ubuntu, ci-success]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Tag Cargo.toml version when all platform builds succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_MATRIX: ${{ needs.linux-matrix.result }}
          SANDBOX_CANCELLATION: ${{ needs.sandbox-cancellation.result }}
          FEATURE_INTERSECTIONS: ${{ needs.feature-intersections.result }}
          MACOS: ${{ needs.macos.result }}
          UBUNTU: ${{ needs.ubuntu.result }}
        run: |
          if [[ "$LINUX_MATRIX" != "success" \
             || "$SANDBOX_CANCELLATION" != "success" \
             || "$FEATURE_INTERSECTIONS" != "success" \
             || "$MACOS" != "success" \
             || "$UBUNTU" != "success" ]]; then
            echo "Platform jobs were skipped or incomplete; not tagging a release"
            exit 0
          fi

          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          test -n "$VERSION"
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag $TAG already exists; bump Cargo.toml to cut a new alpha"
            exit 0
          fi

          scripts/require-workflow-success.sh benchmark.yml "$GITHUB_SHA" Benchmark
          # Version tags are immutable. Validate the other workflows BEFORE
          # creating a tag, so a failed candidate cannot consume a version.
          # CI's own platform jobs are required through this job's needs.
          scripts/require-workflow-success.sh audit.yml "$GITHUB_SHA" "Security Audit"
          scripts/require-workflow-success.sh secrets.yml "$GITHUB_SHA" "Secret Scanning"
          scripts/require-workflow-success.sh codeql.yml "$GITHUB_SHA" CodeQL
          scripts/require-workflow-success.sh coverage.yml "$GITHUB_SHA" Coverage
          scripts/require-workflow-success.sh docker-e2e.yml "$GITHUB_SHA" "Docker E2E"
          # CI Success already requires this run's staged QEMU verification.

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Pushed $TAG but origin does not have refs/tags/${TAG}"
            exit 1
          fi
          echo "Tagged $TAG at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged $TAG at $GITHUB_SHA"

          # GITHUB_TOKEN tag pushes do not start other workflows. Dispatch
          # Release explicitly so GitHub Latest is not left on a 7-month-old tag.
          gh workflow run release.yml --ref "$TAG" -f dry_run=false
          echo "Dispatched Release for $TAG"

  deno-alias-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.deno-proof-release == 'root-reviewed' && startsWith(github.ref, 'refs/heads/codex/deno-alias-proof-')
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
    container:
      image: fedora:latest@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
      options: --memory=6g --memory-swap=6g --pids-limit=512
    steps:
      - name: Existing Fedora prerequisites
        timeout-minutes: 13
        run: |
          set -eu
          timeout -k 10s 12m dnf --setopt='*.skip_if_unavailable=False' \
            install -y --setopt=install_weak_deps=False \
            git clang cmake openssl-devel pkgconfig findutils curl procps-ng python3 zsh fish \
            rpm dnf sqlite yum-utils fedora-release
          rpm --initdb
      - name: Pinned Rust provider
        timeout-minutes: 21
        run: |
          set -eu
          umask 022
          test "$(id -u)" -eq 0
          test -d /opt
          test ! -L /opt
          test ! -e /opt/omg-deno-proof
          test ! -L /opt/omg-deno-proof
          install -d -m 0755 -o 0 -g 0 /opt/omg-deno-proof /opt/omg-deno-proof/rustup /opt/omg-deno-proof/bootstrap-cargo
          export RUSTUP_HOME=/opt/omg-deno-proof/rustup
          export CARGO_HOME=/opt/omg-deno-proof/bootstrap-cargo
          timeout -k 15s 1200s sh -eu -c '
            curl --proto "=https" --tlsv1.2 -fsSL https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init -o /opt/omg-deno-proof/rustup-init
            echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /opt/omg-deno-proof/rustup-init" | sha256sum --check
            chmod 0755 /opt/omg-deno-proof/rustup-init
            /opt/omg-deno-proof/rustup-init -y --profile minimal --default-toolchain 1.95.0'
          stat -c 'DENO_PROVIDER_BOOTSTRAP path=%n uid=%u gid=%g mode=%a' /opt/omg-deno-proof /opt/omg-deno-proof/rustup /opt/omg-deno-proof/bootstrap-cargo /opt/omg-deno-proof/rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu/bin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ordinary test identity
        timeout-minutes: 1
        run: |
          set -eu
          if getent passwd omg-deno-proof; then exit 1; fi
          useradd --create-home omg-deno-proof
          test "$(id -u omg-deno-proof)" -gt 0
      - name: Independently owned actual proof
        id: deno-proof
        timeout-minutes: 137
        run: |
          set -eu
          receipt_path="$RUNNER_TEMP/deno-alias-proof/receipts"
          printf 'receipt-path=%s\n' "$receipt_path" >> "$GITHUB_OUTPUT"
          printf 'DENO_PROOF_RECEIPT_PATH=%s\n' "$receipt_path"
          timeout -k 45s 8100s python3 -I -B .audit/deno-proof/supervisor.py
      - name: Preserve actual receipts and baseline source batch
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deno-alias-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.deno-proof.outputs.receipt-path }}
          retention-days: 14
          if-no-files-found: error
# Evidence includes942 intact baseline source bodies from actual Git batch stdout.
# State source copies/target/Cargo sources/fault files/libtest binaries are excluded.
# Workspace disposition is retained; root confirms upload before scoped cleanup.
