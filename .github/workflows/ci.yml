# World-Class CI Pipeline for OMG
# Optimized for speed, reliability, and comprehensive coverage
#
# Key Features:
# - PR path filtering: Avoid redundant platform builds for documentation
# - Quick gate: Fast checks run first, gate expensive builds
# - Matrix strategy: 6 platforms tested in parallel
# - cargo-nextest: 10-35% faster test execution
# - Artifact caching: Shared caches across jobs
# - Timeout protection: Prevents runaway jobs
# - Test reporting: exact nextest selection, JUnit attempts and parser receipts

name: CI

on:
  push:
    branches: [main]
    # Every main commit needs exact-commit evidence for the release gate.
  # Always report the required check on PRs. The job-level change filter
  # below skips platform builds for documentation/configuration-only changes.
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: "Skip cache restoration"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # PRs cancel superseded runs; main never cancels so queued main runs
  # (e.g. #175 behind #172) still complete instead of being dropped.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_LTO: "off"
  CARGO_PROFILE_TEST_LTO: "off"

jobs:
  #############################################################################
  # STAGE 1: Quick Gate
  # Formatting, shell syntax and policy tests gate platform builds.
  # Portable Rust owns portable Clippy and fuzz compilation, so these
  # independent checks do not delay every platform behind a second build.
  #############################################################################
  quick-gate:
    name: "Quick Gate"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should-build: ${{ github.event_name == 'push' || steps.changes.outputs.required == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: python3 scripts/ci-change-scope.py

      - name: Validate change classification
        run: python3 -m unittest discover -s scripts -p test_ci_change_scope.py

      - name: Install Rust
        if: steps.changes.outputs.required == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Run quick workflow checks
        if: steps.changes.outputs.required == 'true'
        run: make ci-workflow-quick

      - name: Verify installer destination safety
        run: bash tests/installer_security.sh

  portable:
    name: "Portable Rust"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces
      OMG_CONTRACT_SOURCE_SHA: ${{ github.sha }}
      OMG_CONTRACT_PLATFORM: portable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          prefix-key: "v2-portable"
          shared-key: "portable"
          cache-on-failure: true
          # PRs restore main's cache; merge-ref writes only benefit that PR's reruns.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: |
          cargo clippy --all-targets --no-default-features --features pgp,license \
            --locked -- -D warnings

      - name: Debian feature isolation clippy
        run: |
          cargo clippy --all-targets --no-default-features \
            --features debian-pure --locked -- -D warnings

      - name: Check fuzz targets
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

      - name: Check Bash and Zsh package completion
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update --error-on=any -qq && break || sleep 10
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          sudo apt-get install -y --no-install-recommends zsh
          set +e
          timeout -k 10s 30s zsh tests/shell_completion.zsh > /tmp/shell-completion.log 2>&1
          rc=$?
          set -e
          cat /tmp/shell-completion.log
          echo '--- child zsh startup log ---'
          cat /tmp/omg-zsh-child.log 2>/dev/null || true
          exit "$rc"

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest

      - name: Run portable tests
        run: python3 scripts/run-native-contracts.py --features pgp,license

      - name: Verify pure Debian parser and daemon contracts
        env:
          OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces/debian-pure
          OMG_CONTRACT_PLATFORM: debian-pure
        run: python3 scripts/run-native-contracts.py --features debian-pure

      - name: Preserve compiled parser surfaces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-surfaces-portable
          path: target/contract-surfaces/
          retention-days: 14
          if-no-files-found: error

      - name: Verify portable environment CLI round-trip
        run: cargo nextest run --test env_portability_cli --no-default-features --features pgp,license --locked --profile ci

  #############################################################################
  # STAGE 2: Platform Matrix (Linux containers)
  # Parallel builds across Arch, Debian, Fedora
  #############################################################################
  linux-matrix:
    name: "Linux (${{ matrix.platform }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces
      OMG_CONTRACT_SOURCE_SHA: ${{ github.sha }}
      OMG_CONTRACT_PLATFORM: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arch
            image: archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
            features: arch,pgp,license
            setup: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel git pkgconf openssl libarchive clang cmake curl jq python
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

          - platform: debian
            image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
            features: debian,pgp,license
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config sudo python3 \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

          - platform: debian-trixie
            image: debian:trixie@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
            features: debian,pgp,license
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config sudo python3 \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

          - platform: fedora
            image: fedora:latest@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
            features: fedora,pgp,license
            setup: |
              timeout -k 10s 12m dnf \
                --setopt=fedora.metalink= \
                --setopt=fedora.baseurl='https://dl.fedoraproject.org/pub/fedora/linux/releases/$releasever/Everything/$basearch/os/' \
                --setopt=updates.metalink= \
                --setopt=updates.baseurl='https://dl.fedoraproject.org/pub/fedora/linux/updates/$releasever/Everything/$basearch/' \
                install -y --setopt=install_weak_deps=False \
                git clang cmake openssl-devel pkgconfig findutils curl procps-ng python3 \
                rpm dnf sqlite yum-utils fedora-release
              rpm --initdb
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Setup environment
        run: ${{ matrix.setup }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # sccache temporarily disabled due to service outage

      - name: Compute native cache identity
        id: cache-key
        shell: bash
        env:
          CACHE_PLATFORM: ${{ matrix.platform }}
          CACHE_IMAGE: ${{ matrix.image }}
          CACHE_FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          # GitHub cache keys reject commas. Hash the complete compatibility
          # tuple instead of dropping features or making a lossy replacement.
          key=$(printf '%s\0' "$CACHE_PLATFORM" "$CACHE_IMAGE" "$CACHE_FEATURES" | sha256sum)
          printf 'key=%s\n' "${key%% *}" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          prefix-key: v2-platform-dependencies
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Never restore across distro ABI or feature contracts. The action
          # additionally keys rustc, Cargo config, lockfiles and compiler flags.
          shared-key: ${{ steps.cache-key.outputs.key }}
          cache-bin: false
          cache-workspace-crates: false

      - name: Build release
        shell: bash
        env:
          DISTRO: ${{ matrix.platform }}
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_FEATURES: ${{ matrix.features }}
        run: |
          python3 scripts/native-build-artifact.py build --distro "$DISTRO" \
            --image "$BUILD_IMAGE" --features "$BUILD_FEATURES" --destination "$RUNNER_TEMP/native-release"

      - name: Upload native release pair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Platform clippy
        run: |
          cargo clippy --all-targets --no-default-features --features ${{ matrix.features }} \
            --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Run unit tests
        run: python3 scripts/run-native-contracts.py --features ${{ matrix.features }}

      - name: Run serial library and binary contracts
        if: matrix.platform != 'debian-trixie'
        # Preserve the former staged-QEMU libtest owner alongside nextest.
        run: cargo test --lib --bins --no-default-features --features ${{ matrix.features }} --locked --no-fail-fast -- --test-threads=1

      - name: Prepare sandbox regression executable
        if: matrix.platform == 'arch'
        shell: bash
        run: |
          set -euo pipefail
          binary=$(cargo test --lib --no-run --no-default-features --features arch,pgp,license \
            --locked --message-format=json | jq -r \
            'select(.reason == "compiler-artifact" and .target.name == "omg_lib" and .profile.test) | .executable // empty')
          test -n "$binary"
          install -Dm755 "$binary" target/sandbox-test/omg-lib-tests

      - name: Upload sandbox regression executable
        if: matrix.platform == 'arch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-sandbox-test
          path: target/sandbox-test/omg-lib-tests
          retention-days: 1
          if-no-files-found: error

      - name: Debian deterministic benchmark regression check
        if: matrix.platform == 'debian'
        env:
          OMG_BENCH_WRITE_JSON: "1"
          OMG_BENCH_JSON_OUT: target/bench/debian-matrix.json
          OMG_BENCH_BASELINE_JSON: benchmarks/baselines/debian-matrix-baseline.json
          OMG_BENCH_REGRESSION_MULTIPLIER: "2.0"
        run: |
          cargo test --test bench_debian --no-default-features --features ${{ matrix.features }} --locked \
            bench_debian_deterministic_matrix -- --nocapture

      - name: Upload Debian benchmark artifact
        if: matrix.platform == 'debian'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-debian-matrix
          path: target/bench/debian-matrix.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish Debian benchmark summary
        if: matrix.platform == 'debian'
        run: |
          echo "## Debian Deterministic Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat target/bench/debian-matrix.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify binary
        run: |
          ./target/release/omg --version
          ./target/release/omg --help | head -20

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omg-${{ matrix.platform }}
          path: target/release/omg
          retention-days: 7
          if-no-files-found: error

      - name: Preserve compiled parser surfaces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-surfaces-${{ matrix.platform }}
          path: target/contract-surfaces/
          retention-days: 14
          if-no-files-found: error

  sandbox-cancellation:
    name: "AUR sandbox security regressions"
    needs: [quick-gate, linux-matrix]
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aur-sandbox-test
          path: fixture

      - name: Prepare sandbox runtime image
        run: |
          docker build --tag omg-sandbox-regression - <<'DOCKERFILE'
          FROM archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
          RUN pacman -Syu --noconfirm --needed bubblewrap fakeroot && pacman -Scc --noconfirm
          DOCKERFILE

      - name: Prepare sandbox seccomp profile
        run: |
          curl -fsS https://raw.githubusercontent.com/moby/profiles/61eaf32614c7c71b60bd8927d3e6a4ffc8ff1f31/seccomp/default.json -o seccomp-default.json
          echo '536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  seccomp-default.json' | sha256sum --check
          jq '(.syscalls[] | select(.includes.caps == ["CAP_SYS_ADMIN"]) | .names) += ["pivot_root"]' \
            seccomp-default.json > seccomp-sandbox.json

      - name: Verify sandbox isolation and descendant cleanup
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x fixture/omg-lib-tests
          mkdir -p "$RUNNER_TEMP/sandbox-evidence"
          # Only this fixture gets namespace permissions, not compilation or
          # other tests. No checkout, credentials, or Docker socket are mounted.
          # Bubblewrap also needs pivot_root, which the default profile denies.
          docker run --rm --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            --security-opt "seccomp=$PWD/seccomp-sandbox.json" \
            --pids-limit 128 --memory 1g --cpus 2 \
            --mount "type=bind,source=$PWD/fixture,target=/fixture,readonly" \
            omg-sandbox-regression /bin/bash -euo pipefail -c '
              command -v bwrap
              command -v fakeroot
              test "$(id -u)" = 0
              getent passwd nobody
              # A successful namespace probe prevents a denied bwrap startup
              # from masquerading as the read-only-root rejection test passing.
              bwrap --ro-bind / / --unshare-pid --proc /proc -- /bin/true
              # Create the user namespace with the existing container-root
              # permissions, then map the payload to nobody and drop its caps.
              # This does not require relaxing host unprivileged-userns policy.
              bwrap --unshare-user --uid "$(id -u nobody)" --gid "$(id -g nobody)" \
                --cap-drop ALL --ro-bind / / --proc /proc -- /usr/bin/id
              /fixture/omg-lib-tests --include-ignored --list > /tmp/tests.list
              failed=0
              for case in cancelling_logged_sandbox_build_terminates_descendants \
                bwrap_readonly_root_blocks_arbitrary_writes \
                sandbox_fakeroot_skips_unmappable_real_chown \
                makepkg_invocations_isolate_every_writable_cache \
                invocation_ownership_setup_uses_only_private_directory_handles \
                fresh_outputs_never_fall_back_to_checkout_or_other_invocations \
                chroot_requires_explicit_host_code_consent_before_launch; do
                test_name="package_managers::aur::client::tests::$case"
                if ! grep -Fx "$test_name: test" /tmp/tests.list; then
                  echo "MISSING $case"; failed=1; continue
                fi
                echo "RUN $case (required tools present; root handoff enabled)"
                if /fixture/omg-lib-tests --exact "$test_name" --include-ignored --nocapture; then
                  echo "PASS $case"
                else
                  echo "FAIL $case"; failed=1
                fi
              done
              # Arch treats PKGBUILD/install hooks as executable input, so the
              # archive parser is a required security gate:
              # https://man.archlinux.org/man/PKGBUILD.5
              for case in member_paths_reject_absolute_parent_and_empty_paths \
                links_cannot_escape_the_archive_root \
                buildinfo_requires_one_complete_identity \
                inspector_classifies_install_hook_and_setuid_file \
                inspector_rejects_special_files_and_duplicate_paths \
                inspector_requires_paired_build_for_system_integration_payloads; do
                test_name="package_managers::aur::artifact_inspector::tests::$case"
                if ! grep -Fx "$test_name: test" /tmp/tests.list; then
                  echo "MISSING $case"; failed=1; continue
                fi
                echo "RUN $case (AUR archive inspection)"
                if /fixture/omg-lib-tests --exact "$test_name" --include-ignored --nocapture; then
                  echo "PASS $case"
                else
                  echo "FAIL $case"; failed=1
                fi
              done
              for case in paired_output_verification_is_order_independent_and_exact \
                reproducible_epoch_is_stable_and_rejects_invalid_digests; do
                test_name="package_managers::aur::client::tests::$case"
                if ! grep -Fx "$test_name: test" /tmp/tests.list; then
                  echo "MISSING $case"; failed=1; continue
                fi
                echo "RUN $case (AUR paired-build verification)"
                if /fixture/omg-lib-tests --exact "$test_name" --include-ignored --nocapture; then
                  echo "PASS $case"
                else
                  echo "FAIL $case"; failed=1
                fi
              done
              case=elevated_state_roundtrip_preserves_caller_files
              test_name="core::usage::tests::$case"
              if ! grep -Fx "$test_name: test" /tmp/tests.list; then
                echo "MISSING $case"; failed=1
              else
                echo "RUN $case (isolated system state and caller files)"
                # This mount and caller tree live only in this disposable
                # container. No host state or credentials are mounted here.
                mount -t tmpfs -o nosuid,nodev,noexec,mode=755 tmpfs /var/lib
                printf isolated > /var/lib/.omg-state-isolation-fixture
                caller=$(mktemp -d /tmp/omg-state-caller.XXXXXX)
                printf caller-history-sentinel > "$caller/history-target"
                ln -s history-target "$caller/history.json"
                printf caller-usage-sentinel > "$caller/usage.json"
                chown -hR nobody: "$caller"
                if OMG_DATA_DIR="$caller" /fixture/omg-lib-tests --exact "$test_name" --include-ignored --nocapture; then
                  echo "PASS $case"
                else
                  echo "FAIL $case"; failed=1
                fi
              fi
              exit "$failed"
            ' 2>&1 | tee "$RUNNER_TEMP/sandbox-evidence/tests.log"

      - name: Upload sandbox security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-sandbox-security-evidence
          path: ${{ runner.temp }}/sandbox-evidence/
          retention-days: 14
          if-no-files-found: warn

  #############################################################################
  # STAGE 2a: Feature-intersection compile checks
  #
  # Linux already checks and tests arch+pgp+license. Keep only the distinct
  # debian+pgp combination without license, which the platform matrix omits.
  # This lane checks optional-dependency isolation; it does not run tests.
  #############################################################################
  feature-intersections:
    name: "Intersections (${{ matrix.platform }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian-pgp
            image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
            features: debian,pgp
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config sudo \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Setup environment
        run: ${{ matrix.setup }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compute native cache identity
        id: cache-key
        shell: bash
        env:
          CACHE_PLATFORM: ${{ matrix.platform }}
          CACHE_IMAGE: ${{ matrix.image }}
          CACHE_FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          # GitHub cache keys reject commas. Hash the complete compatibility
          # tuple instead of dropping features or making a lossy replacement.
          key=$(printf '%s\0' "$CACHE_PLATFORM" "$CACHE_IMAGE" "$CACHE_FEATURES" | sha256sum)
          printf 'key=%s\n' "${key%% *}" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          prefix-key: v2-intersection-dependencies
          shared-key: ${{ steps.cache-key.outputs.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
          cache-workspace-crates: false

      - name: Check all targets
        run: cargo check --all-targets --no-default-features --features ${{ matrix.features }} --locked

  #############################################################################
  # STAGE 2b: Native Platform Build (macOS)
  #############################################################################
  macos:
    name: "macOS (ARM64)"
    needs: quick-gate
    # `!github.event.act` skips this leg during local act runs (no macOS
    # containers exist); the condition is always true on GitHub.
    if: (needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && !github.event.act
    runs-on: macos-14
    timeout-minutes: 30
    env:
      OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces
      OMG_CONTRACT_SOURCE_SHA: ${{ github.sha }}
      OMG_CONTRACT_PLATFORM: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        # Pin to rust-toolchain.toml's channel so the macOS leg uses the exact
        # same toolchain as every other CI leg (the action otherwise installs
        # the latest "stable").
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          # v1 repeatedly missed restoration but could not reserve its key.
          # Keep dependency compatibility hashes; recover in a fresh namespace.
          prefix-key: "v2-macos-dependencies"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
          cache-workspace-crates: false

      # sccache temporarily disabled due to service outage

      - name: Verify installer destination safety
        run: bash tests/installer_security.sh

      - name: Build
        run: cargo build --release --no-default-features --features macos,pgp,license --locked

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Run unit tests
        run: python3 scripts/run-native-contracts.py --features macos,pgp,license

      - name: Install Homebrew test packages
        run: |
          brew list wget &>/dev/null || brew install wget

      - name: Run macOS platform integration tests
        run: |
          cargo test --test macos_tests --no-default-features --features macos,pgp,license --locked -- --test-threads=1

      - name: Verify binary
        run: |
          ./target/release/omg --version
          file ./target/release/omg

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omg-macos-arm64
          path: target/release/omg
          retention-days: 7

      - name: Preserve compiled parser surfaces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-surfaces-macos
          path: target/contract-surfaces/
          retention-days: 14
          if-no-files-found: error

  #############################################################################
  # STAGE 2c: Ubuntu (matches the Ubuntu release artifact)
  #############################################################################
  ubuntu:
    name: "Linux (ubuntu)"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMG_CONTRACT_SURFACE_OUT: target/contract-surfaces
      OMG_CONTRACT_SOURCE_SHA: ${{ github.sha }}
      OMG_CONTRACT_PLATFORM: ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libapt-pkg-dev \
            pkg-config \
            libssl-dev \
            clang \
            cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          prefix-key: "v1-ubuntu-debian"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        run: python3 scripts/native-build-artifact.py build --distro ubuntu --image ubuntu-24.04 --features debian,pgp,license --destination "$RUNNER_TEMP/native-release"

      - name: Upload native release pair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-ubuntu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Platform clippy
        run: |
          cargo clippy --all-targets --no-default-features --features debian,pgp,license \
            --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Run unit tests
        run: python3 scripts/run-native-contracts.py --features debian,pgp,license

      - name: Run serial library and binary contracts
        run: cargo test --lib --bins --no-default-features --features debian,pgp,license --locked --no-fail-fast -- --test-threads=1

      - name: Verify binary
        run: |
          ./target/release/omg --version
          ./target/release/omg --help | head -20

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omg-ubuntu
          path: target/release/omg
          retention-days: 7
          if-no-files-found: error

      - name: Preserve compiled parser surfaces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-surfaces-ubuntu
          path: target/contract-surfaces/
          retention-days: 14
          if-no-files-found: error

  #############################################################################
  # STAGE 4: Final Status Gate
  #############################################################################
  # NOTE: no `integration` job exists in this workflow; it was referenced here
  # but never defined, which made ci-success unresolvable on GitHub and broke
  # the entire pipeline gate. Local act runs also skip the macos leg, so a
  # skipped macos result is accepted as passing. A skipped platform job must
  # not mint a release tag.
  # This job stays read-only: pull_request events execute the merge-ref
  # (PR-controlled) copy of this file, so a PR must never be able to run
  # workflow code holding a write-scoped token. All write-scoped steps live
  # in the push-to-main-only release-tag job below.
  qemu:
    name: QEMU behavioral verification
    needs: [quick-gate, linux-matrix, ubuntu]
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.quick-gate.outputs.should-build == 'true'
    uses: ./.github/workflows/qemu-matrix.yml
    permissions:
      contents: read
      actions: read
    secrets:
      OMG_SMOKE_SENTRY_DSN: ${{ github.event_name != 'pull_request' && secrets.OMG_SMOKE_SENTRY_DSN || '' }}

  docs-audit:
    name: Docs audit
    # Unconditional: doc-only changes must not be able to introduce broken
    # links, phantom flags, or unknown commands in fenced code blocks.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit repository docs
        run: make audit-docs


  ci-success:
    name: "CI Success"
    needs: [quick-gate, portable, linux-matrix, sandbox-cancellation, feature-intersections, macos, ubuntu, qemu, docs-audit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate results
        env:
          BUILD_REQUIRED: ${{ needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' }}
          QUICK_GATE: ${{ needs.quick-gate.result }}
          PORTABLE: ${{ needs.portable.result }}
          LINUX_MATRIX: ${{ needs.linux-matrix.result }}
          SANDBOX_CANCELLATION: ${{ needs.sandbox-cancellation.result }}
          FEATURE_INTERSECTIONS: ${{ needs.feature-intersections.result }}
          MACOS: ${{ needs.macos.result }}
          UBUNTU: ${{ needs.ubuntu.result }}
          QEMU: ${{ needs.qemu.result }}
          QEMU_REQUIRED: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && needs.quick-gate.outputs.should-build == 'true' }}
          DOCS_AUDIT: ${{ needs.docs-audit.result }}
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Gate | $QUICK_GATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Portable Rust | $PORTABLE |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Matrix | $LINUX_MATRIX |" >> $GITHUB_STEP_SUMMARY
          echo "| AUR Sandbox Cancellation | $SANDBOX_CANCELLATION |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Intersections | $FEATURE_INTERSECTIONS |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | $MACOS |" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu | $UBUNTU |" >> $GITHUB_STEP_SUMMARY
          echo "| QEMU | $QEMU |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs audit | $DOCS_AUDIT |" >> $GITHUB_STEP_SUMMARY

          if [[ "$DOCS_AUDIT" != "success" ]]; then
            echo "::error::Documentation audit did not succeed: $DOCS_AUDIT"
            exit 1
          fi

          if [[ "$QEMU_REQUIRED" == "true" && "$QEMU" != "success" ]]; then
            echo "::error::Required QEMU verification did not succeed: $QEMU"
            exit 1
          fi

          if [[ "$QUICK_GATE" != "success" ]]; then
            echo "::error::Quick gate failed"
            exit 1
          fi

          declare -A required_results=(
            ["Portable Rust"]="$PORTABLE"
            ["Linux Matrix"]="$LINUX_MATRIX"
            ["AUR Sandbox Cancellation"]="$SANDBOX_CANCELLATION"
            ["Feature Intersections"]="$FEATURE_INTERSECTIONS"
            ["macOS"]="$MACOS"
            ["Ubuntu"]="$UBUNTU"
          )
          for job in "${!required_results[@]}"; do
            if [[ "${required_results[$job]}" == "skipped" && "$BUILD_REQUIRED" == "false" ]]; then
              continue
            fi
            if [[ "${required_results[$job]}" != "success" ]]; then
              echo "::error::$job did not succeed: ${required_results[$job]}"
              exit 1
            fi
          done

          if [[ "$LINUX_MATRIX" == "success" && "$SANDBOX_CANCELLATION" != "success" ]]; then
            echo "::error::Arch builds completed without the required sandbox regression"
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All required checks passed!" >> $GITHUB_STEP_SUMMARY

  # This definition grants write permissions only to the push-to-main job.
  # A collaborator who can modify workflows can also change this condition;
  # repository rules, not this editable condition, govern that authority.
  release-tag:
    name: "Tag Release"
    needs: [quick-gate, portable, linux-matrix, sandbox-cancellation, feature-intersections, macos, ubuntu, ci-success]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Tag Cargo.toml version when all platform builds succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_MATRIX: ${{ needs.linux-matrix.result }}
          SANDBOX_CANCELLATION: ${{ needs.sandbox-cancellation.result }}
          FEATURE_INTERSECTIONS: ${{ needs.feature-intersections.result }}
          MACOS: ${{ needs.macos.result }}
          UBUNTU: ${{ needs.ubuntu.result }}
        run: |
          if [[ "$LINUX_MATRIX" != "success" \
             || "$SANDBOX_CANCELLATION" != "success" \
             || "$FEATURE_INTERSECTIONS" != "success" \
             || "$MACOS" != "success" \
             || "$UBUNTU" != "success" ]]; then
            echo "Platform jobs were skipped or incomplete; not tagging a release"
            exit 0
          fi

          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          test -n "$VERSION"
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag $TAG already exists; bump Cargo.toml to cut a new alpha"
            exit 0
          fi

          scripts/require-workflow-success.sh benchmark.yml "$GITHUB_SHA" Benchmark
          # Version tags are immutable. Validate the other workflows BEFORE
          # creating a tag, so a failed candidate cannot consume a version.
          # CI's own platform jobs are required through this job's needs.
          scripts/require-workflow-success.sh audit.yml "$GITHUB_SHA" "Security Audit"
          scripts/require-workflow-success.sh secrets.yml "$GITHUB_SHA" "Secret Scanning"
          scripts/require-workflow-success.sh codeql.yml "$GITHUB_SHA" CodeQL
          scripts/require-workflow-success.sh coverage.yml "$GITHUB_SHA" Coverage
          scripts/require-workflow-success.sh docker-e2e.yml "$GITHUB_SHA" "Docker E2E"
          # CI Success already requires this run's staged QEMU verification.

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Pushed $TAG but origin does not have refs/tags/${TAG}"
            exit 1
          fi
          echo "Tagged $TAG at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged $TAG at $GITHUB_SHA"

          # GITHUB_TOKEN tag pushes do not start other workflows. Dispatch
          # Release explicitly so GitHub Latest is not left on a 7-month-old tag.
          gh workflow run release.yml --ref "$TAG" -f dry_run=false
          echo "Dispatched Release for $TAG"
