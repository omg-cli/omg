# One x64 guest lane. Automatic runs reuse native CI; manual staged runs build here.
# Same-revision local caller only.
name: QEMU distro lane
on:
  workflow_call:
    inputs:
      reuse-ci:
        default: false
        type: boolean
      distro:
        required: true
        type: string
      staged:
        required: true
        type: boolean
      tag:
        required: true
        type: string
      image:
        required: true
        type: string
      features:
        required: true
        type: string
      setup:
        required: true
        type: string
    secrets:
      OMG_SMOKE_SENTRY_DSN:
        required: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
defaults:
  run:
    shell: bash
jobs:

  build-staged:
    name: "Staged build (${{ inputs.distro }})"
    if: inputs.staged && !inputs.reuse-ci && inputs.distro != 'ubuntu'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Setup environment
        run: ${{ inputs.setup }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust toolchain
        # Match rust-toolchain.toml (1.95.0) instead of floating "stable"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: qemu-staged-v1
          key: x64-${{ inputs.distro }}-${{ hashFiles('.github/workflows/qemu-matrix.yml', '.github/workflows/qemu-lane.yml') }}
          cache-bin: false
          cache-on-failure: false

      - name: Run library and binary unit tests (including omgd)
        run: cargo test --lib --bins --no-default-features --features ${{ inputs.features }} --locked --no-fail-fast -- --test-threads=1

      - name: Build
        env:
          DISTRO: ${{ inputs.distro }}
        run: |
          # Match release.yml: only the Arch release raises the CPU baseline.
          if [[ "$DISTRO" == arch ]]; then
            export RUSTFLAGS="-C target-cpu=x86-64-v2"
          fi
          cargo build --timings --release --no-default-features --features ${{ inputs.features }} --locked

      - name: Preserve compiler timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-x64-${{ inputs.distro }}
          path: target/cargo-timings/
          retention-days: 7
          if-no-files-found: ignore

      - name: Package like the release recipe
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-${{ inputs.distro }}"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-${{ inputs.distro }}/"
          cp target/release/omgd "omg-v${VERSION}-x86_64-linux-${{ inputs.distro }}/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-${{ inputs.distro }}/"
          tar -czf "omg-v${VERSION}-x86_64-linux-${{ inputs.distro }}.tar.gz" "omg-v${VERSION}-x86_64-linux-${{ inputs.distro }}"
          sha256sum "omg-v${VERSION}-x86_64-linux-${{ inputs.distro }}.tar.gz" > "omg-v${VERSION}-x86_64-linux-${{ inputs.distro }}.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-${{ inputs.distro }}
          path: omg-v*.tar.gz*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  build-staged-ubuntu:
    name: "Staged build (ubuntu)"
    if: inputs.staged && !inputs.reuse-ci && inputs.distro == 'ubuntu'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libapt-pkg-dev \
            pkg-config \
            libssl-dev \
            clang \
            cmake

      - name: Install Rust toolchain
        # Match rust-toolchain.toml (1.95.0) instead of floating "stable"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: qemu-staged-v1
          key: x64-ubuntu-${{ hashFiles('.github/workflows/qemu-matrix.yml', '.github/workflows/qemu-lane.yml') }}
          cache-bin: false
          cache-on-failure: false

      - name: Run library and binary unit tests (including omgd)
        run: cargo test --lib --bins --no-default-features --features debian,pgp,license --locked --no-fail-fast -- --test-threads=1

      - name: Build
        run: cargo build --timings --release --no-default-features --features debian,pgp,license --locked

      - name: Preserve compiler timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-x64-ubuntu
          path: target/cargo-timings/
          retention-days: 7
          if-no-files-found: ignore

      - name: Package like the release recipe
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-ubuntu"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-ubuntu/"
          cp target/release/omgd "omg-v${VERSION}-x86_64-linux-ubuntu/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-ubuntu/"
          tar -czf "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz" "omg-v${VERSION}-x86_64-linux-ubuntu"
          sha256sum "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz" > "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-ubuntu
          path: omg-v*.tar.gz*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  guest:
    name: "QEMU guest (${{ inputs.distro }})"
    needs: [build-staged, build-staged-ubuntu]
    if: >-
      !cancelled() &&
      ((!inputs.staged && needs.build-staged.result == 'skipped' && needs.build-staged-ubuntu.result == 'skipped') ||
       (inputs.staged && inputs.reuse-ci && needs.build-staged.result == 'skipped' && needs.build-staged-ubuntu.result == 'skipped') ||
       (inputs.staged && inputs.distro != 'ubuntu' && needs.build-staged.result == 'success' && needs.build-staged-ubuntu.result == 'skipped') ||
       (inputs.staged && inputs.distro == 'ubuntu' && needs.build-staged-ubuntu.result == 'success' && needs.build-staged.result == 'skipped'))
    # Pilot one trusted lane so the single WSL runner does not serialize the matrix.
    runs-on: ${{ inputs.distro == 'fedora' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.OMG_CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    # RUNNER_TEMP can retain root-owned evidence on self-hosted runners.
    # Run-scoped names preserve the exporter's no-overwrite guarantee.
    env:
      QEMU_EVIDENCE_NAME: qemu-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.distro }}
      QEMU_UPLOAD_NAME: qemu-upload-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.distro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record evidence provenance
        env:
          ARTIFACT_TAG: ${{ inputs.tag }}
          STAGED: ${{ inputs.staged }}
          DISTRO: ${{ inputs.distro }}
        run: |
          mkdir -p "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME"
          jq -n --arg revision "$GITHUB_SHA" --arg tag "$ARTIFACT_TAG" --arg staged "$STAGED" \
            --arg distro "$DISTRO" --arg arch "$(uname -m)" \
            '{harness_revision:$revision,artifact_tag:$tag,staged:($staged == "true"),distro:$distro,arch:$arch}' \
            > "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME/provenance.json"

      - name: Prepare published release
        if: ${{ !inputs.staged }}
        env:
          GH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
          ARTIFACT_TAG: ${{ inputs.tag }}
          DISTRO: ${{ inputs.distro }}
        run: |
          python3 scripts/prepare-qemu-release.py --tag "$ARTIFACT_TAG" --distro "$DISTRO" --destination published
          jq -s '.[0] + .[1]' "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME/provenance.json" published/inventory-provenance.json > "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME/provenance.next.json"
          mv "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME/provenance.next.json" "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME/provenance.json"

      - name: Restore pinned guest image cache
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qemu-image-cache
          key: qemu-image-v1-${{ runner.arch }}-${{ inputs.distro }}-${{ hashFiles('tests/qemu-image-provenance/manifest.json') }}

      - name: Configure Sentry reporting
        if: github.event_name != 'pull_request'
        env:
          OMG_SMOKE_SENTRY_DSN: ${{ secrets.OMG_SMOKE_SENTRY_DSN }}
        run: python3 scripts/ci-smoke-report.py configure

      - name: Open KVM device permissions
        # The dedicated runner already has device access. Hosted runners may
        # still need an ACL; the next step verifies access in either case.
        run: |
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "/dev/kvm is already accessible"
          else
            if ! command -v setfacl >/dev/null 2>&1; then
              echo "::error::setfacl is missing; install the acl package on this runner (docs/local-ci-runner.md)"
              exit 1
            fi
            sudo -n setfacl -m "u:$(id -u):rw" /dev/kvm
          fi

      - name: Fail fast without KVM
        run: |
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm is missing on this runner; refusing TCG fallback"
            exit 1
          fi
          if [[ ! -w /dev/kvm || ! -r /dev/kvm ]]; then
            echo "::error::/dev/kvm is not accessible on this runner"
            exit 1
          fi
          ls -l /dev/kvm

      - name: Download staged binaries
        if: inputs.staged && !inputs.reuse-ci
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-${{ inputs.distro }}
          path: staged/

      - name: Reuse verified native CI binaries
        if: inputs.staged && inputs.reuse-ci
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRO: ${{ inputs.distro }}
          BUILD_IMAGE: ${{ inputs.distro == 'ubuntu' && 'ubuntu-24.04' || inputs.image }}
          BUILD_FEATURES: ${{ inputs.features }}
        run: |
          if python3 scripts/native-build-artifact.py reuse --distro "$DISTRO" \
            --image "$BUILD_IMAGE" --features "$BUILD_FEATURES" --destination staged --timeout 60 \
            2>&1 | tee "$RUNNER_TEMP/native-build.log"; then
            :
          else
            rc=$?
            evidence="$RUNNER_TEMP/$QEMU_EVIDENCE_NAME/run-native-build"
            mkdir -p "$evidence"
            cp "$RUNNER_TEMP/native-build.log" "$evidence/guest-check.log"
            python3 scripts/ci-smoke-report.py status --distro "$DISTRO" --case-id "qemu-$DISTRO-lifecycle" --status failure --evidence-dir "$evidence"
            exit "$rc"
          fi
          jq -s '.[0] + {native_build:.[1]}' "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME/provenance.json" staged/native-build.json > "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME/provenance.next.json"
          mv "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME/provenance.next.json" "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME/provenance.json"

      - name: Benchmark harness regression checks
        run: |
          scratch="$HOME/.cache/build-targets/omg-benchmark-tests"
          mkdir -p "$scratch"
          PYTHONDONTWRITEBYTECODE=1 TMPDIR="$scratch" \
            python3 -m unittest discover -s tests -p test_benchmark_records.py
          rmdir "$scratch"

      - name: Run disposable guest lifecycle + read benchmarks + inventory rows
        # Staged runs exercise hermetic/container inventory; published runs add network/PTY coverage.
        env:
          STAGED: ${{ inputs.staged }}
        run: |
          args=(--distro "${{ inputs.distro }}" --release "${{ inputs.tag }}" --benchmark --evidence-dir "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME" --inventory-policy tests/qemu-inventory-policy.json --image-policy tests/qemu-image-provenance/manifest.json)
          if [[ "$STAGED" == 'true' ]]; then
            args+=(--staged-dir staged --inventory-tiers "hermetic,container" --inventory-allow-mutations)
          else
            # No nested-container: guests have no docker-in-guest (yet).
            # Declared-ux rows (self-update-*, daemon-foreground) self-skip.
            args+=(--release-dir published --inventory-file published/cases.tsv --inventory-tiers "hermetic,qemu,container,network,pty" --inventory-allow-mutations)
          fi
          args+=(--inventory-isolate-hermetic)
          args+=(--benchmark-transactions 1)
          args+=(--image-cache "$RUNNER_TEMP/qemu-image-cache")
          args+=(--storage-faults)
          args+=(--restrict-egress)
          ./scripts/benchmark-qemu.sh "${args[@]}"

      - name: Save verified guest image cache
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qemu-image-cache
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      - name: Preserve setup failure evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DISTRO: ${{ inputs.distro }}
        run: |
          python3 scripts/ci-smoke-report.py ensure-failure --distro "$DISTRO" \
            --case-id "qemu-$DISTRO-lifecycle" --status "$JOB_STATUS" \
            --evidence-root "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME"

      - name: Export allowlisted guest evidence
        if: always()
        run: |
          sudo -n timeout --kill-after=5s 60s python3 scripts/export-qemu-evidence.py \
            --source "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME" --destination "$RUNNER_TEMP/$QEMU_UPLOAD_NAME" \
            --uid "$(id -u)" --gid "$(id -g)"

      - name: Surface Sentry delivery evidence
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/$QEMU_UPLOAD_NAME" ]]; then
            find "$RUNNER_TEMP/$QEMU_UPLOAD_NAME" -name reporting.log -type f -exec cat {} +
          fi

      - name: Verify Sentry delivery receipts
        if: always()
        run: python3 scripts/ci-smoke-report.py verify --evidence-root "$RUNNER_TEMP/$QEMU_UPLOAD_NAME"

      - name: Upload guest evidence
        id: upload-evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-evidence-${{ inputs.distro }}
          path: ${{ runner.temp }}/${{ env.QEMU_UPLOAD_NAME }}/
          if-no-files-found: error
          retention-days: 30

      - name: Release uploaded local evidence
        if: always() && steps.upload-evidence.outcome == 'success'
        run: sudo -n rm -rf -- "$RUNNER_TEMP/$QEMU_EVIDENCE_NAME" "$RUNNER_TEMP/$QEMU_UPLOAD_NAME"
