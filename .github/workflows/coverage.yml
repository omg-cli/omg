name: Code Coverage

on:
  push:
    branches: [main]
    # Every main commit needs exact-commit evidence for the release gate.
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  changes:
    name: Classify coverage scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci-change-scope.py

  coverage:
    name: Instrumented coverage tests
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl pkgconf openssl libarchive clang cmake

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add llvm-tools-preview

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install coverage tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-llvm-cov,nextest

      - name: Hash lockfile
        id: lockfile
        run: echo "hash=$(sha256sum Cargo.lock | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: coverage-registry-${{ steps.lockfile.outputs.hash }}
          restore-keys: coverage-registry-

      - name: Cache target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: coverage-target-${{ steps.lockfile.outputs.hash }}
          restore-keys: |
            coverage-target-${{ steps.lockfile.outputs.hash }}-
            coverage-target-

      - name: Prepare unprivileged coverage user
        run: |
          useradd --create-home --shell /bin/bash omg-coverage
          coverage_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          coverage_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          chown -R omg-coverage:omg-coverage "$GITHUB_WORKSPACE" "$coverage_cargo_home"
          chmod o+x "$HOME"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' \
            "$coverage_cargo_home" "$coverage_rustup_home" >> "$GITHUB_ENV"

      # Run tests once with --no-report, then generate reports separately
      # This avoids running the full test suite 3 times
      - name: Run tests with coverage instrumentation
        run: |
          # Production root execution intentionally ignores fixture overrides.
          # Run the complete suite with the normal user configuration contract.
          runuser -u omg-coverage -- env \
            HOME=/home/omg-coverage \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$PATH" \
            cargo llvm-cov nextest \
            --features arch,pgp,license \
            --locked \
            --no-fail-fast \
            --no-report

      - name: Generate LCOV report
        if: always()
        run: |
          cargo llvm-cov report \
            --lcov \
            --output-path lcov.info

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Generate HTML report
        if: always()
        run: |
          cargo llvm-cov report --html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          set -o pipefail

          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov report \
            --summary-only \
            | tee -a $GITHUB_STEP_SUMMARY

  coverage-result:
    name: Generate Coverage Report
    needs: [changes, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected coverage
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          if [[ "$REQUIRED" == true ]]; then
            test "$COVERAGE" = success
          elif [[ "$REQUIRED" == false ]]; then
            test "$COVERAGE" = skipped
            echo 'Documentation-only PR: coverage compilation not required.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Missing or invalid coverage selection'
            exit 1
          fi
