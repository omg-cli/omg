name: Code Coverage

on:
  push:
    branches: [main]
    # Every main commit needs exact-commit evidence for the release gate.
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  changes:
    name: Classify coverage scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
      coverage_required: ${{ steps.scope.outputs.coverage_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci-change-scope.py

  coverage:
    name: Instrumented coverage tests
    needs: changes
    if: needs.changes.outputs.coverage_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C llvm-args=-runtime-counter-relocation
      LLVM_PROFILE_FILE_NAME: omg-%p-%m%c.profraw
    container:
      image: archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6

    steps:
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(base-devel git curl pkgconf openssl libarchive clang cmake python zsh fish docker docker-buildx jq)
          # One full upgrade/install transaction keeps the rolling container
          # consistent and avoids resolving the package graph twice.
          if pacman -Syu --noconfirm --needed "${packages[@]}" 2>&1 | tee /tmp/omg-pacman-setup.log; then
            exit 0
          fi

          # The official image lists Fastly before the geo mirror. Only a
          # Fastly transfer failure warrants a synchronized mirror fallback;
          # resolution, signature verification, and hook failures remain fatal.
          if ! grep -Eq 'error: failed retrieving file .* from fastly\.mirror\.pkgbuild\.com' /tmp/omg-pacman-setup.log; then
            exit 1
          fi
          grep -q '^Server = https://geo\.mirror\.pkgbuild\.com/' /etc/pacman.d/mirrorlist
          echo '::warning::Fastly package fetch failed; refreshing from the official geo mirror'
          sed -i '/fastly\.mirror\.pkgbuild\.com/d' /etc/pacman.d/mirrorlist
          pacman -Syyu --noconfirm --needed "${packages[@]}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add llvm-tools-preview

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install coverage tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-llvm-cov@0.9.0,nextest

      - name: Cache instrumented dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          ZSTD_CLEVEL: "6"
        with:
          prefix-key: v3-coverage-continuous-dependencies
          shared-key: arch-f3691b4dde62ba4c4-arch-pgp-license
          # Keep main's reusable cache; PR merge-ref writes cannot warm main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: . -> target/llvm-cov-target
          cache-bin: false
          cache-workspace-crates: false

      - name: Prepare unprivileged coverage user
        run: |
          useradd --create-home --shell /bin/bash omg-coverage
          coverage_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          coverage_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          chown -R omg-coverage:omg-coverage "$GITHUB_WORKSPACE" "$coverage_cargo_home"
          chmod o+x "$HOME"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' \
            "$coverage_cargo_home" "$coverage_rustup_home" >> "$GITHUB_ENV"

      # Run tests once with --no-report, then generate reports separately
      # This avoids running the full test suite 3 times
      - name: Run tests with coverage instrumentation
        id: instrumented_tests
        run: |
          # Production root execution intentionally ignores fixture overrides.
          # Run the complete suite with the normal user configuration contract.
          # Override profile and per-test retries: the first failure stays fatal.
          runuser -u omg-coverage -- env \
            HOME=/home/omg-coverage \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$PATH" \
            cargo llvm-cov clean --workspace
          runuser -u omg-coverage -- env \
            HOME=/home/omg-coverage \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$PATH" \
            cargo llvm-cov nextest \
            --features arch,pgp,license \
            --locked \
            --retries 0 \
            --no-fail-fast \
            --no-report

      - name: Cover genuine Node installation and activation
        id: node_install_tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test ! -e target/nextest/ci/junit.xml
          runuser -u omg-coverage -- env \
            HOME=/home/omg-coverage OMG_RUN_NETWORK_TESTS=1 \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" PATH="$PATH" \
            cargo llvm-cov nextest --features arch,pgp,license --locked \
            --profile ci --retries 0 --no-report \
            -E 'binary(=e2e_runtime_management) & test(=test_use_node_with_version)'
          python3 - <<'PY'
          import json, runpy
          from pathlib import Path
          read = runpy.run_path('scripts/check-test-selection.py')['read_junit']
          report = read(Path('target/nextest/ci/junit.xml').read_bytes())
          expected = 'omg::e2e_runtime_management::test_use_node_with_version'
          assert set(report) == {expected}, 'Expected one exact Node installation case'
          case = report[expected]
          assert not case['runtime_skip'] and len(case['attempts']) == 1
          assert case['attempts'][0]['result'] == 'PASS'
          Path('node-install-coverage.receipt.json').write_text(json.dumps(report, indent=2))
          PY

      - name: Preserve genuine Node coverage evidence
        if: ${{ !cancelled() && (steps.node_install_tests.outcome == 'success' || steps.node_install_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-node-install
          path: |
            target/nextest/ci/junit.xml
            node-install-coverage.receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Cover sandbox descendant cancellation
        id: native_fixture_tests
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          profile_dir="$GITHUB_WORKSPACE/target/llvm-cov-target"
          test -d "$profile_dir"
          # Workspace executables are excluded from the restored dependency cache.
          mapfile -d '' binaries < <(find "$profile_dir/debug/deps" -maxdepth 1 -type f -name 'omg_lib-*' -executable -print0)
          test "${#binaries[@]}" -eq 1
          binary=${binaries[0]}
          evidence_dir="$RUNNER_TEMP/native-coverage-evidence"
          mkdir -p "$evidence_dir"
          sha256sum "$binary" > "$evidence_dir/binary.sha256"

          docker build --tag omg-coverage-sandbox - <<'DOCKERFILE'
          FROM archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
          RUN pacman -Syu --noconfirm --needed apparmor bubblewrap fakeroot python sudo debugedit && pacman -Scc --noconfirm
          DOCKERFILE
          curl -fsS https://raw.githubusercontent.com/moby/profiles/61eaf32614c7c71b60bd8927d3e6a4ffc8ff1f31/seccomp/default.json -o /tmp/coverage-seccomp.json
          echo '536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  /tmp/coverage-seccomp.json' | sha256sum --check
          jq '(.syscalls[] | select(.includes.caps == ["CAP_SYS_ADMIN"]) | .names) += ["pivot_root"]' \
            /tmp/coverage-seccomp.json > /tmp/coverage-sandbox-seccomp.json

          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "$restriction" ]; then
            printf '%s=' "$restriction" | tee "$evidence_dir/apparmor-diagnostic.log"
            cat "$restriction" | tee -a "$evidence_dir/apparmor-diagnostic.log"
          else
            printf '%s unreadable\n' "$restriction" | tee "$evidence_dir/apparmor-diagnostic.log"
          fi
          if docker run --rm --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            --security-opt seccomp=/tmp/coverage-sandbox-seccomp.json --network none \
            --pids-limit 32 --memory 128m --cpus 1 \
            omg-coverage-sandbox /bin/bash -c '
              cat /proc/self/attr/current
              runuser -u nobody -- unshare --user /bin/cat /proc/self/attr/current
            ' >> "$evidence_dir/apparmor-diagnostic.log" 2>&1; then
            diagnostic_status=0
          else
            diagnostic_status=$?
          fi
          printf 'diagnostic exit=%s\n' "$diagnostic_status" | tee -a "$evidence_dir/apparmor-diagnostic.log"

          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          profile_name="omg-coverage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          profile_loaded=0
          container=
          profile_text=$(printf 'abi <abi/4.0>,\nprofile %s flags=(unconfined) {\n  userns,\n}\n' "$profile_name")
          cleanup() {
            local status=$? cleanup_status=0
            trap - EXIT
            if [ -n "$container" ]; then
              if docker rm --force "$container"; then
                container=
              else
                cleanup_status=$?
                printf 'Container removal failed; retaining AppArmor profile %s\n' "$profile_name" >&2
              fi
            fi
            if [ "$profile_loaded" -eq 1 ] && [ -z "$container" ]; then
              printf '%s\n' "$profile_text" | docker run --rm --interactive --network=none \
                --pids-limit=32 --memory=256m --cpus=1 --read-only --tmpfs=/tmp:rw,noexec,nosuid,size=16m \
                --cap-drop=ALL --cap-add=MAC_ADMIN --security-opt=apparmor=unconfined \
                --mount=type=bind,src=/sys/kernel/security,dst=/sys/kernel/security --entrypoint apparmor_parser \
                omg-coverage-sandbox --skip-cache --jobs=1 --remove || cleanup_status=$?
            fi
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT
          fixture_apparmor=unconfined
          if [ -r "$restriction" ] && [ "$(cat "$restriction")" = 1 ]; then
            printf '%s\n' "$profile_text" | docker run --rm --interactive --network=none \
              --pids-limit=32 --memory=256m --cpus=1 --read-only --tmpfs=/tmp:rw,noexec,nosuid,size=16m \
              --cap-drop=ALL --cap-add=MAC_ADMIN --security-opt=apparmor=unconfined \
              --mount=type=bind,src=/sys/kernel/security,dst=/sys/kernel/security --entrypoint apparmor_parser \
              omg-coverage-sandbox --skip-cache --jobs=1 --replace
            profile_loaded=1
            fixture_apparmor=$profile_name
          fi

          # Namespace permissions apply only to this credential-free fixture.
          container=$(docker create --cap-add SYS_ADMIN --security-opt "apparmor=$fixture_apparmor" \
            --security-opt seccomp=/tmp/coverage-sandbox-seccomp.json \
            --network none --add-host aur.archlinux.org:127.0.0.1 --pids-limit 128 --memory 1g --cpus 2 \
            omg-coverage-sandbox /bin/bash -euo pipefail -c '
              mkdir -m 1777 /profiles
              mkdir /evidence
              chage -l nobody > /evidence/fixture-account-before.txt
              chage -E -1 nobody
              chage -l nobody > /evidence/fixture-account-after.txt
              passwd -S nobody | tee /evidence/fixture-account-status.txt
              grep -Eq "^nobody L " /evidence/fixture-account-status.txt
              install -d -m 700 -o nobody -g nobody /home/omg-fixture /var/tmp/omg-fixture-cache /var/tmp/omg-fixture-state /var/tmp/omg-fixture-config
              mkdir -p /var/cache/pacman/pkg /var/lib/pacman/local /var/lib/pacman/sync
              printf "nobody ALL=(root) NOPASSWD: /usr/bin/true\n" > /etc/sudoers.d/omg-fixture
              chmod 440 /etc/sudoers.d/omg-fixture
              visudo -cf /etc/sudoers.d/omg-fixture
              runuser -u nobody -- sudo -n -- /usr/bin/true
              runuser -u nobody -- sudo -n -v
              fixture_binary=/fixture
              fixture_profiles=/profiles
              fixture_evidence=/evidence
              mount -t proc -o nosuid,nodev,noexec proc /proc
              cat /proc/self/mountinfo > /evidence/mountinfo.txt
              command -v fakeroot
              bwrap --ro-bind / / --unshare-pid --proc /proc -- /bin/true
              bwrap --unshare-user --uid "$(id -u nobody)" --gid "$(id -g nobody)" \
                --cap-drop ALL --ro-bind / / --proc /proc -- /usr/bin/id
              cat /proc/self/attr/current | tee /evidence/apparmor-profile.txt
              for network in --share-net --unshare-net; do
                runuser -u nobody -- bwrap --clearenv --share-net --unshare-pid --new-session \
                  --die-with-parent "$network" --ro-bind / / --proc /proc -- /bin/cat /proc/self/attr/current
              done
              /fixture --include-ignored --list > /evidence/registry.txt
              run_case() {
                local test_name=$1
                local case_id=${test_name//::/_}
                local log="$fixture_evidence/$case_id.log"
                local runner=()
                if [[ "$test_name" == package_managers::aur::client::tests::native_isolated_* ]]; then
                  runner=(runuser -u nobody -- env HOME=/home/omg-fixture
                    OMG_CACHE_DIR=/var/tmp/omg-fixture-cache OMG_DATA_DIR=/var/tmp/omg-fixture-state
                    OMG_CONFIG_DIR=/var/tmp/omg-fixture-config OMG_AUR_NATIVE_FIXTURE=isolated-container)
                fi
                grep -Fx "$test_name: test" "$fixture_evidence/registry.txt"
                LLVM_PROFILE_FILE="$fixture_profiles/omg-fixture-$case_id-%p-%m%c.profraw" \
                  timeout --kill-after=2s 35s "${runner[@]}" "$fixture_binary" --exact "$test_name" \
                  --include-ignored --nocapture --test-threads=1 2>&1 | tee "$log"
                grep -Eq "^test result: ok\. 1 passed; 0 failed; 0 ignored;" "$log"
                if grep -Eq "\[omg-skip\]|skipped:|LLVM Profile (Error|Warning)" "$log"; then
                  return 1
                fi
                if [ "$test_name" = config::settings::tests::hardened_aur_settings_refuse_incompatible_build_options ]; then
                  grep -F "[omg-unprivileged-fixture]" "$log" | grep -F "parent_uid=0"
                  grep -F "[omg-unprivileged-fixture-child]" "$log" | grep -F "uid=65534 "
                fi
                local profiles=("$fixture_profiles/omg-fixture-$case_id-"*.profraw)
                for profile in "${profiles[@]}"; do test -s "$profile"; done
                printf "%s\t%s\n" "$test_name" "${#profiles[@]}" >> "$fixture_evidence/passed.tsv"
              }
              cases=(
                package_managers::alpm_direct::tests::native_inventory_and_search_match_pacman
                package_managers::aur::client::tests::cancelling_logged_sandbox_build_terminates_descendants
                cli::self_update::tests::elevated_verifier_rejects_another_users_helper
                core::pacman_conf::tests::missing_pacman_config_is_not_replaced_with_fabricated_repositories
                daemon::handlers::tests::daemon_native_initializer_does_not_block_the_async_executor
                daemon::handlers::tests::daemon_native_retirement_releases_backend_lock_and_executor
                daemon::handlers::tests::daemon_native_cancelled_request_retains_serialization_until_work_finishes
                daemon::handlers::tests::daemon_native_retirement_keeps_final_join_off_the_request_executor
                package_managers::alpm_direct::tests::security_update_eligibility_respects_repository_priority_and_ignore_filters
                package_managers::alpm_direct::tests::list_installed_fast_includes_pacman
                package_managers::alpm_worker::tests::initialization_errors_are_returned_to_the_caller
                package_managers::pacman_db::db::tests::fast_path_and_libalpm_counts_agree_on_fixture_local_db
                package_managers::pacman_db::db::tests::fast_path_and_libalpm_counts_preserve_distinct_soname_dependencies
                package_managers::aur::client::tests::attended_review_requires_hardened_confirmation_even_with_yes
                package_managers::aur::client::tests::native_isolated_fixture_builds_reviewed_source_without_installing
                package_managers::aur::client::tests::native_isolated_history_requires_hardened_review
                config::settings::tests::hardened_aur_settings_refuse_incompatible_build_options
                package_managers::aur::client::tests::final_install_rechecks_current_hardened_profile_before_elevation
                core::usage::tests::elevated_state_roundtrip_preserves_caller_files
              )
              printf "%s\n" "${cases[@]}" > /evidence/expected-tests.txt
              for test_name in "${cases[@]}"; do
                if [ "$test_name" = core::usage::tests::elevated_state_roundtrip_preserves_caller_files ]; then
                  mount -t tmpfs -o nosuid,nodev,noexec,mode=755 tmpfs /var/lib
                  printf isolated > /var/lib/.omg-state-isolation-fixture
                  caller=$(mktemp -d /tmp/omg-state-caller.XXXXXX)
                  printf caller-history-sentinel > "$caller/history-target"
                  ln -s history-target "$caller/history.json"
                  printf caller-usage-sentinel > "$caller/usage.json"
                  chown -hR nobody: "$caller"
                  OMG_DATA_DIR="$caller" run_case "$test_name"
                else
                  run_case "$test_name"
                fi
              done
            ')
          docker cp "$binary" "$container:/fixture"
          if timeout --kill-after=5s 180s docker start --attach "$container" 2>&1 | tee "$evidence_dir/tests.log"; then
            run_status=0
          else
            run_status=$?
          fi
          collection_status=0
          docker cp "$container:/evidence/." "$evidence_dir/" || collection_status=$?
          docker cp "$container:/profiles/." "$profile_dir/" || collection_status=$?
          if [ "$run_status" -ne 0 ]; then exit "$run_status"; fi
          test "$collection_status" -eq 0
          python3 - "$binary" "$profile_dir" "$evidence_dir" "$(git rev-parse HEAD)" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          binary, profiles, evidence = map(Path, sys.argv[1:4])
          expected = (evidence / 'expected-tests.txt').read_text().splitlines()
          passed = [line.split('\t') for line in (evidence / 'passed.tsv').read_text().splitlines()]
          assert expected and len(expected) == len(set(expected)), 'Invalid fixture selection'
          assert [row[0] for row in passed] == expected, 'Incomplete or reordered fixture results'
          tests = []
          for name, count in passed:
              files = sorted(profiles.glob('omg-fixture-' + name.replace('::', '_') + '-*.profraw'))
              assert len(files) == int(count) and files, 'Missing fixture profiles'
              assert all(path.is_file() and not path.is_symlink() and path.stat().st_size > 0 for path in files), 'Empty or unsafe fixture profile'
              tests.append({'name': name, 'profiles': [
                  {'name': path.name, 'bytes': path.stat().st_size,
                   'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in files]})
          receipt = {'source_commit': sys.argv[4], 'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'tests': tests}
          (evidence / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Preserve native fixture coverage evidence
        if: ${{ !cancelled() && (steps.native_fixture_tests.outcome == 'success' || steps.native_fixture_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-native-fixtures
          path: ${{ runner.temp }}/native-coverage-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Generate LCOV report
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') }}
        run: |
          cargo llvm-cov report \
            --lcov \
            --output-path lcov.info

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Generate HTML report
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') && (failure() || github.event_name == 'workflow_dispatch') }}
        run: |
          cargo llvm-cov report --html

      - name: Upload HTML coverage report
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') && (failure() || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 30

      - name: Preserve LCOV evidence
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov-${{ github.run_id }}-${{ github.run_attempt }}
          path: lcov.info
          retention-days: 14
          if-no-files-found: warn

      - name: Generate region evidence
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') }}
        run: |
          if cargo llvm-cov report --json --output-path coverage-regions.json --verbose 2> coverage-region-export.log; then
            :
          else
            status=$?
            tail -c 28000 coverage-region-export.log >&2
            exit "$status"
          fi
          gzip -9 coverage-regions.json

      - name: Validate local coverage evidence
        id: coverage_sanity
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('coverage_check', 'scripts/check-line-coverage.py')
          checker = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = checker
          spec.loader.exec_module(checker)
          report = checker.read_coverage(Path('lcov.info'), 'producer')
          sources = checker.source_blobs(Path.cwd(), os.environ['GITHUB_SHA'])
          checker.region_evidence(Path('coverage-regions.json.gz'), report, sources, 'producer')
          print('PASS: current producer coverage evidence is valid')
          PY

      - name: Collect invalid coverage diagnostics
        if: ${{ !cancelled() && steps.coverage_sanity.outcome == 'failure' }}
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shlex, stat, subprocess, tarfile
          from pathlib import Path
          root = Path.cwd()
          profiles = root / 'target/llvm-cov-target'
          output = Path(os.environ['RUNNER_TEMP']) / 'coverage-diagnostics'
          output.mkdir(exist_ok=False)
          budget = 128 * 1024 * 1024
          receipt = {'schema_version': 1, 'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'job': os.environ['GITHUB_JOB'], 'input_budget_bytes': budget,
              'flags': {key: os.environ.get(key) for key in ('RUSTFLAGS', 'LLVM_PROFILE_FILE_NAME')},
              'files': [], 'objects': [], 'tools': {}}
          workflow = (root / '.github/workflows/coverage.yml').read_bytes()
          receipt['workflow_sha256'] = hashlib.sha256(workflow).hexdigest()
          job = workflow.decode().split('\n  coverage:\n', 1)[1].split('\n  coverage-result:', 1)[0]
          receipt['image'] = re.search(r'(?m)^      image: (.+)$', job)[1]
          def command(argv):
              try:
                  result = subprocess.run(argv, capture_output=True, text=True, timeout=10)
                  return {'exit_code': result.returncode, 'output': (result.stdout + result.stderr)[:8192]}
              except (OSError, subprocess.TimeoutExpired) as error:
                  return {'error': str(error)}
          receipt['tools']['rustc'] = command(['rustc', '-vV'])
          receipt['tools']['cargo-llvm-cov'] = command(['cargo', 'llvm-cov', '--version'])
          receipt['tools']['nextest'] = command(['cargo', 'nextest', '--version'])
          libdir = command(['rustc', '--print', 'target-libdir'])
          if libdir.get('exit_code') == 0:
              tools = Path(libdir['output'].strip()).parent / 'bin'
              for name in ('llvm-cov', 'llvm-profdata'):
                  receipt['tools'][name] = command([str(tools / name), '--version'])
          export_log = root / 'coverage-region-export.log'
          object_paths = set()
          if export_log.is_file() and not export_log.is_symlink():
              with export_log.open('rb') as stream:
                  log = stream.read(2 * 1024 * 1024 + 1)
              receipt['export_log_truncated'] = len(log) > 2 * 1024 * 1024
              command_log = re.sub(r'\x1b\[[0-9;]*m', '', log[:2 * 1024 * 1024].decode('utf-8', errors='replace'))
              for line in command_log.splitlines():
                  match = re.search(r'Running `(.*)`$', line)
                  if match:
                      try:
                          argv = shlex.split(match[1])
                      except ValueError:
                          receipt['export_log_unparsed'] = True
                          continue
                      object_paths.update(argv[i + 1] for i, arg in enumerate(argv[:-1]) if arg == '-object')
          for name in sorted(object_paths):
              path = Path(name)
              entry = {'path': name}
              try:
                  if (path.is_symlink() or not path.resolve().is_relative_to(root)
                          or not path.resolve().is_relative_to(profiles.resolve())):
                      raise ValueError('object is a symlink or outside the profile target')
                  descriptor = os.open(path, os.O_RDONLY | getattr(os, 'O_NOFOLLOW', 0))
                  with os.fdopen(descriptor, 'rb') as stream:
                      before = os.fstat(stream.fileno())
                      if not stat.S_ISREG(before.st_mode):
                          raise ValueError('object is not a regular file')
                      entry['bytes'] = remaining = before.st_size
                      digest = hashlib.sha256()
                      while remaining:
                          data = stream.read(min(remaining, 1024 * 1024))
                          if not data:
                              raise ValueError('object shrank during hashing')
                          digest.update(data)
                          remaining -= len(data)
                      entry['sha256'] = digest.hexdigest()
                      after = os.fstat(stream.fileno())
                      entry['changed_during_collection'] = (
                          after.st_size != before.st_size or after.st_mtime_ns != before.st_mtime_ns)
              except (OSError, ValueError) as error:
                  entry['omitted'] = str(error)
              receipt['objects'].append(entry)
          expected = [profiles / (root.name + '.profdata'), profiles / (root.name + '-profraw-list')]
          candidates = expected + sorted(profiles.glob('*.profraw')) + [export_log]
          used = 0
          archive = output / 'profiles.tar.gz'
          with tarfile.open(archive, 'w:gz', compresslevel=1) as bundle:
              for path in candidates:
                  entry = {'path': path.relative_to(root).as_posix()}
                  receipt['files'].append(entry)
                  try:
                      info = path.lstat()
                      entry['bytes'] = info.st_size
                      if not stat.S_ISREG(info.st_mode) or not path.resolve().is_relative_to(root):
                          raise ValueError('not a regular contained file; symlinks are not followed')
                      if used + info.st_size > budget:
                          raise ValueError('input byte budget exceeded')
                      descriptor = os.open(path, os.O_RDONLY | getattr(os, 'O_NOFOLLOW', 0))
                      with os.fdopen(descriptor, 'rb') as stream:
                          digest = hashlib.sha256()
                          class ProfileReader:
                              def read(self, size):
                                  data = stream.read(size)
                                  digest.update(data)
                                  entry['captured_bytes'] = entry.get('captured_bytes', 0) + len(data)
                                  return data
                          member = tarfile.TarInfo(entry['path'])
                          member.size = info.st_size
                          used += info.st_size
                          bundle.addfile(member, ProfileReader())
                          entry['sha256'] = digest.hexdigest()
                          changed = os.fstat(stream.fileno())
                          entry['changed_during_collection'] = (
                              changed.st_size != info.st_size or changed.st_mtime_ns != info.st_mtime_ns)
                  except (OSError, ValueError) as error:
                      entry['omitted'] = str(error)
          receipt['raw_profiles_missing'] = not any(
              entry['path'].endswith('.profraw') and 'omitted' not in entry for entry in receipt['files'])
          receipt['admitted_input_bytes'] = used
          receipt['captured_input_bytes'] = sum(entry.get('captured_bytes', 0) for entry in receipt['files'])
          receipt['complete'] = bool(object_paths) and not receipt['raw_profiles_missing'] and not any(
              entry.get('omitted') or entry.get('changed_during_collection')
              for entry in receipt['files'] + receipt['objects']) and not receipt.get('export_log_truncated') and not receipt.get('export_log_unparsed') and all(
              receipt['tools'].get(name, {}).get('exit_code') == 0
              for name in ('rustc', 'cargo-llvm-cov', 'nextest', 'llvm-cov', 'llvm-profdata'))
          with archive.open('rb') as stream:
              receipt['archive_sha256'] = hashlib.file_digest(stream, 'sha256').hexdigest()
          receipt['archive_bytes'] = archive.stat().st_size
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({'diagnostics': str(output), 'complete': receipt['complete'], 'captured_input_bytes': receipt['captured_input_bytes']}))
          PY

      - name: Preserve invalid coverage diagnostics
        if: ${{ !cancelled() && steps.coverage_sanity.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-diagnostics/
          retention-days: 7
          if-no-files-found: error

      - name: Preserve region evidence
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-regions-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage-regions.json.gz
          retention-days: 14
          if-no-files-found: error

      - name: Generate function coverage evidence
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') }}
        run: |
          LLVM_COV_FLAGS='-show-functions -sources src/core/security/audit.rs' \
            cargo llvm-cov report > coverage-functions.txt
          test -s coverage-functions.txt

      - name: Preserve function coverage evidence
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-functions
          path: coverage-functions.txt
          retention-days: 14
          if-no-files-found: error

      - name: Coverage summary
        if: ${{ !cancelled() && (steps.instrumented_tests.outcome == 'success' || steps.instrumented_tests.outcome == 'failure') }}
        run: |
          set -o pipefail

          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov report \
            --summary-only \
            | tee -a $GITHUB_STEP_SUMMARY

  coverage-result:
    name: Generate Coverage Report
    needs: [changes, coverage]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require selected coverage
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.coverage_required }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          if [[ "$REQUIRED" == true ]]; then
            test "$COVERAGE" = success
          elif [[ "$REQUIRED" == false ]]; then
            test "$COVERAGE" = skipped
            echo 'PR changes cannot affect Rust coverage: instrumentation not required.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Missing or invalid coverage selection'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.coverage_required == 'true'
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install pinned Rust syntax validator
        if: needs.changes.outputs.coverage_required == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Require coverage to meet the exact base commit
        if: needs.changes.outputs.coverage_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/require-base-coverage.py

      - name: Preserve coverage comparison evidence
        if: ${{ always() && needs.changes.outputs.coverage_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage-comparison/
          if-no-files-found: error
          retention-days: 30
