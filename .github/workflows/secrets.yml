name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        # The MIT-licensed CLI works for personal and organization repositories.
        # Preserve event-range scanning; manual runs inspect reachable history.
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          log_opts="$GITHUB_SHA"
          if [[ "$SCAN_BASE" =~ ^[0-9a-f]{40}$ ]] \
             && [[ ! "$SCAN_BASE" =~ ^0+$ ]] \
             && git cat-file -e "${SCAN_BASE}^{commit}" 2>/dev/null; then
            log_opts="$SCAN_BASE..$GITHUB_SHA"
          fi
          gitleaks git --redact --no-banner --log-opts="$log_opts" .

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: TruffleHog OSS (PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # Pin the scanner image too; the action otherwise defaults to latest.
          version: "3.97.4@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4"
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Resolve TruffleHog scan base (Push)
        id: hog_base
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"

          # `github.event.before` is all-zeros on a branch's first push and may
          # be absent locally after a force-push. Try fetching the exact object;
          # if GitHub no longer serves it, scan from the oldest reachable commit
          # rather than comparing the default branch to itself (which can be an
          # empty range when the default branch is the pushed branch).
          if [[ -n "$BEFORE" ]] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null \
              || true
          fi

          if [[ -n "$BEFORE" ]] \
             && [[ ! "$BEFORE" =~ ^0+$ ]] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git rev-list --max-parents=0 "$GITHUB_SHA" | head -n 1)"
            test -n "$base"
            echo "::notice::Push base unavailable; scanning reachable history from $base"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: TruffleHog OSS (Push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # Pin the scanner image too; the action otherwise defaults to latest.
          version: "3.97.4@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4"
          path: ./
          base: ${{ steps.hog_base.outputs.base }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: TruffleHog OSS (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # Pin the scanner image too; the action otherwise defaults to latest.
          version: "3.97.4@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4"
          path: ./
          extra_args: --only-verified
