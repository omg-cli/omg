name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish)"
        required: false
        default: "true"
      sync_existing_tag:
        description: "Sync an existing published tag to R2 instead of building"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # GATE ON CI
  #
  # release.yml triggers independently of ci.yml, so without this job a tag
  # could be published while CI is red. Publishing is only allowed for a
  # commit with successful platform, security, coverage and staged guest runs.
  # Non-publishing dry runs
  # bypass this gate; existing-tag sync uses the published release path.
  # ════════════════════════════════════════════════════════════════════════════
  gate-on-ci:
    name: "Gate on CI"
    if: github.event_name != 'workflow_dispatch' || inputs.sync_existing_tag == ''
    runs-on: ubuntu-24.04
    # Long enough to watch an in-progress 90-minute QEMU run to completion;
    # a tag pushed seconds after `main` lands must not miss the run.
    timeout-minutes: 100
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require successful CI and benchmark runs for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            echo "Dry run requested; publication disabled"
            exit 0
          fi

          # Published attestations must use the same tag ref required by resync.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Publishing requires a version tag ref; use a branch only for dry runs"
            exit 1
          fi

          scripts/require-workflow-success.sh ci.yml "$GITHUB_SHA" CI
          scripts/require-workflow-success.sh benchmark.yml "$GITHUB_SHA" Benchmark
          scripts/require-workflow-success.sh audit.yml "$GITHUB_SHA" "Security Audit"
          scripts/require-workflow-success.sh secrets.yml "$GITHUB_SHA" "Secret Scanning"
          scripts/require-workflow-success.sh codeql.yml "$GITHUB_SHA" CodeQL
          scripts/require-workflow-success.sh coverage.yml "$GITHUB_SHA" Coverage
          scripts/require-workflow-success.sh docker-e2e.yml "$GITHUB_SHA" "Docker E2E"
          scripts/require-workflow-success.sh qemu-matrix.yml "$GITHUB_SHA" "Staged QEMU"

  # ════════════════════════════════════════════════════════════════════════════
  # BUILD RELEASE ARTIFACTS
  # ════════════════════════════════════════════════════════════════════════════

  build-arch:
    name: "Build Arch"
    needs: gate-on-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl pkgconf openssl libarchive clang
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          export RUSTFLAGS="-C target-cpu=x86-64-v2"
          cargo build --release --no-default-features --features arch,pgp,license --locked

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-arch"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-arch/"
          cp target/release/omgd "omg-v${VERSION}-x86_64-linux-arch/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-arch/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-arch.tar.gz" "omg-v${VERSION}-x86_64-linux-arch"
          sha256sum "omg-v${VERSION}-x86_64-linux-arch.tar.gz" > "omg-v${VERSION}-x86_64-linux-arch.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-build
          path: omg-v*.tar.gz*

  build-debian:
    name: "Build Debian"
    needs: gate-on-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libssl-dev \
            libapt-pkg-dev \
            clang \
            cmake
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo build --release --no-default-features --features debian,pgp,license --locked

      - name: Package
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-debian"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-debian/"
          cp target/release/omgd "omg-v${VERSION}-x86_64-linux-debian/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-debian/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-debian.tar.gz" "omg-v${VERSION}-x86_64-linux-debian"
          sha256sum "omg-v${VERSION}-x86_64-linux-debian.tar.gz" > "omg-v${VERSION}-x86_64-linux-debian.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-build
          path: omg-v*.tar.gz*

  build-ubuntu:
    name: "Build Ubuntu"
    needs: gate-on-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libapt-pkg-dev \
            pkg-config \
            libssl-dev \
            clang \
            cmake

      - name: Install Rust toolchain
        # Match rust-toolchain.toml (1.95.0) instead of floating "stable"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - name: Build
        run: cargo build --release --no-default-features --features debian,pgp,license --locked

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-ubuntu"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-ubuntu/"
          cp target/release/omgd "omg-v${VERSION}-x86_64-linux-ubuntu/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-ubuntu/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz" "omg-v${VERSION}-x86_64-linux-ubuntu"
          sha256sum "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz" > "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-build
          path: omg-v*.tar.gz*

  build-fedora:
    name: "Build Fedora"
    needs: gate-on-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: fedora:latest@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    steps:
      - name: Install Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git clang cmake openssl-devel pkgconfig findutils curl \
            rpm dnf sqlite yum-utils fedora-release
          rpm --initdb
          dnf makecache --refresh
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --no-default-features --features fedora,pgp,license --locked

      - name: Package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-fedora"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-fedora/"
          cp target/release/omgd "omg-v${VERSION}-x86_64-linux-fedora/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-fedora/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-fedora.tar.gz" "omg-v${VERSION}-x86_64-linux-fedora"
          sha256sum "omg-v${VERSION}-x86_64-linux-fedora.tar.gz" > "omg-v${VERSION}-x86_64-linux-fedora.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-build
          path: omg-v*.tar.gz*

  build-macos:
    name: "Build macOS (ARM64)"
    needs: gate-on-ci
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Match rust-toolchain.toml (1.95.0) instead of floating "stable"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - name: Build
        run: cargo build --release --no-default-features --features macos,pgp,license --locked

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-aarch64-darwin"
          cp target/release/omg "omg-v${VERSION}-aarch64-darwin/"
          cp target/release/omgd "omg-v${VERSION}-aarch64-darwin/"
          cp README.md LICENSE "omg-v${VERSION}-aarch64-darwin/"
          tar -czf "omg-v${VERSION}-aarch64-darwin.tar.gz" "omg-v${VERSION}-aarch64-darwin"
          shasum -a 256 "omg-v${VERSION}-aarch64-darwin.tar.gz" > "omg-v${VERSION}-aarch64-darwin.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build
          path: omg-v*.tar.gz*

  # ════════════════════════════════════════════════════════════════════════════
  # PUBLISH RELEASE
  # ════════════════════════════════════════════════════════════════════════════

  release:
    name: "Create Release"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-arch, build-debian, build-ubuntu, build-fedora, build-macos]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Install SBOM metadata toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - name: Install SBOM generator
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate locked CycloneDX SBOM
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          fi
          test -n "$VERSION"
          cargo metadata --locked --format-version 1 > /dev/null
          cargo cyclonedx --format json --all-features --target all \
            --override-filename "omg-v${VERSION}.cdx"
          test -s "omg-v${VERSION}.cdx.json"
          git diff --exit-code -- Cargo.lock
          mkdir -p artifacts/release-metadata
          mv "omg-v${VERSION}.cdx.json" artifacts/release-metadata/

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: artifacts/release-metadata/omg-v*.cdx.json
          retention-days: 30
          if-no-files-found: error

      - name: Collect and verify exact release files
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          fi
          test -n "$VERSION"
          ./scripts/collect-release-artifacts.sh "$VERSION" artifacts release

      - name: Attest release archives and SBOM
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.cdx.json

      - name: Generate Release Notes
        id: release_notes
        # Single source of truth for the notes structure lives in the script;
        # keep the generated verification section in sync with how artifacts
        # are actually attested and checked by install.sh / self-update.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          fi
          test -n "$VERSION"

          ./scripts/gen-release-notes.sh "${VERSION}" > release_notes.md
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Generated Release Notes Preview:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat release_notes.md
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Verify remote release tag
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_TAG: v${{ steps.release_notes.outputs.version }}
        run: |
          tag_commit=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" |
            awk -v ref="refs/tags/$RELEASE_TAG" '
              $2 == ref { direct = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print (peeled != "" ? peeled : direct) }
            ')
          if [[ "$tag_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::Expected $RELEASE_TAG to identify $EXPECTED_COMMIT, got ${tag_commit:-missing}"
            exit 1
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.release_notes.outputs.version }}
          body_path: release_notes.md
          files: release/*
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true

  # ════════════════════════════════════════════════════════════════════════════
  # SYNC TO CLOUDFLARE R2 (omg-releases bucket)
  # ════════════════════════════════════════════════════════════════════════════

  sync-r2:
    name: "Sync to Cloudflare R2"
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    needs: [release]
    if: >-
      ${{
        always() &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')) &&
        (inputs.sync_existing_tag != '' || needs.release.result == 'success')
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.sync_existing_tag == ''
        with:
          path: artifacts

      - name: Resolve release version
        env:
          SYNC_EXISTING_TAG: ${{ inputs.sync_existing_tag }}
        run: |
          if [[ -n "$SYNC_EXISTING_TAG" ]]; then
            if [[ ! "$SYNC_EXISTING_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release tag: $SYNC_EXISTING_TAG"
              exit 1
            fi
            VERSION="${SYNC_EXISTING_TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          fi
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Collect and verify exact release files
        if: inputs.sync_existing_tag == ''
        run: |
          ./scripts/collect-release-artifacts.sh "$VERSION" artifacts release

      - name: Download and verify published release
        if: inputs.sync_existing_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_EXISTING_TAG: ${{ inputs.sync_existing_tag }}
        run: |
          release_json=$(gh release view "$SYNC_EXISTING_TAG" --json isDraft,tagName)
          if ! jq -e --arg tag "$SYNC_EXISTING_TAG" \
            '.isDraft == false and .tagName == $tag' <<< "$release_json" >/dev/null; then
            echo "::error::$SYNC_EXISTING_TAG is not a published release"
            exit 1
          fi

          ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SYNC_EXISTING_TAG")
          source_type=$(jq -r '.object.type' <<< "$ref_json")
          source_digest=$(jq -r '.object.sha' <<< "$ref_json")
          if [[ "$source_type" == "tag" ]]; then
            tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$source_digest")
            source_type=$(jq -r '.object.type' <<< "$tag_json")
            source_digest=$(jq -r '.object.sha' <<< "$tag_json")
          fi
          if [[ "$source_type" != "commit" || ! "$source_digest" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve $SYNC_EXISTING_TAG to a commit"
            exit 1
          fi

          mkdir release
          gh release download "$SYNC_EXISTING_TAG" \
            --pattern "omg-${SYNC_EXISTING_TAG}-*.tar.gz" \
            --pattern "omg-${SYNC_EXISTING_TAG}-*.tar.gz.sha256" \
            --dir release
          mapfile -t archives < <(find release -maxdepth 1 -type f -name '*.tar.gz' -print | sort)
          mapfile -t checksums < <(find release -maxdepth 1 -type f -name '*.tar.gz.sha256' -print | sort)
          if (( ${#archives[@]} != 5 || ${#checksums[@]} != 5 )); then
            echo "::error::Expected five archives and five checksums"
            exit 1
          fi
          (cd release && sha256sum --check ./*.sha256)
          for archive in "${archives[@]}"; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$source_digest" \
              --source-ref "refs/tags/$SYNC_EXISTING_TAG" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      - name: Install pinned wrangler from vendored lockfile
        run: npm ci --prefix .github/deps/release-tools

      - name: Upload release artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WRANGLER="$PWD/.github/deps/release-tools/node_modules/.bin/wrangler"
          "$WRANGLER" --version
          # Wrangler 4 defaults R2 CLI commands to local Miniflare storage.
          # Without --remote the job succeeds against a runner-local fake bucket.
          for artifact in release/omg-v*.tar.gz; do
            [ -f "$artifact" ] || continue
            basename=$(basename "$artifact")
            content_type="application/octet-stream"
            "$WRANGLER" r2 object put "omg-releases/$basename" --remote \
              --file="$artifact" \
              --content-type="$content_type" \
              --cache-control="public, max-age=31536000, immutable"
            echo "✓ Uploaded $basename"
          done

          for checksum in release/omg-v*.sha256; do
            [ -f "$checksum" ] || continue
            basename=$(basename "$checksum")
            "$WRANGLER" r2 object put "omg-releases/$basename" --remote \
              --file="$checksum" \
              --content-type="text/plain" \
              --cache-control="public, max-age=31536000, immutable"
            echo "✓ Uploaded $basename"
          done

      - name: Verify round-trip integrity of uploaded objects
        # Fail closed: if a single uploaded object cannot be re-downloaded
        # byte-identical, abort *before* the latest-version marker publishes
        # the release to clients.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WRANGLER="$PWD/.github/deps/release-tools/node_modules/.bin/wrangler"
          verify_dir="$(mktemp -d)"

          for artifact in release/omg-v*.tar.gz; do
            [ -f "$artifact" ] || continue
            basename=$(basename "$artifact")
            "$WRANGLER" r2 object get "omg-releases/$basename" --remote \
              --file="$verify_dir/$basename" >/dev/null
            expected=$(sha256sum "$artifact" | awk '{print $1}')
            actual=$(sha256sum "$verify_dir/$basename" | awk '{print $1}')
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Round-trip verification failed for $basename"
              exit 1
            fi
            echo "✓ Round-trip verified: $basename"
          done

          for checksum in release/omg-v*.sha256; do
            [ -f "$checksum" ] || continue
            basename=$(basename "$checksum")
            "$WRANGLER" r2 object get "omg-releases/$basename" --remote \
              --file="$verify_dir/$basename" >/dev/null
            if ! cmp -s "$checksum" "$verify_dir/$basename"; then
              echo "::error::Round-trip verification failed for $basename"
              exit 1
            fi
            echo "✓ Round-trip verified: $basename"
          done

      # Publish this last: clients only learn about the new version after every
      # archive and checksum is present in R2 AND round-trip verified.
      - name: Upload latest-version marker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WRANGLER="$PWD/.github/deps/release-tools/node_modules/.bin/wrangler"
          # Keep the bucket-served installer current so a pinned release URL
          # never serves a stale bootstrap script (getomg.xyz/install.sh is
          # deployed with the website; this mirror must not drift).
          cp install.sh release/install.sh
          (cd release && sha256sum install.sh > install.sh.sha256)
          "$WRANGLER" r2 object put "omg-releases/install.sh" --remote \
            --file=release/install.sh \
            --content-type="application/x-sh" \
            --cache-control="public, max-age=0, must-revalidate"
          "$WRANGLER" r2 object put "omg-releases/install.sh.sha256" --remote \
            --file=release/install.sh.sha256 \
            --content-type="text/plain" \
            --cache-control="public, max-age=0, must-revalidate"
          verify_dir="$(mktemp -d)"
          "$WRANGLER" r2 object get "omg-releases/install.sh" --remote \
            --file="$verify_dir/install.sh" >/dev/null
          if ! cmp -s "$verify_dir/install.sh" release/install.sh; then
            echo "::error::install.sh round-trip verification failed"
            exit 1
          fi
          "$WRANGLER" r2 object get "omg-releases/install.sh.sha256" --remote \
            --file="$verify_dir/install.sh.sha256" >/dev/null
          if ! cmp -s "$verify_dir/install.sh.sha256" release/install.sh.sha256; then
            echo "::error::install.sh.sha256 round-trip verification failed"
            exit 1
          fi
          echo "✓ Updated installer"
          echo -n "$VERSION" > release/latest-version
          "$WRANGLER" r2 object put "omg-releases/latest-version" --remote \
            --file=release/latest-version \
            --content-type="text/plain" \
            --cache-control="no-store"
          echo "✓ Updated latest-version → $VERSION"
