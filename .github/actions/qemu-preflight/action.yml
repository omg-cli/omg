name: QEMU preflight
description: Verify workflow selection, daemon lifecycle, and QEMU harness contracts
runs:
  using: composite
  steps:
    - name: Workflow selection regression checks
      shell: bash
      run: |
        python3 -m unittest discover -s tests -p test_qemu_workflow.py
        python3 -m unittest discover -s tests -p test_qemu_companion_completeness.py
        python3 -m unittest discover -s tests -p test_qemu_verdict.py
        python3 -m unittest discover -s scripts -p test_prepare_qemu_release.py
        python3 -m unittest discover -s scripts -p test_qemu_arch_preparation.py
        python3 -m unittest discover -s scripts -p test_qemu_daemon_contract.py
        python3 -m unittest discover -s scripts -p test_qemu_apt_abi.py
        python3 -m unittest discover -s scripts -p test_qemu_apt_abi_evidence.py
        python3 -m unittest discover -s scripts -p test_qemu_guest_profile.py
        python3 -m unittest discover -s scripts -p test_qemu_image_provenance.py
        python3 -m unittest discover -s scripts -p test_qemu_image_cache.py
        python3 -m unittest discover -s scripts -p test_qemu_review.py
        python3 -m unittest discover -s scripts -p test_qemu_maintenance_request.py
        python3 -m unittest discover -s scripts -p test_qemu_process_isolation.py
        python3 -m unittest discover -s scripts -p test_qemu_boot_diagnostics.py
        python3 scripts/run_qemu_boot_timeout_budget.py discover -s scripts -p test_qemu_boot_timeout_budget.py
        python3 -m unittest discover -s scripts -p test_qemu_runner_isolation.py
        python3 -m unittest discover -s scripts -p test_qemu_controller_floor.py

    - name: Verify update identity and daemon lifecycle rejection cases
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
        python3 -B -m unittest discover -s scripts -p test_update_identity_runner.py -v
        python3 -B -m unittest discover -s scripts -p test_debian_daemon_catalog_lifecycle.py -v

    - name: Verify harness and reporting fixtures before guest builds
      shell: bash
      run: |
        ./scripts/test-release-smoke.sh
        ./scripts/test-qa-file-issue.sh
        ./scripts/test-qa-audit.sh
        ./scripts/test-qa-open-pr.sh
        python3 -m unittest discover -s scripts -p test_qemu_reporting.py
        python3 -m unittest discover -s scripts -p test_qemu_backend_mismatch.py
        python3 -m unittest discover -s scripts -p test_qemu_transaction_summary.py
        python3 -m unittest discover -s scripts -p test_ci_smoke_report.py
        sudo -n python3 -m unittest discover -s scripts -p test_qemu_health.py
        python3 -m unittest discover -s scripts -p test_qemu_crash_provision.py
        python3 -m unittest discover -s scripts -p test_qemu_network_scope.py
        python3 -m unittest discover -s scripts -p test_qemu_storage_faults.py
        python3 -m unittest discover -s scripts -p test_qemu_egress.py
        sudo -n python3 -m unittest discover -s scripts -p test_export_qemu_evidence.py
