[package]
name = "omg-env-portable-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0.3"

# cargo-machete cannot see usage inside #[path]-included production modules, so
# it reports every dependency needed by src/core/env/portable.rs as unused.
[package.metadata.cargo-machete]
ignored = ["anyhow", "serde", "serde_json", "toml"]
