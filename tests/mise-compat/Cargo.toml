[package]
name = "omg-mise-compat-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
toml = { version = "1.0.3", features = ["preserve_order"] }
serde_json = "1.0.149"
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

# cargo-machete cannot see usage inside #[path]-included production modules, so
# it reports every dependency needed by the mise modules as unused.
[package.metadata.cargo-machete]
ignored = ["anyhow", "serde_json", "toml", "tracing"]
