# deny.toml - Supply chain security policy for OMG
# https://embarkstudios.github.io/cargo-deny/
#
# AUTHORITY for advisory ignores: the [advisories] ignore list below is the
# single source of truth. .cargo/audit.toml (cargo-audit) mirrors it because
# cargo-audit does not read this file — when adding/removing an advisory
# ignore, update BOTH files in the same change.

[advisories]
# Escalate unmaintained and unsound advisories only when they affect a direct
# workspace crate. Vulnerabilities and yanked packages are denied.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "No patched rsa release; OMG performs public-key signature verification only, never network-observable private-key decryption" },
]

[licenses]
# Allow specific licenses only (common open-source licenses)
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "AGPL-3.0-or-later",
]
# Confidence threshold for license detection
confidence-threshold = 0.8

# Additional licenses are scoped to the implementations that require them;
# OMG itself is MIT-licensed.
exceptions = [
  { allow = [
    "bzip2-1.0.6",
  ], crate = "libbz2-rs-sys@0.2.6" },
  { allow = [
    "GPL-3.0",
  ], crate = "alpm" },
  { allow = [
    "GPL-3.0",
  ], crate = "alpm-sys" },
  { allow = [
    "LGPL-2.0-or-later",
  ], crate = "buffered-reader" },
  { allow = [
    "LGPL-2.0-or-later",
  ], crate = "sequoia-openpgp" },
]

# Specific clarifications for crates with complex licensing
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Warn when multiple versions of the same crate are used (reduces binary size)
multiple-versions = "warn"
# Deny wildcards in dependencies (breaks reproducibility)
wildcards = "deny"
# Allow multiple versions of these crates (common ecosystem pain points)
skip = [
  { name = "windows-sys", version = "*" },
  { name = "windows_x86_64_msvc", version = "*" },
  { name = "windows_x86_64_gnu", version = "*" },
  { name = "windows_i686_msvc", version = "*" },
]
# Deny specific crates (known bad actors or security issues)
deny = [
  # Example: { name = "openssl-sys", reason = "Use rustls instead for better security" },
]
# Skip tree analysis for these crates
skip-tree = []

[sources]
# Deny crates from unknown registries
unknown-registry = "deny"
# Deny crates from unknown git repos
unknown-git = "deny"
# Allow specific git sources for supply chain security
# Official ALPM and the pinned OpenSSL vendoring fix documented under vendor/.
allow-git = [
  "https://gitlab.archlinux.org/archlinux/alpm/alpm.git",
  "https://github.com/rust-openssl/rust-openssl",
]
