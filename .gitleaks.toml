# Gitleaks config: default rules plus narrowly scoped fixture/cache exceptions.
#
# The QA excerpt-scrub harness (scripts/test-qa-file-issue.sh) intentionally
# embeds a PAT-*shaped but non-functional fixture token
# (`ghp_fixturefakepattern…`) to prove failure excerpts are scrubbed before
# filing. Full-history scans (fetch-depth: 0) flag the fixture commit.
# This allowlist matches ONLY strings containing the literal infix
# "fixturefake", which no real credential contains; every other rule and
# every other finding is unaffected. See issue #276.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic QA scrub-test fixture, never a credential (issue #276)"
regexes = ['''ghp_fixturefake[A-Za-z0-9]*''']

# This public rust-cache namespace is not an authentication key. Require the
# exact input line AND workflow path; other values and files remain scanned.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public QEMU rust-cache namespace"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*prefix-key: qemu-staged-v1\s*$''']
paths = ['''^\.github/workflows/qemu-(matrix|lane)\.yml$''']
